





name: Bug Report
description: Report a bug
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! Please fill out below."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ishastra Version
      description: Output of `ishastra --version`
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Scope Gate
        - API
        - Adapters
        - Workers
        - Scheduler
        - CLI
        - Helm Chart
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant logs (sanitized)
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues
          required: true
        - label: I've tested on latest main branch
          required: true