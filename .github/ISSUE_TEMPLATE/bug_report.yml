name: Bug report
description: Report a defect in Strix. Do not include credentials or customer data.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately through the
        repository's **Security → Report a vulnerability** form, not as a
        public issue. See `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: The smallest sequence that reproduces the problem.
      placeholder: |
        1. Start Strix with ...
        2. Submit ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Strix version
      description: Output of `strix --version` or the container tag.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Authorization mode
      options:
        - auto
        - global
        - managed
        - not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, API keys, targets and customer data.
      render: shell
    validations:
      required: false
