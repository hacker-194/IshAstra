# Dependency Review Configuration for Strix
# https://github.com/actions/dependency-review-action

# Severity thresholds: fail the build if vulnerabilities of this severity or higher are found
# Options: low, moderate, high, critical
fail-on-severity: high

# Licenses that are explicitly allowed
# Using SPDX license identifiers
allow-licenses:
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - BSD-4-Clause
  - Apache-2.0
  - ISC
  - Python-2.0
  - MPL-2.0
  - PSF-2.0
  - Zlib
  - Unlicense
  - CC0-1.0
  - CC-BY-4.0
  - CC-BY-SA-4.0
  - OFL-1.1
  - BSL-1.0

# Licenses that are explicitly denied (copyleft and other restrictive licenses)
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - LGPL-2.0
  - LGPL-2.1
  - LGPL-3.0
  - AGPL-3.0
  - EPL-1.0
  - EPL-2.0
  - CDDL-1.0
  - CDDL-1.1
  - CPL-1.0
  - OSL-3.0

# Allow transitive dependencies to have licenses not in allow-list if they're not direct dependencies
# This is more permissive - only direct dependencies need to be in allow-list
allow-licenses-if-transitive: false

# Configuration for vulnerability scanning
vulnerability-check:
  # Whether to check for vulnerabilities in dependencies
  enabled: true
  # Minimum severity to fail on
  severity-threshold: high
  # Ignore vulnerabilities that have been fixed in a newer version we cannot upgrade to
  ignore-fixed: false