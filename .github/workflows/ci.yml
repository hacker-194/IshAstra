name: CI

on:
  push:
    branches: [main, master, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, master, "release/*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

  ISHASTRA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ishastra_test
  ISHASTRA_DB: postgresql://postgres:postgres@localhost:5432/ishastra_test

  TRIVY_CACHE_DIR: /tmp/trivy-cache

  LICENSE_CHECKER_CACHE_DIR: /tmp/license-checker-cache

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Refuse tracked secrets and runtime state



        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -Ei '(^|/)\.env($|\.)|(^|/)(prod-secrets|security-reports)/|\.(db|db-wal|db-shm|sqlite|sqlite3)$|\.(pem|key)$|(^|/)kubeseal$' | grep -v '\.example$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Tracked secrets or runtime state must not be committed:"
            echo "$offenders"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Ruff check
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.14.0
      - name: Update Helm dependencies
        run: helm dependency update ./deploy/helm/ishastra
      - name: Helm lint production
        run: helm lint ./deploy/helm/ishastra -f ./deploy/helm/ishastra/values-prod.yaml
      - name: Helm lint staging
        run: helm lint ./deploy/helm/ishastra -f ./deploy/helm/ishastra/values-staging.yaml
      - name: Helm lint dev
        run: helm lint ./deploy/helm/ishastra -f ./deploy/helm/ishastra/values-dev.yaml

  kubeconform:
    name: Kubeconform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
        with:
          version: v3.14.0
      - name: Update Helm dependencies
        run: helm dependency update ./deploy/helm/ishastra
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin
      - name: Validate production manifests
        run: |
          helm template ishastra ./deploy/helm/ishastra -f ./deploy/helm/ishastra/values-prod.yaml | kubeconform -strict -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -skip 'ServiceMonitor,PrometheusRule,Prometheus,Alertmanager'
      - name: Validate staging manifests
        run: |
          helm template ishastra ./deploy/helm/ishastra -f ./deploy/helm/ishastra/values-staging.yaml | kubeconform -strict -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -skip 'ServiceMonitor,PrometheusRule,Prometheus,Alertmanager'
      - name: Validate dev manifests
        run: |
          helm template ishastra ./deploy/helm/ishastra -f ./deploy/helm/ishastra/values-dev.yaml | kubeconform -strict -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -skip 'ServiceMonitor,PrometheusRule,Prometheus,Alertmanager'

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,otel,k8s-jobs]" -c constraints.txt
      - name: Run mypy
        run: mypy src/

  test:
    name: Test SQLite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:

        python-version: ["3.12", "3.13", "3.14"]
    env:

      ISHASTRA_DB: ":memory:"
      ISHASTRA_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,otel,k8s-jobs]" -c constraints.txt
      - name: Run tests
        run: pytest -q
      - name: Scope authorization coverage gate


        run: coverage report --include="src/ishastra/security/authorization/scope.py" --fail-under=65
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage-sqlite-${{ matrix.python-version }}
          path: coverage.json
          retention-days: 14

  test-postgres:
    name: Test PostgreSQL (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISHASTRA_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/ishastra_test
    strategy:
      fail-fast: false
      matrix:


        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ishastra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ishastra_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,otel,postgres,k8s-jobs]" -c constraints.txt
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres -d ishastra_test; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1
      - name: Run tests
        run: pytest -q
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage-postgres-${{ matrix.python-version }}
          path: coverage.json
          retention-days: 14

  test-scope-dns-variations:
    name: Scope gate under DNS variation (${{ matrix.dns }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dns: [system, offline]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run scope gate tests



        run: |
          if [ "${{ matrix.dns }}" = "offline" ]; then
            sudo env "PATH=$PATH" unshare -n \
              python -m pytest -q --no-cov -p no:cacheprovider \
              tests/unit/test_scope.py tests/unit/test_scope_gate.py
          else
            python -m pytest -q --no-cov -p no:cacheprovider \
              tests/unit/test_scope.py tests/unit/test_scope_gate.py
          fi

  test-scope-properties:
    name: Property tests - scope authorization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install test dependencies
        run: pip install -e ".[test]" -c constraints.txt
      - name: Run scope property tests
        run: python -m pytest -q -o addopts= tests/security/test_scope_properties.py

  formal-verification:
    name: TLA+ model check (address policy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch TLC


        run: |
          curl -fsSL -o docs/tla/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: Model check the scope address policy
        working-directory: docs/tla




        run: |
          set -o pipefail
          java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC \
            -metadir /tmp/tlc-metadir -workers auto -nowarning \
            -config JudgeAddresses.cfg JudgeAddresses.tla | tee /tmp/tlc.log
          grep -q "Model checking completed. No error has been found." /tmp/tlc.log

  live-scanners:
    name: Live scanners against loopback lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install nmap and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nmap unzip
          pip install -e ".[dev]" -c constraints.txt
      - name: Install pinned nuclei and official templates
        run: |
          curl -fsSL -o /tmp/nuclei.zip \
            https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          unzip -q /tmp/nuclei.zip nuclei -d /usr/local/bin
          chmod +x /usr/local/bin/nuclei
          nuclei -update-templates
      - name: Run live nmap and nuclei tests
        env:
          ISHASTRA_LIVE_TOOL_TESTS: "1"
        run: pytest -q --no-cov tests/unit/test_adapters.py -k "nmap or nuclei"

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, test-postgres]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,test]" -c constraints.txt
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Start Ishastra API server
        env:
          ISHASTRA_TEST_MODE: "1"
          # The workflow-level default points at PostgreSQL, but this job does not
          # install the postgres extra, so the server refused to start.
          ISHASTRA_DATABASE_URL: ""
          # A file-backed database, not ":memory:": the worker writes while the
          # API reads, and an in-memory database answers "table is locked".
          ISHASTRA_DB: "/tmp/ishastra-e2e.db"
          ISHASTRA_SCOPE_FILE: "/tmp/scope.json"
          ISHASTRA_API_KEY: "test-key-12345678901234567890123456789012"
          ISHASTRA_ENCRYPTION_KEY: "i2q1RZNk5PGHI2AiS4waZgbfgwivSD+BEy14nBdumzQ="
          ISHASTRA_AUDIT_HMAC_KEY: "dGVzdC1hdWQtaG1hYy1rZXktMzJieXRlcw=="
          ISHASTRA_WORKERS: "1"
          ISHASTRA_SKIP_REDIS_INIT: "1"
        run: |

          cat > /tmp/scope.json << 'EOF'
          {
            "program": "Test Program",
            "authorized_by": "Test Authorizer",
            "authorization_ref": "TEST-001",
            "include": ["127.0.0.1"],
            "exclude": [],
            "authorized_networks": ["127.0.0.0/8"],
            "allowed_ports": [8080],
            "allow_broad_networks": false,
            "auth": {
              "users": [
                {"id": "test-user-1", "cookies": [{"name": "sessionid", "value": "test-session-123"}], "headers": {}, "bearer": ""},
                {"id": "test-user-2", "cookies": [{"name": "sessionid", "value": "test-session-456"}], "headers": {}, "bearer": ""}
              ]
            },
            "collab": {"host": "127.0.0.1", "port": 0}
          }
          EOF

          # Detached from this step's process group; otherwise the runner kills
          # the server when the step ends and every test sees ECONNREFUSED.
          nohup setsid python -m uvicorn ishastra.api.app:create_app \
            --host 127.0.0.1 --port 8000 --factory > /tmp/uvicorn.log 2>&1 &

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health >/dev/null || { cat /tmp/uvicorn.log; exit 1; }
      - name: Run E2E tests
        env:
          ISHASTRA_E2E_BASE_URL: "http://127.0.0.1:8000"
        run: pytest -q --no-cov tests/e2e/ -m e2e
      - name: Stop server
        if: always()
        run: |
          # Bracketed so the pattern cannot match this step's own shell.
          pkill -f "[u]vicorn ishastra.api.app:create_app" || true
          echo "--- server log ---"
          tail -20 /tmp/uvicorn.log 2>/dev/null || true

  security:
    name: Dependency and source scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install scanners
        run: |
          pip install -e ".[dev]" -c constraints.txt
          pip install "bandit[toml]" pip-audit
      - name: Bandit report
        # Report only: the security-gate job fails on HIGH findings. Failing
        # here instead would skip the gate entirely.
        run: bandit -r src/ --exit-zero -f json -o bandit-results.json
      - name: pip-audit report
        # Audit the runtime set the image actually installs. Resolving
        # constraints.txt as a requirements file pulls in optional extras
        # (angr, selenium, mitmproxy) and exceeds pip's resolver depth.
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install -q --upgrade pip
          /tmp/audit-venv/bin/pip install -q -c constraints.txt ".[postgres,k8s-jobs]"
          /tmp/audit-venv/bin/pip install -q pip-audit
          /tmp/audit-venv/bin/pip-audit --format=json --output=pip-audit-results.json || true
      - name: Upload scan reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-results.json
            pip-audit-results.json
          retention-days: 14

  readiness-check:
    name: Readiness check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, test-postgres, e2e-tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev,otel,k8s-jobs]" -c constraints.txt
      - name: Run readiness check
        run: python scripts/readiness_check.py

  detection-benchmark:
    name: Detection benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, test, test-postgres]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run detection benchmark
        run: python scripts/detection_benchmark.py --no-nuclei --no-nmap --allow-unmeasured

  license-check:
    name: License compatibility check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install license checker
        run: |
          pip install -e ".[dev]" -c constraints.txt
          pip install pip-licenses
      - name: Check licenses
        run: |
          pip-licenses --format=json --with-license-file --with-urls --with-description --with-author > licenses.json
          python -c "
          import json
          import sys
          
          with open('licenses.json') as f:
              licenses = json.load(f)
          
          # Normalized, space-separated license names; pip-licenses returns
          # free-text strings, not only SPDX identifiers.
          allowed_licenses = {
              'mit', 'bsd', 'bsd 2 clause', 'bsd 3 clause', 'bsd 4 clause',
              'apache 2.0', 'apache software license', 'isc',
              'python 2.0', 'python software foundation license',
              'mpl 2.0', 'mozilla public license 2.0', 'psf 2.0', 'zlib',
              'unlicense', 'cc0 1.0', 'cc by 4.0', 'cc by sa 4.0',
              'ofl 1.1', 'bsl 1.0', 'artistic', 'mpl 1.1'
          }
          


          failures = []
          warnings = []
          
          for pkg in licenses:
              license_text = pkg.get('License', '').strip()
              name = pkg.get('Name', '')
          

              # pip-licenses lists every option of a dual-licensed package
              # (Artistic License; GPL), and choosing the permissive option is
              # legitimate, so a package passes when any one option is allowed.
              segments = [
                  ' '.join(
                      part.lower().replace('(', ' ').replace(')', ' ')
                      .replace('-', ' ').replace('_', ' ').split()
                  )
                  for part in license_text.split(';')
                  if part.strip()
              ]
              is_allowed = any(
                  allowed in segment for segment in segments for allowed in allowed_licenses
              )
          
              if not is_allowed and license_text:
                  failures.append(f'{name}: {license_text}')
              elif license_text and not is_allowed:
                  warnings.append(f'{name}: {license_text} (unrecognized but non-empty)')
          
          if failures:
              print('LICENSE CHECK FAILED:')
              for f in failures:
                  print(f'  - {f}')
              sys.exit(1)
          else:
              print('LICENSE CHECK PASSED: All dependencies have compatible licenses (MIT/BSD/Apache-2.0/ISC/PSF/MPL)')
              if warnings:
                  print('WARNINGS:')
                  for w in warnings:
                      print(f'  - {w}')
          "
      - name: Upload license report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  sbom:
    name: Generate SBOM and scan vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SBOM with syft
        run: syft packages dir:. -o spdx-json=sbom.spdx.json
      - name: Scan vulnerabilities with grype
        run: grype dir:. -o json > grype-results.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30
      - name: Upload grype results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: grype-results
          path: grype-results.json
          retention-days: 30

  security-gate:
    name: Security gate - fail on HIGH findings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [sbom]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Download security reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: security-reports
          path: security-reports
      - name: Download grype results
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: grype-results
          path: grype-results
      - name: Evaluate security reports (fail closed)
        # A missing, empty, unreadable or malformed report fails here. Tests:
        # tests/unit/test_security_gate.py
        run: python scripts/security_gate.py --exceptions security-gate-exceptions.json

  deployment-ref-check:
    name: Validate deployment tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Validate release version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
              exit 1
            fi
          fi

  docker:
    name: Build container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, type-check, test, test-postgres, security-gate, helm-lint, kubeconform, readiness-check, detection-benchmark, license-check, formal-verification]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ishastra:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image


        run: |
          set -euo pipefail
          docker run -d --name ishastra-smoke -p 18000:8000 \
            -e ISHASTRA_API_KEY=smoke-test-key-0123456789abcdef \
            -e ISHASTRA_AUDIT_HMAC_KEY=c21va2UtaG1hYy1rZXktMDEyMzQ1Njc4OQ== \
            -e ISHASTRA_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            ishastra:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/health >/dev/null 2>&1; then
              echo "healthy after ${i} attempt(s)"; break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/api/health
          docker rm -f ishastra-smoke

  container-scan:
    name: Container vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.56.2
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-delay 2 \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: Build image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ishastra:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy vulnerability scanner
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile .trivyignore.yaml --format table ishastra:scan
      - name: Run Trivy config scanner (Dockerfile)
        run: |
          trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml .
      - name: Run Trivy config scanner (Kubernetes manifests)
        run: |
          trivy config --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile .trivyignore.yaml ./deploy/helm/ishastra/
