# GitHub CodeQL Analysis Workflow
# Process: GitHub Actions reads this YAML to run CodeQL security analysis
# Effect: Detects security vulnerabilities in Python code on push/PR/schedule
# No secrets written in plain text
# User instruction: "update all"

name: CodeQL Analysis

on:
  push:
    branches: [main, master, "release/*"]
  pull_request:
    branches: [main, master, "release/*"]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        language: [python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true