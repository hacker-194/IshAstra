name: Docker Security & SBOM

on:
  push:
    branches: [main, master, release/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan for new vulnerabilities
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Trivy severity threshold'
        required: true
        default: 'HIGH,CRITICAL'
        type: choice
        options:
          - 'CRITICAL'
          - 'HIGH,CRITICAL'
          - 'MEDIUM,HIGH,CRITICAL'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TRIVY_VERSION: 0.56.2
  SYFT_VERSION: v1.10.0

jobs:
  build:
    name: Build Hardened Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64

      - name: Output image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  vulnerability-scan:
    name: Trivy Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image from registry
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ needs.build.outputs.image-tag }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Trivy config scanner (Dockerfile, docker-compose)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          exit-code: '0'

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  sbom-generation:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image from registry
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ needs.build.outputs.image-tag }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v1
        with:
          image: ${{ needs.build.outputs.image-tag }}
          format: 'spdx-json,cyclonedx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

      - name: Attest SBOM to image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.image-digest }}
          predicate-path: sbom.spdx.json
          predicate-type: https://spdx.dev/Document

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          verbose: true
          failure-threshold: error

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet

      - name: Validate docker-compose.prod.yml
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  security-gate:
    name: Security Gate
    needs: [vulnerability-scan, sbom-generation, dockerfile-lint, compose-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check vulnerability scan results
        if: failure() && needs.vulnerability-scan.result == 'failure'
        run: |
          echo "❌ Vulnerability scan failed - blocking release"
          exit 1

      - name: Check Dockerfile lint
        if: failure() && needs.dockerfile-lint.result == 'failure'
        run: |
          echo "❌ Dockerfile lint failed"
          exit 1

      - name: Check Compose validation
        if: failure() && needs.compose-validation.result == 'failure'
        run: |
          echo "❌ Docker Compose validation failed"
          exit 1

      - name: All security checks passed
        run: |
          echo "✅ All security gates passed"
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          echo "Digest: ${{ needs.build.outputs.image-digest }}"