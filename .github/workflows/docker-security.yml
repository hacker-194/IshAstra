name: Docker Security & SBOM

permissions:
  contents: read

on:
  push:
    branches: [main, master, release/*]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  schedule:

    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Trivy severity threshold'
        required: true
        default: 'HIGH,CRITICAL'
        type: choice
        options:
          - 'CRITICAL'
          - 'HIGH,CRITICAL'
          - 'MEDIUM,HIGH,CRITICAL'

concurrency:
  # Per-run group: a stuck historical run must never block new scans.
  group: docker-security-${{ github.ref }}-${{ github.run_id }}

env:
  REGISTRY: ghcr.io
  # GHCR repository names must be lowercase.
  IMAGE_NAME: ${{ github.repository_owner }}/ishastra
  TRIVY_VERSION: 0.56.2
  SYFT_VERSION: v1.10.0

jobs:
  build:
    name: Build Hardened Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          platforms: linux/amd64,linux/arm64

      - name: Output image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"

  vulnerability-scan:
    name: Trivy Vulnerability Scan
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download image from registry
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: '.trivyignore.yaml'
          vuln-type: 'os,library'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run Trivy config scanner (Dockerfile, docker-compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: ${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}
          exit-code: '0'

      - name: Upload Trivy config results
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # v3
        if: always() && hashFiles('trivy-config.sarif') != ''
        with:
          sarif_file: 'trivy-config.sarif'
          category: 'trivy-config'

  sbom-generation:
    name: Generate SBOM
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # sbom-action attaches the SBOM to the GitHub release on tag pushes.
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Download image from registry
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Attest SBOM to image
        if: github.event_name != 'pull_request'
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b  # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.image-digest }}
          sbom-path: sbom.spdx.json

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
          verbose: true
          failure-threshold: error

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    env:
      # Validation-only values; docker-compose.yml intentionally has no defaults.
      POSTGRES_PASSWORD: ci-compose-postgres-password
      GRAFANA_PASSWORD: ci-compose-grafana-password
      KEYCLOAK_ADMIN_PASSWORD: ci-compose-keycloak-password
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Validate root compose file
        run: docker compose config --quiet

      - name: Validate single-host compose file
        run: docker compose -f deploy/single-host/compose.yaml config --quiet

  security-gate:
    name: Security Gate
    needs: [build, vulnerability-scan, sbom-generation, dockerfile-lint, compose-validation]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check vulnerability scan results
        if: needs.vulnerability-scan.result != 'success'
        run: |
          echo "❌ Vulnerability scan failed - blocking release"
          exit 1

      - name: Check Dockerfile lint
        if: needs.dockerfile-lint.result != 'success'
        run: |
          echo "❌ Dockerfile lint failed"
          exit 1

      - name: Check Compose validation
        if: needs.compose-validation.result != 'success'
        run: |
          echo "❌ Docker Compose validation failed"
          exit 1

      - name: All security checks passed
        run: |
          echo "✅ All security gates passed"
          echo "Image: ${{ needs.build.outputs.image-tag }}"
          echo "Digest: ${{ needs.build.outputs.image-digest }}"