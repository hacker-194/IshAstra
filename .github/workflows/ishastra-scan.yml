name: Ishastra Assessment

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target URL (must be listed in the committed scope document)"
        required: true
        type: string
      scope-file:
        description: "Path to the signed scope document in this repository"
        required: true
        default: "scope.json"
        type: string
      profile:
        description: "Assessment profile"
        required: true
        default: "web"
        type: choice
        options: [web, web-deep, api, api-deep, network]
      fail-on-findings:
        description: "Fail the run when any finding is produced"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ishastra-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: Authorized assessment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ishastra from this repository
        run: pip install .

      - name: Require the scope document
        run: |
          test -f "${{ inputs.scope-file }}" || {
            echo "::error::missing scope document ${{ inputs.scope-file }}; scope files are gitignored, so commit the signed scope with: git add -f ${{ inputs.scope-file }}"
            exit 1
          }

      - name: Run assessment
        env:
          TARGET: ${{ inputs.target }}
          SCOPE_FILE: ${{ inputs.scope-file }}
          PROFILE: ${{ inputs.profile }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          set -euo pipefail
          ishastra assess run --target "$TARGET" --scope "$SCOPE_FILE" \
            --profile "$PROFILE" --output ishastra-results.sarif --actor "github-actions"
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            python - <<'PY'
          import json, sys
          data = json.load(open("ishastra-results.sarif", encoding="utf-8"))
          results = sum(len(run.get("results", [])) for run in data.get("runs", []))
          print(f"ishastra: {results} finding(s)")
          sys.exit(1 if results else 0)
          PY
          fi

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('ishastra-results.sarif') != '' 
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # v3
        with:
          sarif_file: ishastra-results.sarif
          category: ishastra
