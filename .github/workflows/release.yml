name: Release

# Pushing a `v*` tag is the release: the job re-checks the tagged commit, builds
# the sdist + wheel, smoke-tests the wheel in a clean venv, and publishes a
# GitHub release with those artifacts. Publishing to PyPI is intentionally not
# wired up; add a trusted-publishing job here when that is decided.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"

      - name: Test the tagged commit
        run: pytest -q

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install --quiet dist/*.whl
          /tmp/wheel/bin/strix --version
          /tmp/wheel/bin/python -c "from strix.proof import VERSION as proof_version; print(proof_version)"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Strix $GITHUB_REF_NAME" \
            --generate-notes
