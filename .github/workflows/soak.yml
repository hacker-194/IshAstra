name: Soak Tests

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  soak-assessment-load:
    name: Soak - Assessment Load (~500 jobs, 2h)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run soak assessment load test
        env:
          ISHASTRA_LOG_LEVEL: WARNING
        run: |
          python -m tests.soak.test_soak_assessment_load \
            --jobs 500 \
            --duration-hours 2 \
            --workers 4 \
            --submit-concurrency 20 \
            --profiles web,web-deep,api \
            --mix 0.6,0.25,0.15

  soak-sigterm:
    name: Soak - SIGTERM Mid-Assessment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run soak SIGTERM test
        env:
          ISHASTRA_LOG_LEVEL: WARNING
        run: |
          python -m tests.soak.test_soak_sigterm \
            --jobs 50 \
            --sigterm-delay 10 \
            --workers 2

  soak-backup-restore:
    name: Soak - Backup/Restore Round-Trip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: |
            constraints.txt
            pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run soak backup/restore test
        env:
          ISHASTRA_LOG_LEVEL: WARNING
        run: |
          python -m tests.soak.test_soak_backup_restore \
            --jobs 30 \
            --workers 2
