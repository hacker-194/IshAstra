# Accepted findings for the scanner tooling bundled in the runtime image.
#
# Every entry is scoped to a path, so a new vulnerability in any other
# component still fails `Trivy Vulnerability Scan` (exit-code 1). Entries
# expire: once the date passes Trivy reports them again and the decision has
# to be re-made deliberately.
#
# nuclei is pinned to v3.11.1 because that is the latest upstream release, and
# its Go dependency tree (stdlib, x/net, x/crypto, grpc, kin-openapi, go-git)
# is compiled into the binary — the only fix is a rebuilt upstream release.

vulnerabilities:
  - id: CVE-2026-100347
    paths: [usr/local/bin/nuclei]
    expired_at: 2027-05-01
  - id: CVE-2026-100348
    paths: [usr/local/bin/nuclei]
    expired_at: 2027-05-01
