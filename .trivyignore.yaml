# The nuclei-templates release ships the credential material its detection
# templates replay against vulnerable targets (e.g. the VNERA keypairs for
# CVE-2023-34039 and the default JWT/API-key patterns). These are public test
# payloads, not secrets of this project, and the directory is pinned by
# NUCLEI_TEMPLATES_VERSION, so any change there shows up as a new alert.
secrets:
  - id: private-key
    paths: [/var/lib/ishastra/nuclei-templates/**]
    expired_at: 2027-05-01
  - id: jwt-token
    paths: [/var/lib/ishastra/nuclei-templates/**]
    expired_at: 2027-05-01
  - id: gcp-service-account
    paths: [/var/lib/ishastra/nuclei-templates/**]
    expired_at: 2027-05-01
  - id: symfony-default-secret
    paths: [/var/lib/ishastra/nuclei-templates/**]
    expired_at: 2027-05-01
