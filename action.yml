name: Ishastra authorized assessment
description: Run a scope-authorized assessment and upload SARIF to GitHub code scanning.
author: Ishastra

branding:
  icon: shield
  color: purple

inputs:
  target:
    description: URL to assess. Must be listed in the scope document.
    required: true
  scope-file:
    description: Path to the signed scope document in the repository.
    required: false
    default: scope.json
  profile:
    description: Assessment profile (web, web-crawl, web-deep, api, api-deep, network, ports).
    required: false
    default: web
  fail-on-findings:
    description: Fail the step when any finding is produced.
    required: false
    default: "false"
  ishastra-version:
    description: Pinned ishastra version to install.
    required: false
    default: "3.5.0"

outputs:
  sarif:
    description: Path to the SARIF report written by the assessment.
    value: ${{ steps.assess.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        python-version: "3.12"

    - name: Install ishastra
      shell: bash
      run: python -m pip install --disable-pip-version-check "ishastra==${{ inputs.ishastra-version }}"

    - name: Run authorized assessment
      id: assess
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        PROFILE: ${{ inputs.profile }}
        SCOPE_FILE: ${{ inputs.scope-file }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        set -euo pipefail
        ishastra assess --target "$TARGET" --profile "$PROFILE" --scope "$SCOPE_FILE" \
          --output ishastra.sarif
        echo "sarif=ishastra.sarif" >> "$GITHUB_OUTPUT"
        if [ "$FAIL_ON_FINDINGS" = "true" ]; then
          python - <<'PY'
          import json, sys
          data = json.load(open("ishastra.sarif", encoding="utf-8"))
          results = sum(len(run.get("results", [])) for run in data.get("runs", []))
          print(f"ishastra: {results} finding(s)")
          sys.exit(1 if results else 0)
          PY
        fi

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d  # v3
      with:
        sarif_file: ishastra.sarif
        category: ishastra
