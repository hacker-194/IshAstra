<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">IshAstra — Authorization-First Security Assessment Platform</title>
  <desc id="desc">Animated banner: an authorized request passes through the Scope Gate to its target, while an unauthorized request is denied at the gate.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.6" stop-color="#0f1630"/>
      <stop offset="1" stop-color="#1a1145"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="950" cy="172" r="200" fill="url(#glow)"/>

    <!-- Scan line -->
    <rect x="0" y="-2" width="1200" height="2" fill="#22d3ee" opacity="0.16">
      <animate attributeName="y" values="-2;340" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- ============ Left: wordmark ============ -->
    <text x="64" y="86" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" letter-spacing="4" fill="#22d3ee">OPEN-SOURCE SECURITY PLATFORM</text>

    <text x="60" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="1" fill="url(#brand)">IshAstra</text>

    <rect x="64" y="202" width="0" height="4" rx="2" fill="url(#brand)">
      <animate attributeName="width" from="0" to="140" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>

    <text x="64" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#e2e8f0">Authorization-First Security Assessment Platform</text>

    <text x="64" y="284" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#94a3b8">default-deny  ·  signed audit chain  ·  TLA+ model-checked</text>

    <!-- ============ Right: gate animation ============ -->
    <!-- Rail -->
    <line x1="786" y1="172" x2="1114" y2="172" stroke="#334155" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- Source + target nodes -->
    <circle cx="770" cy="172" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="770" cy="172" r="5" fill="#38bdf8"/>
    <text x="770" y="210" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="2" fill="#94a3b8">REQUEST</text>

    <circle cx="1130" cy="172" r="16" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <circle cx="1130" cy="172" r="5" fill="#34d399"/>
    <text x="1130" y="210" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="2" fill="#94a3b8">TARGET</text>

    <!-- Authorized packet (passes through) -->
    <circle r="6" fill="#34d399" opacity="0">
      <animateMotion path="M770,172 L1130,172" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.42;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.40;0.44;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Unauthorized packet (stopped at gate) -->
    <circle r="6" fill="#f87171" opacity="0">
      <animateMotion path="M770,172 L898,172" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.72;1"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.72;0.78;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Gate pulse ring -->
    <circle cx="950" cy="173" r="48" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5">
      <animate attributeName="r" values="48;82" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Denied flash ring -->
    <circle cx="950" cy="173" r="56" fill="none" stroke="#f87171" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.72;0.76;0.88;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Gate (shield + lock) -->
    <path d="M950 122 L990 138 V172 C990 198 972 214 950 224 C928 214 910 198 910 172 V138 Z" fill="#0b1228" stroke="url(#brand)" stroke-width="3"/>
    <path d="M944 168 V162 a6 6 0 0 1 12 0 V168" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <rect x="939" y="168" width="22" height="17" rx="3" fill="#22d3ee"/>
    <circle cx="950" cy="176" r="2.5" fill="#0b1228"/>

    <text x="950" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="3" fill="#22d3ee">SCOPE GATE</text>
    <text x="950" y="268" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" fill="#64748b">L1 · L2 · L3</text>

    <!-- Status labels -->
    <text x="1040" y="150" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2" fill="#34d399" opacity="0">✓ ALLOWED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.25;0.42;0.47;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="850" y="150" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2" fill="#f87171" opacity="0">✕ DENIED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.75;0.88;0.93;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#7dd3fc" stroke-opacity="0.15"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
