apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ishastra-regions
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - region: us-east
            cluster: us-east
          - region: eu-west
            cluster: eu-west
          - region: ap-south
            cluster: ap-south
  template:
    metadata:
      name: ishastra-{{region}}
      labels:
        app.kubernetes.io/part-of: ishastra-platform
        topology.kubernetes.io/region: '{{region}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/useishastra/ishastra.git
        targetRevision: main
        path: deploy/kustomize/overlays/{{region}}
      destination:
        name: '{{cluster}}'
        namespace: ishastra-{{region}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
