




















apiVersion: v1
kind: Namespace
metadata:
  name: ishastra
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-tunnel
  namespace: ishastra
  labels:
    app: cloudflare-tunnel
spec:
  selector:
    app: cloudflare-tunnel
  ports:
  - name: http
    port: 80
    targetPort: 8080
  - name: https
    port: 443
    targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: ishastra
  labels:
    app: cloudflare-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2024.10.0
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        - <TUNNEL_UUID>
        ports:
        - containerPort: 8080
        - containerPort: 8443
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: credentials
          mountPath: /etc/cloudflared/credentials
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: cloudflare-tunnel-config
      - name: credentials
        secret:
          secretName: cloudflare-tunnel-credentials
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: ishastra
data:
  config.yaml: |
    tunnel: <TUNNEL_UUID>
    credentials-file: /etc/cloudflared/credentials/credentials.json
    ingress:
    - hostname: api.yourdomain.com
      service: http://ishastra-ishastra-api:8000
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s
        keepAliveTimeout: 90s
    - hostname: app.yourdomain.com
      service: http://ishastra-ishastra-api:8000
      originRequest:
        noTLSVerify: true
    - service: http_status:404
    metrics: 0.0.0.0:2000
    loglevel: info
    auto-update: true