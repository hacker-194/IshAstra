# Template: a Cloudflare Tunnel ingress for IshAstra.
#
# Fill in before applying, or it will be rejected or fail to start:
#   <TUNNEL_UUID>     the tunnel id from `cloudflared tunnel create`
#   api.yourdomain.com / app.yourdomain.com   your hostnames
#   cloudflare-tunnel-credentials  a Secret holding credentials.json for that tunnel
#
# cloudflared dials out to Cloudflare; it opens no inbound listener, so this file
# publishes no Service. Readiness is served on the metrics port (2000).

apiVersion: v1
kind: Namespace
metadata:
  name: ishastra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-tunnel
  namespace: ishastra
  labels:
    app: cloudflare-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflare-tunnel
  template:
    metadata:
      labels:
        app: cloudflare-tunnel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2024.10.0
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        - <TUNNEL_UUID>
        ports:
        - name: metrics
          containerPort: 2000
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: credentials
          mountPath: /etc/cloudflared/credentials
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: cloudflare-tunnel-config
      - name: credentials
        secret:
          secretName: cloudflare-tunnel-credentials
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-tunnel-config
  namespace: ishastra
data:
  config.yaml: |
    tunnel: <TUNNEL_UUID>
    credentials-file: /etc/cloudflared/credentials/credentials.json
    ingress:
    - hostname: api.yourdomain.com
      service: http://ishastra-ishastra-api:8000
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s
        keepAliveTimeout: 90s
    - hostname: app.yourdomain.com
      service: http://ishastra-ishastra-api:8000
      originRequest:
        noTLSVerify: true
    - service: http_status:404
    metrics: 0.0.0.0:2000
    loglevel: info
    auto-update: true