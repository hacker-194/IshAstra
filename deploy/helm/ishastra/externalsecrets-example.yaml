














apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ishastra-vault-backend
  namespace: ishastra
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret/data/ishastra"
      version: "v2"
      auth:

        tokenSecretRef:
          name: vault-token
          key: token




---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ishastra-secrets
  namespace: ishastra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ishastra-vault-backend
    kind: SecretStore
  target:
    name: ishastra-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ishastra
          app.kubernetes.io/component: secrets
  data:
    - secretKey: ISHASTRA_API_KEY
      remoteRef:
        key: ishastra-secrets
        property: ISHASTRA_API_KEY
    - secretKey: ISHASTRA_AUDIT_HMAC_KEY
      remoteRef:
        key: ishastra-secrets
        property: ISHASTRA_AUDIT_HMAC_KEY
    - secretKey: ISHASTRA_WEBHOOK_SECRET
      remoteRef:
        key: ishastra-secrets
        property: ISHASTRA_WEBHOOK_SECRET
    - secretKey: ISHASTRA_ENCRYPTION_KEY
      remoteRef:
        key: ishastra-secrets
        property: ISHASTRA_ENCRYPTION_KEY
    - secretKey: ISHASTRA_DATABASE_URL
      remoteRef:
        key: ishastra-secrets
        property: ISHASTRA_DATABASE_URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ishastra-redis-secret
  namespace: ishastra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ishastra-vault-backend
    kind: SecretStore
  target:
    name: ishastra-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: ishastra-redis
        property: redis-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ishastra-postgresql-secret
  namespace: ishastra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ishastra-vault-backend
    kind: SecretStore
  target:
    name: ishastra-postgresql-secret
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: ishastra-postgresql
        property: postgresql-password
    - secretKey: database-url
      remoteRef:
        key: ishastra-postgresql
        property: database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ishastra-grafana-secret
  namespace: ishastra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ishastra-vault-backend
    kind: SecretStore
  target:
    name: ishastra-grafana-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: ishastra-grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: ishastra-grafana
        property: admin-password