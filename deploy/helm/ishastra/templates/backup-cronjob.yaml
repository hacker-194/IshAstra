{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ishastra.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backup.timeoutSeconds }}
      template:
        metadata:
          labels:
            {{- include "ishastra.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          {{- if .Values.serviceAccount.enabled }}
          serviceAccountName: {{ .Values.serviceAccount.name | default (include "ishastra.fullname" .) }}
          {{- end }}
          {{- include "ishastra.imagePullSecrets" . | nindent 10 }}
          securityContext:
            {{- toYaml .Values.api.podSecurityContext | nindent 12 }}
          containers:
            - name: backup
              image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}


              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ishastra backup --out "{{ .Values.backup.directory }}"
                  find "{{ .Values.backup.directory }}" -maxdepth 1 -type f \
                    \( -name 'ishastra-*.db' -o -name 'ishastra-*.dump' \) \
                    -mtime +{{ .Values.backup.retentionDays }} -delete
              env:
                - name: ISHASTRA_DB
                  value: {{ index .Values.api.env "ISHASTRA_DB" | default "/var/lib/ishastra/ishastra.db" | quote }}
              envFrom:
                {{- range .Values.api.envFromSecrets }}
                - secretRef:
                    name: {{ .name }}
                {{- end }}
              volumeMounts:
                - name: data
                  mountPath: /var/lib/ishastra
              securityContext:
                {{- toYaml .Values.api.securityContext | nindent 16 }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Values.backup.claimName | default .Values.pvc.ishastraData.name }}
{{- end }}
