{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ishastra.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.additionalAnnotations | nindent 4 }}
  {{- end }}
data:
  scope.json: |-
{{ .Values.configMap.scopeJson | indent 4 }}
  {{- range $key, $value := .Values.configMap.additionalConfigs }}
  {{ $key }}: |-
{{ $value | indent 4 }}
  {{- end }}
{{- end }}