{{- include "ishastra.validateK8sJobs" . -}}
{{- include "ishastra.validateScopeSigning" . -}}
{{- include "ishastra.validateDatabase" . -}}
{{- include "ishastra.queue.validate" . }}
{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ishastra.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
    {{- if .Values.api.annotations }}
    {{- toYaml .Values.api.annotations | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "ishastra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    {{- include "ishastra.updateStrategy" . }}
  template:
    metadata:
      labels:
        {{- include "ishastra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- if .Values.api.podAnnotations }}
        {{- toYaml .Values.api.podAnnotations | nindent 8 }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.service.port }}"
        prometheus.io/path: "/api/metrics"
        {{- if .Values.global.podSecurityStandard }}
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
        {{- end }}
    spec:
      serviceAccountName: {{- if .Values.serviceAccount.enabled }} {{ .Values.serviceAccount.name | default (include "ishastra.fullname" .) }}{{- else }} default{{- end }}
      {{- include "ishastra.priorityClassName" . | nindent 6 }}
      {{- if .Values.topologySpreadConstraints }}
      {{- include "ishastra.topologySpreadConstraints" . | nindent 6 }}
      {{- end }}
      {{- if .Values.api.affinity }}
      {{- include "ishastra.affinity" . | nindent 6 }}
      {{- end }}
      {{- if .Values.api.tolerations }}
      {{- include "ishastra.tolerations" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- if .Values.api.podSecurityContext }}
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- include "ishastra.podSecurityContext" . | nindent 8 }}
        {{- end }}
      {{- include "ishastra.imagePullSecrets" . | nindent 6 }}
      initContainers:
        {{- if .Values.api.initContainers }}
        {{- toYaml .Values.api.initContainers | nindent 8 }}
        {{- end }}
      containers:
        - name: api
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            {{- include "ishastra.env" . | nindent 12 }}


            - name: ISHASTRA_SCHEDULER_ENABLED
              value: "false"

            - name: ISHASTRA_MONITOR_ENABLED
              value: "false"
            {{- if .Values.k8sJobs.enabled }}
            - name: ISHASTRA_K8S_IMAGE
              value: {{ printf "%s:%s" .Values.global.image.repository .Values.global.image.tag | quote }}
            {{- end }}
            {{- if .Values.scopeSigning.enabled }}
            - name: ISHASTRA_SCOPE_JWKS
              value: {{ printf "/etc/ishastra/scope-signing/%s" .Values.scopeSigning.jwksFile | quote }}
            {{- end }}
            {{- if and .Values.postgresql.enabled (not (index .Values.api.env "ISHASTRA_DATABASE_URL")) }}
            - name: ISHASTRA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ishastra.postgresqlSecretName" . }}
                  key: database-url
            {{- end }}
          envFrom:
            {{- include "ishastra.envFromSecrets" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          {{- if .Values.api.livenessProbe }}
          livenessProbe:
            {{- include "ishastra.livenessProbe" . | nindent 12 }}
          {{- end }}
          {{- if .Values.api.readinessProbe }}
          readinessProbe:
            {{- include "ishastra.readinessProbe" . | nindent 12 }}
          {{- end }}
          {{- if .Values.api.startupProbe }}
          startupProbe:
            {{- include "ishastra.startupProbe" . | nindent 12 }}
          {{- end }}
          {{- include "ishastra.resources" . | nindent 10 }}
          {{- include "ishastra.volumeMounts" . | nindent 10 }}
          securityContext:
            {{- if .Values.api.securityContext }}
            {{- toYaml .Values.api.securityContext | nindent 12 }}
            {{- else }}
            {{- include "ishastra.containerSecurityContext" . | nindent 12 }}
            {{- end }}
      {{- include "ishastra.volumes" . | nindent 6 }}
      {{- if .Values.api.extraVolumes }}
      {{- toYaml .Values.api.extraVolumes | nindent 6 }}
      {{- end }}
      {{- if .Values.scopeSigning.enabled }}
        - name: scope-signing-jwks
          persistentVolumeClaim:
            claimName: {{ .Values.scopeSigning.existingClaim | quote }}
      {{- end }}
{{- end }}