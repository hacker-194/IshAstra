{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ishastra.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
    {{- if .Values.worker.annotations }}
    {{- toYaml .Values.worker.annotations | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "ishastra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  strategy:
    {{- include "ishastra.worker.updateStrategy" . }}
  template:
    metadata:
      labels:
        {{- include "ishastra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- if .Values.worker.podAnnotations }}
        {{- toYaml .Values.worker.podAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.global.podSecurityStandard }}
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
        {{- end }}
    spec:
      serviceAccountName: {{- if .Values.serviceAccount.enabled }} {{ .Values.serviceAccount.name | default (include "ishastra.fullname" .) }}{{- else }} default{{- end }}
      {{- include "ishastra.priorityClassName" . | nindent 6 }}
      {{- if .Values.topologySpreadConstraints }}
      {{- include "ishastra.topologySpreadConstraints" . | nindent 6 }}
      {{- end }}
      {{- if .Values.worker.affinity }}
      {{- include "ishastra.worker.affinity" . | nindent 6 }}
      {{- end }}
      {{- if .Values.worker.tolerations }}
      {{- include "ishastra.worker.tolerations" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- if .Values.worker.podSecurityContext }}
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- include "ishastra.podSecurityContext" . | nindent 8 }}
        {{- end }}
      {{- include "ishastra.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- if eq .Values.queue.mode "redis-streams" }}

          command:
            - python
            - -m
            - ishastra
            - worker
            {{- if .Values.worker.concurrency }}
            - --concurrency
            - "{{ .Values.worker.concurrency }}"
            {{- end }}
            {{- if .Values.worker.queueMax }}
            - --queue-max
            - "{{ .Values.worker.queueMax }}"
            {{- end }}
            {{- if .Values.worker.redisStreams.extraArgs }}
            {{- range .Values.worker.redisStreams.extraArgs }}
            - {{ . }}
            {{- end }}
            {{- end }}
          {{- else }}

          command:
            - python
            - -m
            - ishastra
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.worker.service.port | default 8000 }}"
          {{- end }}
          env:
            {{- include "ishastra.worker.env" . | nindent 12 }}

            {{- if and .Values.postgresql.enabled (not (index (index .Values.worker.env) "ISHASTRA_DATABASE_URL")) }}
            - name: ISHASTRA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ishastra.postgresqlSecretName" . }}
                  key: database-url
            {{- end }}

            - name: ISHASTRA_SCHEDULER_ENABLED
              value: "false"
            - name: ISHASTRA_MONITOR_ENABLED
              value: "false"
            {{- if eq .Values.queue.mode "redis-streams" }}

            - name: ISHASTRA_WORKER_HEALTH_HOST
              value: "0.0.0.0"
            - name: ISHASTRA_WORKER_HEALTH_PORT
              value: "{{ .Values.worker.redisStreams.healthPort | default 8080 }}"
            {{- end }}
          envFrom:
            {{- include "ishastra.worker.envFromSecrets" . | nindent 12 }}
          {{- if eq .Values.queue.mode "redis-streams" }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- else }}
          {{- if .Values.worker.livenessProbe }}
          livenessProbe:
            {{- include "ishastra.worker.livenessProbe" . | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.readinessProbe }}
          readinessProbe:
            {{- include "ishastra.worker.readinessProbe" . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- include "ishastra.worker.resources" . | nindent 10 }}
          {{- include "ishastra.worker.volumeMounts" . | nindent 10 }}
          securityContext:
            {{- if .Values.worker.securityContext }}
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
            {{- else }}
            {{- include "ishastra.containerSecurityContext" . | nindent 12 }}
            {{- end }}
      {{- include "ishastra.worker.volumes" . | nindent 6 }}
      {{- if .Values.worker.extraVolumes }}
      {{- toYaml .Values.worker.extraVolumes | nindent 6 }}
      {{- end }}
{{- end }}