{{- if .Values.workerCostOptimization.gracefulPreemption.enabled }}
---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ishastra.fullname" . }}-worker-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdb
spec:
  minAvailable: {{ .Values.workerCostOptimization.gracefulPreemption.minAvailable | default "50%" }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ishastra.name" . }}
      app.kubernetes.io/component: worker
---


apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ishastra.fullname" . }}-graceful-shutdown
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: shutdown-script
data:
  graceful-shutdown.sh: |

    set -euo pipefail




    echo "[$(date)] Received termination signal, starting graceful shutdown..."


    CHECKPOINT_DIR="${ISHASTRA_CHECKPOINT_DIR:-/var/lib/ishastra/checkpoints}"
    REDIS_URL="${ISHASTRA_REDIS_URL:-redis://redis-master:6379/0}"
    QUEUE_NAME="${ISHASTRA_QUEUE_NAME:-ishastra}"
    GRACE_PERIOD="${ISHASTRA_GRACE_PERIOD:-300}"
    CHECKPOINT_INTERVAL="${ISHASTRA_CHECKPOINT_INTERVAL:-30}"


    echo "[$(date)] Signaling application to drain..."
    kill -SIGUSR1 $(cat /tmp/ishastra-worker.pid 2>/dev/null || pgrep -f "celery.*worker" | head -1) 2>/dev/null || true


    echo "[$(date)] Waiting for checkpoint (max ${GRACE_PERIOD}s)..."
    START_TIME=$(date +%s)
    while [ -f /tmp/ishastra-assessment-active ]; do
      CURRENT_TIME=$(date +%s)
      ELAPSED=$((CURRENT_TIME - START_TIME))

      if [ $ELAPSED -ge $GRACE_PERIOD ]; then
        echo "[$(date)] Grace period exceeded, forcing checkpoint..."
        break
      fi


      if [ -f "${CHECKPOINT_DIR}/latest.checkpoint" ]; then
        CHECKPOINT_AGE=$((CURRENT_TIME - $(stat -c %Y "${CHECKPOINT_DIR}/latest.checkpoint" 2>/dev/null || echo $CURRENT_TIME)))
        if [ $CHECKPOINT_AGE -lt $CHECKPOINT_INTERVAL ]; then
          echo "[$(date)] Recent checkpoint found, safe to terminate"
          break
        fi
      fi

      sleep 2
    done


    if [ -f /tmp/ishastra-assessment-active ]; then
      echo "[$(date)] Creating final checkpoint..."
      ASSESSMENT_ID=$(cat /tmp/ishastra-current-assessment-id 2>/dev/null || echo "unknown")
      CHECKPOINT_FILE="${CHECKPOINT_DIR}/${ASSESSMENT_ID}-$(date +%s).checkpoint"


      python -c "
import redis
import json
import sys
r = redis.from_url('${REDIS_URL}')
assessment_id = '${ASSESSMENT_ID}'
checkpoint_data = {
    'assessment_id': assessment_id,
    'timestamp': '$(date -Iseconds)',
    'status': 'checkpointed',
    'reason': 'preemption',
    'progress': r.get(f'ishastra:assessment:{assessment_id}:progress') or '0',
    'current_task': r.get(f'ishastra:assessment:{assessment_id}:current_task') or 'unknown',
    'findings': r.lrange(f'ishastra:assessment:{assessment_id}:findings', 0, -1) or [],
    'queue_position': r.lpos('${QUEUE_NAME}', assessment_id) or 0
}
r.set(f'ishastra:checkpoint:{assessment_id}', json.dumps(checkpoint_data))
r.expire(f'ishastra:checkpoint:{assessment_id}', 86400 * 7)
print(f'Checkpoint saved for {assessment_id}')
" 2>/dev/null || echo "[$(date)] Warning: Could not create checkpoint via Redis"


      echo "[$(date)] Requeueing assessment ${ASSESSMENT_ID}..."
      python -c "
import redis
import json
r = redis.from_url('${REDIS_URL}')
assessment_id = '${ASSESSMENT_ID}'


assessment_data = r.get(f'ishastra:assessment:{assessment_id}:data')
if assessment_data:

    r.lpush('${QUEUE_NAME}:priority', assessment_id)

    r.hset(f'ishastra:assessment:{assessment_id}', mapping={
        'status': 'queued',
        'requeued_at': '$(date -Iseconds)',
        'requeue_reason': 'preemption',
        'requeue_count': r.hincrby(f'ishastra:assessment:{assessment_id}', 'requeue_count', 1)
    })
    print(f'Requeued assessment {assessment_id}')
else:
    print(f'No assessment data found for {assessment_id}')
" 2>/dev/null || echo "[$(date)] Warning: Could not requeue assessment"
    fi


    echo "[$(date)] Cleaning up..."
    rm -f /tmp/ishastra-assessment-active /tmp/ishastra-current-assessment-id


    python -c "
import redis
r = redis.from_url('${REDIS_URL}')
r.incr('ishastra:worker:graceful_shutdown_total')
r.lpush('ishastra:worker:shutdown_log', json.dumps({
    'worker_id': '${HOSTNAME}',
    'timestamp': '$(date -Iseconds)',
    'assessment_id': '${ASSESSMENT_ID:-unknown}',
    'reason': 'preemption'
}))
" 2>/dev/null || true

    echo "[$(date)] Graceful shutdown complete"
    exit 0
---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ishastra.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ishastra.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ishastra.name" . }}
        app.kubernetes.io/component: worker
        ishastra.io/priority-tier: {{ .Values.workerCostOptimization.priorityClass | default "batch" }}
      annotations:
        {{- if .Values.workerCostOptimization.gracefulPreemption.preStopEnabled }}

        lifecycle:
          preStop:
            exec:
              command:
                - /bin/bash
                - /scripts/graceful-shutdown.sh
        {{- end }}
        {{- if .Values.workerCostOptimization.gracefulPreemption.checkpointing.enabled }}

        ishastra.io/checkpointing: "enabled"
        ishastra.io/checkpoint-interval: "{{ .Values.workerCostOptimization.gracefulPreemption.checkpointing.interval | default "30s" }}"
        {{- end }}
    spec:
      serviceAccountName: {{ include "ishastra.fullname" . }}-worker
      priorityClassName: {{ .Values.workerCostOptimization.priorityClass | default "ishastra-batch" }}
      terminationGracePeriodSeconds: {{ .Values.workerCostOptimization.gracefulPreemption.terminationGracePeriodSeconds | default 330 }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      {{- if .Values.workerCostOptimization.gracefulPreemption.checkpointing.enabled }}
      initContainers:
        - name: checkpoint-init
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/lib/ishastra/checkpoints
              chmod 755 /var/lib/ishastra/checkpoints
          volumeMounts:
            - name: ishastra-data
              mountPath: /var/lib/ishastra
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |

              /scripts/graceful-shutdown.sh &

              exec celery -A ishastra.worker worker \
                --loglevel=${ISHASTRA_LOG_LEVEL:-INFO} \
                --concurrency=${ISHASTRA_WORKERS:-1} \
                --queues=${ISHASTRA_QUEUE_NAME:-celery} \
                --prefetch-multiplier=1 \
                --max-tasks-per-child=100 \
                --time-limit=3600 \
                --soft-time-limit=3300
          env:
            {{- toYaml .Values.worker.env | nindent 12 }}
            - name: ISHASTRA_CHECKPOINT_DIR
              value: "/var/lib/ishastra/checkpoints"
            - name: ISHASTRA_GRACE_PERIOD
              value: "{{ .Values.workerCostOptimization.gracefulPreemption.gracePeriod | default "300" }}"
            - name: ISHASTRA_CHECKPOINT_INTERVAL
              value: "{{ .Values.workerCostOptimization.gracefulPreemption.checkpointing.interval | default "30" }}"
            - name: ISHASTRA_QUEUE_NAME
              value: "{{ .Values.workerCostOptimization.keda.redis.listName | default "celery" }}"
          envFrom:
            {{- toYaml .Values.worker.envFromSecrets | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.worker.volumeMounts | nindent 12 }}
            - name: shutdown-script
              mountPath: /scripts
              readOnly: true
            {{- if .Values.workerCostOptimization.gracefulPreemption.checkpointing.enabled }}
            - name: ishastra-data
              mountPath: /var/lib/ishastra
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
      volumes:
        {{- toYaml .Values.worker.volumes | nindent 8 }}
        - name: shutdown-script
          configMap:
            name: {{ include "ishastra.fullname" . }}-graceful-shutdown
            defaultMode: 0755
      {{- if .Values.worker.affinity }}
      affinity:
        {{- toYaml .Values.worker.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.tolerations }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      {{- else }}

      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "batch"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      {{- end }}
      {{- if .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.worker.topologySpreadConstraints | nindent 8 }}
      {{- end }}
---

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ishastra.fullname" . }}-checkpoint-recovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint-recovery
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ishastra.name" . }}
        app.kubernetes.io/component: checkpoint-recovery
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ishastra.fullname" . }}-worker
      containers:
        - name: recovery
          image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              echo "[$(date)] Starting checkpoint recovery..."
              python -c "
import redis
import json
import os

r = redis.from_url(os.environ.get('ISHASTRA_REDIS_URL', 'redis://redis-master:6379/0'))
queue_name = os.environ.get('ISHASTRA_QUEUE_NAME', 'celery')


checkpoint_keys = r.keys('ishastra:checkpoint:*')
recovered = 0

for key in checkpoint_keys:
    checkpoint = json.loads(r.get(key))
    assessment_id = checkpoint['assessment_id']


    status = r.hget(f'ishastra:assessment:{assessment_id}', 'status')
    if status in [b'completed', b'failed', b'cancelled']:
        print(f'Skipping {assessment_id}: already {status.decode()}')
        continue


    requeue_count = int(r.hget(f'ishastra:assessment:{assessment_id}', 'requeue_count') or 0)
    if requeue_count >= 3:
        print(f'Skipping {assessment_id}: max retries exceeded ({requeue_count})')
        r.hset(f'ishastra:assessment:{assessment_id}', 'status', 'failed')
        r.hset(f'ishastra:assessment:{assessment_id}', 'failure_reason', 'max_retries_exceeded')
        continue


    r.lpush(f'{queue_name}:priority', assessment_id)
    r.hset(f'ishastra:assessment:{assessment_id}', mapping={
        'status': 'queued',
        'recovered_at': '$(date -Iseconds)',
        'recovery_reason': 'checkpoint_recovery'
    })
    recovered += 1
    print(f'Recovered assessment {assessment_id} (attempt {requeue_count + 1})')

print(f'Recovery complete: {recovered} assessments requeued')
r.set('ishastra:recovery:last_run', '$(date -Iseconds)')
r.set('ishastra:recovery:count', recovered)
"
          env:
            - name: ISHASTRA_REDIS_URL
              value: "{{ .Values.worker.env.ISHASTRA_REDIS_URL | default "redis://redis-master:6379/0" }}"
            - name: ISHASTRA_QUEUE_NAME
              value: "{{ .Values.workerCostOptimization.keda.redis.listName | default "celery" }}"
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
{{- end }}