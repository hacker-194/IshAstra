{{- if and .Values.monitoring.grafanaDashboard.enabled .Values.monitoringExtras.cost.enabled }}
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ishastra.fullname" . }}-grafana-dashboard-cost
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboard
    grafana_dashboard: "1"
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
data:
  ishastra-cost-optimization.json: |
    {
      "dashboard": {
        "title": "Ishastra Cost Optimization",
        "uid": "ishastra-cost-optimization",
        "tags": ["ishastra", "cost", "finops", "kubernetes"],
        "timezone": "browser",
        "refresh": "30s",
        "time": {
          "from": "now-6h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Monthly Budget Utilization by Tenant/Project",
            "type": "bargauge",
            "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "ishastra:budget:utilization:monthly * 100",
                "legendFormat": "{{ "{{ tenant }}" }}/{{ "{{ project }}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0,
                "max": 150,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 60 },
                    { "color": "orange", "value": 80 },
                    { "color": "red", "value": 100 }
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "title": "Current Hourly Spend Rate (USD/hr)",
            "type": "stat",
            "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sum(ishastra:cost:hourly:tenant_project)",
                "legendFormat": "Total",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD",
                "color": { "mode": "thresholds" },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 50 },
                    { "color": "red", "value": 200 }
                  ]
                }
              }
            }
          },
          {
            "id": 3,
            "title": "Projected Monthly Spend",
            "type": "stat",
            "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sum(ishastra:cost:hourly:tenant_project) * 24 * 30",
                "legendFormat": "Projected",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD",
                "color": { "mode": "thresholds" },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 500 },
                    { "color": "red", "value": 1000 }
                  ]
                }
              }
            }
          },
          {
            "id": 4,
            "title": "Cost Trend - Last 24 Hours",
            "type": "timeseries",
            "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sum by (tenant, project) (rate(ishastra_assessment_cost_usd_total[1h]))",
                "legendFormat": "{{ "{{ tenant }}" }}/{{ "{{ project }}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD/hr",
                "fillOpacity": 10,
                "lineWidth": 2
              }
            }
          },
          {
            "id": 5,
            "title": "Cost Breakdown: Spot vs On-Demand",
            "type": "piechart",
            "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sum by (instance_type) (ishastra:cost:spot_vs_ondemand:1h)",
                "legendFormat": "{{ "{{instance_type}}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD/hr"
              }
            }
          },
          {
            "id": 6,
            "title": "Cost per Assessment by Type",
            "type": "bargauge",
            "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "ishastra:cost:per_assessment:1h",
                "legendFormat": "{{ "{{ tenant }}" }}/{{ "{{ project }}" }} - {{ "{{assessment_type}}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "currencyUSD",
                "min": 0
              }
            }
          },
          {
            "id": 7,
            "title": "Worker Utilization",
            "type": "timeseries",
            "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "ishastra:worker:utilization:5m * 100",
                "legendFormat": "{{ "{{ tenant }}" }}/{{ "{{ project }}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "red", "value": null },
                    { "color": "yellow", "value": 50 },
                    { "color": "green", "value": 80 }
                  ]
                }
              }
            }
          },
          {
            "id": 8,
            "title": "Assessment Queue Depth",
            "type": "timeseries",
            "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sum by (tenant, project, priority) (ishastra_assessment_queue_pending)",
                "legendFormat": "{{ "{{ tenant }}" }}/{{ "{{ project }}" }} [{{ "{{priority}}" }}]",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "min": 0
              }
            }
          },
          {
            "id": 9,
            "title": "Queue Latency (P99)",
            "type": "timeseries",
            "gridPos": { "x": 12, "y": 20, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "ishastra:queue:latency:p99:5m",
                "legendFormat": "{{ "{{ tenant }}" }}/{{ "{{ project }}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "min": 0
              }
            }
          },
          {
            "id": 10,
            "title": "Spot Instance Termination Rate",
            "type": "timeseries",
            "gridPos": { "x": 0, "y": 32, "w": 12, "h": 6 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "rate(ishastra_spot_termination_total[5m]) * 60",
                "legendFormat": "{{ "{{node_pool}}" }} ({{ "{{reason}}" }})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "permin",
                "min": 0
              }
            }
          },
          {
            "id": 11,
            "title": "Node Pool Hourly Cost",
            "type": "table",
            "gridPos": { "x": 12, "y": 28, "w": 12, "h": 10 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "ishastra_node_pool_cost_usd_per_hour",
                "format": "table",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "align": "auto",
                  "displayMode": "auto",
                  "filterable": true
                }
              },
              "overrides": [
                {
                  "matcher": { "type": "byName", "options": "Value" },
                  "properties": [
                    { "id": "unit", "value": "currencyUSD/hr" },
                    { "id": "min", "value": 0 }
                  ]
                }
              ]
            }
          },
          {
            "id": 12,
            "title": "Top 10 Most Expensive Assessments (Last 24h)",
            "type": "table",
            "gridPos": { "x": 0, "y": 38, "w": 24, "h": 10 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "topk(10, sum by (tenant, project, assessment_id) (increase(ishastra_assessment_cost_usd_total[24h])))",
                "format": "table",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "custom": {
                  "align": "auto",
                  "displayMode": "auto",
                  "filterable": true
                }
              },
              "overrides": [
                {
                  "matcher": { "type": "byName", "options": "Value" },
                  "properties": [
                    { "id": "unit", "value": "currencyUSD" },
                    { "id": "min", "value": 0 }
                  ]
                }
              ]
            }
          },
          {
            "id": 13,
            "title": "Cost Savings: Spot vs On-Demand",
            "type": "stat",
            "gridPos": { "x": 18, "y": 4, "w": 6, "h": 4 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "(sum(ishastra:cost:spot_vs_ondemand:1h{instance_type=~\"*spot*\"}) / sum(ishastra:cost:spot_vs_ondemand:1h)) * 100",
                "legendFormat": "Spot %",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "color": { "mode": "thresholds" },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "red", "value": null },
                    { "color": "yellow", "value": 50 },
                    { "color": "green", "value": 70 }
                  ]
                }
              }
            }
          },
          {
            "id": 14,
            "title": "Idle Worker Count",
            "type": "stat",
            "gridPos": { "x": 18, "y": 8, "w": 6, "h": 4 },
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "sum by (tenant) (kube_pod_status_phase{phase=\"Running\", namespace=~\".*-ishastra-worker\"}) - sum by (tenant) (ishastra_worker_busy)",
                "legendFormat": "{{ "{{ tenant }}" }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "short",
                "color": { "mode": "thresholds" },
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 3 },
                    { "color": "red", "value": 10 }
                  ]
                }
              }
            }
          }
        ],
        "schemaVersion": 38,
        "version": 1,
        "links": []
      }
    }
{{- end }}