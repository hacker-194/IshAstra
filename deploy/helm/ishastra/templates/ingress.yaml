{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ include "ishastra.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
    {{- if .Values.api.ingress.annotations }}
    {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
    {{- end }}
    {{- if .Values.api.ingress.className }}
    kubernetes.io/ingress.class: {{ .Values.api.ingress.className }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  {{- if .Values.api.ingress.tls }}
  tls:
    {{- toYaml .Values.api.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- toYaml .Values.api.ingress.hosts | nindent 4 }}
{{- end }}