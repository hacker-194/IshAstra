{{- if .Values.k8sJobs.enabled }}
{{- if .Values.k8sJobs.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.k8sJobs.namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: assessment-jobs
---
{{- end }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.k8sJobs.serviceAccount }}
  namespace: {{ .Values.k8sJobs.namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.k8sJobs.scopeConfigMapName | default "ishastra-scope" }}
  namespace: {{ .Values.k8sJobs.namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
data:
  {{ .Values.k8sJobs.scopeConfigMapKey | default "scope.json" }}: |
    {{- (.Values.k8sJobs.scope | default dict) | toJson | nindent 4 }}
{{- end }}
