{{- if and .Values.k8sJobs.enabled .Values.k8sJobs.networkPolicyEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "ishastra-assess-%s-netpol" .Values.k8sJobs.jobNameSuffix | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: assessment-job
    ishastra.job-id: {{ .Values.k8sJobs.jobId }}
spec:
  podSelector:
    matchLabels:
      ishastra.job-id: {{ .Values.k8sJobs.jobId }}
  policyTypes:
    - Egress
  egress:

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    {{- if .Values.k8sJobs.scopeEgress }}
    {{- toYaml .Values.k8sJobs.scopeEgress | nindent 4 }}
    {{- else if not (and .Values.k8sJobs.allowScopeNetworks .Values.k8sJobs.authorizedNetworks) }}
    {{- fail "k8sJobs.networkPolicyEnabled requires k8sJobs.scopeEgress (or allowScopeNetworks with authorizedNetworks): refusing to render a policy that allows all egress" }}
    {{- end }}

    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443

    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379



    {{- if .Values.k8sJobs.allowScopeNetworks }}
    {{- range .Values.k8sJobs.authorizedNetworks }}
    - to:
        - ipBlock:
            cidr: {{ . }}
      ports:
        {{- range $.Values.k8sJobs.allowedPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}