{{- include "ishastra.operator.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ishastra.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ishastra
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.additionalAnnotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.operator.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "ishastra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "ishastra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      annotations:
        {{- if .Values.operator.podAnnotations }}
        {{- toYaml .Values.operator.podAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.global.podSecurityStandard }}
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.operator.metrics.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{- if .Values.serviceAccount.enabled }} {{ .Values.serviceAccount.name | default (include "ishastra.fullname" .) }}{{- else }} default{{- end }}
      {{- if .Values.operator.priorityClassName }}
      priorityClassName: {{ .Values.operator.priorityClassName }}
      {{- end }}
      {{- if .Values.operator.runtimeClassName }}
      runtimeClassName: {{ .Values.operator.runtimeClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      {{- include "ishastra.topologySpreadConstraints" . | nindent 6 }}
      {{- end }}
      {{- if .Values.operator.affinity }}
      {{- include "ishastra.operator.affinity" . | nindent 6 }}
      {{- end }}
      {{- if .Values.operator.tolerations }}
      {{- include "ishastra.operator.tolerations" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- if .Values.operator.podSecurityContext }}
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- include "ishastra.podSecurityContext" . | nindent 8 }}
        {{- end }}
      {{- include "ishastra.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy | default .Values.global.image.pullPolicy }}
          {{- include "ishastra.operator.command" . | nindent 10 }}
          env:
            {{- range $key, $value := .Values.operator.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: "ishastra-operator"
          ports:
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.operator.health.port }}
              protocol: TCP
            {{- if .Values.operator.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.operator.webhook.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          {{- if .Values.operator.resources }}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- else }}
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          {{- end }}
          securityContext:
            {{- if .Values.operator.securityContext }}
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
            {{- else }}
            {{- include "ishastra.containerSecurityContext" . | nindent 12 }}
            {{- end }}
            seccompProfile:
              type: {{ .Values.operator.seccompProfileType | default "RuntimeDefault" }}
              {{- if eq .Values.operator.seccompProfileType "Localhost" }}
              localhostProfile: {{ .Values.operator.seccompProfile | default "ishastra-seccomp-default" }}
              {{- end }}
          volumeMounts:
            {{- if .Values.operator.webhook.enabled }}
            - name: webhook-certs
              mountPath: {{ .Values.operator.webhook.certDir }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.operator.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "ishastra.fullname" . }}-webhook-certs
            optional: false
        {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 50Mi
---

