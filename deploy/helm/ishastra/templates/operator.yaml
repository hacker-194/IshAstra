apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: assessmentjobs.ishastra.io
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ishastra
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    {{- include "ishastra.annotations" . | nindent 4 }}
spec:
  group: ishastra.io
  names:
    kind: AssessmentJob
    listKind: AssessmentJobList
    plural: assessmentjobs
    singular: assessmentjob
    shortNames:
      - aj
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                scope:
                  type: string
                scopeRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                policyRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                tenantRef:
                  type: object
                  properties:
                    name:
                      type: string
                schedule:
                  type: string
                mode:
                  type: string
                  enum: ["k8s-jobs", "redis-streams"]
                redisStreams:
                  type: object
                  properties:
                    stream:
                      type: string
                    consumerGroup:
                      type: string
                priority:
                  type: integer
                ttlSecondsAfterFinished:
                  type: integer
              required:
                - scope
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                jobRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                startedAt:
                  type: string
                  format: date-time
                completedAt:
                  type: string
                  format: date-time
                resultsRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
---
apiVersion: apiextensions.k8s.io/v1
