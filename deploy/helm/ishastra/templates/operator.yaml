apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "ishastra.fullname" . }}-mutating-webhook
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: ishastra
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.additionalAnnotations | nindent 4 }}
  {{- end }}
webhooks:
  - name: massessmentjob.ishastra.io
    clientConfig:
      service:
        name: {{ include "ishastra.fullname" . }}-operator-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate-ishastra-io-v1alpha1-assessmentjob
        port: {{ .Values.operator.webhook.port }}
      caBundle: {{ .Values.operator.webhook.caBundle | default "" }}
    rules:
      - apiGroups: ["ishastra.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["assessmentjobs"]
        scope: "Namespaced"
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Fail
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]
---

