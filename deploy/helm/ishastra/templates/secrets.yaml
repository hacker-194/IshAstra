{{- if and .Values.secrets.enabled .Values.secrets.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ishastra.appSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
    {{- if .Values.secrets.annotations }}
    {{- toYaml .Values.secrets.annotations | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.ishastraSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ishastra.redisSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-secret
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ index .Values.secrets.redisSecret "redis-password" | default (randAlphaNum 32) | quote }}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ishastra.postgresqlSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-secret
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
type: Opaque
{{- $pgPass := index .Values.secrets.postgresqlSecret "postgresql-password" | default (randAlphaNum 32) }}
{{- $appPass := index .Values.secrets.postgresqlSecret "app-password" | default (randAlphaNum 32) }}
stringData:
  postgresql-password: {{ $pgPass | quote }}
  app-password: {{ $appPass | quote }}

  database-url: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.leastPrivilege.appUsername $appPass (include "ishastra.fullname" .) .Values.postgresql.auth.database | quote }}
  owner-database-url: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username $pgPass (include "ishastra.fullname" .) .Values.postgresql.auth.database | quote }}
{{- if .Values.k8sJobs.enabled }}
---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.k8sJobs.dbSecretName | default "ishastra-secrets" }}
  namespace: {{ .Values.k8sJobs.namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.k8sJobs.dbSecretKey | default "database-url" }}: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.leastPrivilege.appUsername $appPass (include "ishastra.fullname" .) .Values.postgresql.auth.database | quote }}
{{- end }}
---
{{- end }}
{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ishastra.grafanaSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-secret
  annotations:
    {{- include "ishastra.annotations" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ index .Values.secrets.grafanaSecret "admin-user" | default "admin" | quote }}
  admin-password: {{ index .Values.secrets.grafanaSecret "admin-password" | default (randAlphaNum 32) | quote }}
---
{{- end }}
{{- end }}