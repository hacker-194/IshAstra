---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ishastra.fullname" . }}-critical-pod-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-patch
data:
  patch.yaml: |

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - critical
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: instance-lifecycle
                    operator: In
                    values:
                      - on-demand
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "critical"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Equal"
          value: "on-demand"
          effect: "NoSchedule"
      priorityClassName: {{ .Values.costOptimization.priorityClasses.critical.name | default "ishastra-critical" }}
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ishastra.fullname" . }}-batch-pod-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-patch
data:
  patch.yaml: |

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - batch
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: instance-lifecycle
                    operator: In
                    values:
                      - spot
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "batch"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      priorityClassName: {{ .Values.costOptimization.priorityClasses.batch.name | default "ishastra-batch" }}
---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ishastra.fullname" . }}-standard-pod-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ishastra.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-patch
data:
  patch.yaml: |

    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - critical
            - weight: 50
              preference:
                matchExpressions:
                  - key: instance-lifecycle
                    operator: In
                    values:
                      - on-demand
            - weight: 30
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - batch
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "critical"
          effect: "NoSchedule"
        - key: "workload-type"
          operator: "Equal"
          value: "batch"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Exists"
          effect: "NoSchedule"
      priorityClassName: {{ .Values.costOptimization.priorityClasses.standard.name | default "ishastra-standard" }}
{{- end }}