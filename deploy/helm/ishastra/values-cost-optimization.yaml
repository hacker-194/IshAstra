






global:

  priorityClasses:
    enabled: true
    system:
      name: "ishastra-system"
      value: 2000000
      preemptionPolicy: "PreemptLowerPriority"
    critical:
      name: "ishastra-critical"
      value: 1000000
      preemptionPolicy: "PreemptLowerPriority"
    standard:
      name: "ishastra-standard"
      value: 500000
      preemptionPolicy: "PreemptLowerPriority"
    batch:
      name: "ishastra-batch"
      value: 100000
      preemptionPolicy: "PreemptLowerPriority"


  resourceQuota:
    enabled: true
    name: "ishastra-tenant-quota"
    tenantId: ""
    projectId: ""
    budgetMonthlyUSD: "1000"
    limits:
      requestsCpu: "32"
      requestsMemory: "64Gi"
      limitsCpu: "64"
      limitsMemory: "128Gi"
      pods: "100"
      services: "20"
      servicesLoadBalancers: "5"
      servicesNodePorts: "0"
      persistentVolumeClaims: "20"
      requestsStorage: "500Gi"
      configMaps: "50"
      secrets: "50"
      requestsEphemeralStorage: "100Gi"
      limitsEphemeralStorage: "200Gi"
    defaultLimits:
      cpu: "1000m"
      memory: "1Gi"
    defaultRequests:
      cpu: "250m"
      memory: "512Mi"
    maxLimits:
      cpu: "8000m"
      memory: "16Gi"
      podCpu: "16000m"
      podMemory: "32Gi"
      pvcStorage: "100Gi"
    minLimits:
      cpu: "50m"
      memory: "128Mi"
      pvcStorage: "1Gi"
    maxLimitRequestRatio:
      cpu: "10"
      memory: "10"


  spot:
    enabled: true
    aws:
      clusterName: "ishastra-cluster"
      region: "us-east-1"
      critical:
        instanceType: "m6i.xlarge"
        desiredCapacity: 3
        minSize: 2
        maxSize: 10
        volumeSize: 50
      batch:
        instanceType: "m6i.2xlarge"
        desiredCapacity: 0
        minSize: 0
        maxSize: 50
        volumeSize: 100
    gcp:

      enabled: false
    azure:

      enabled: false




worker:
  enabled: true
  replicaCount: 0
  priorityClass: "ishastra-batch"


  keda:
    enabled: true
    pollingInterval: 15
    cooldownPeriod: 300
    minReplicas: 0
    maxReplicas: 50
    restoreToOriginalReplicaCount: false
    fallback:
      failureThreshold: 3
      replicas: 2
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
            - type: Pods
              value: 4
              periodSeconds: 15
          selectPolicy: Max
    redis:
      address: ""
      stream: "ishastra:assessments"
      consumerGroup: "ishastra-workers"
      pendingEntriesCount: "10"
      enableTLS: "false"
      secretName: ""
      secretKey: "redis-password"
    prometheus:
      enabled: true
      serverAddress: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
      metricName: "ishastra_assessment_queue_pending"
      threshold: "5"
      query: "ishastra_assessment_queue_pending"
      authModes: "none"
    cpu:
      threshold: "70"
      metricType: "Utilization"
    memory:
      threshold: "80"
      metricType: "Utilization"


  gracefulPreemption:
    enabled: true
    preStopEnabled: true
    terminationGracePeriodSeconds: 330
    gracePeriod: 300
    minAvailable: "50%"
    checkpointing:
      enabled: true
      interval: "30s"
      directory: "/var/lib/ishastra/checkpoints"


  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"


  tolerations:
    - key: "workload-type"
      operator: "Equal"
      value: "batch"
      effect: "NoSchedule"
    - key: "instance-lifecycle"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
    - key: "workload-type"
      operator: "Equal"
      value: "critical"
      effect: "NoSchedule"


  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ishastra
          app.kubernetes.io/component: worker
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ishastra
          app.kubernetes.io/component: worker






queue:
  mode: redis-streams




api:
  enabled: true


  replicaCount: 1
  priorityClass: "ishastra-critical"
  tolerations:
    - key: "workload-type"
      operator: "Equal"
      value: "critical"
      effect: "NoSchedule"
    - key: "instance-lifecycle"
      operator: "Equal"
      value: "on-demand"
      effect: "NoSchedule"
  resources:
    limits:
      cpu: "4000m"
      memory: "4Gi"
    requests:
      cpu: "2000m"
      memory: "2Gi"




scheduler:
  enabled: true
  replicaCount: 1
  priorityClass: "ishastra-system"
  tolerations:
    - key: "workload-type"
      operator: "Equal"
      value: "critical"
      effect: "NoSchedule"
    - key: "instance-lifecycle"
      operator: "Equal"
      value: "on-demand"
      effect: "NoSchedule"




monitoring:
  servicemonitor:
    enabled: true
    release: "prometheus"
    interval: "30s"
    scrapeTimeout: "10s"
    scheme: "https"
  prometheusrule:
    enabled: true
    release: "prometheus"
  grafanaDashboard:
    enabled: true
    folder: "Ishastra"
  cost:
    enabled: true
    exporter:
      image:
        repository: "ghcr.io/your-org/ishastra-cost-exporter"
        tag: "v1.0.0"
      clusterName: "primary"
    alertInterval: "1m"
    recordingInterval: "1m"
    budgetAlertFor: "5m"
    budgetExceededFor: "1m"
    spikeFor: "10m"
    spotTerminationFor: "2m"
    queueDepthFor: "5m"
    idleWorkerFor: "30m"






































postgresql:
  enabled: true
