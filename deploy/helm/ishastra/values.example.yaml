




global:
  image:
    repository: ghcr.io/hacker-194/ishastra
    tag: "4.0.0"
    pullPolicy: IfNotPresent
    pullSecrets: []
  labels: {}
  podSecurityStandard: restricted


api:
  enabled: true
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "1000m"
      memory: "1Gi"
  securityContext: {}
  podSecurityContext: {}
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    name: http
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []
  env: {}
  envFromSecrets: []
  volumes: []
  volumeMounts: []
  affinity: {}
  tolerations: []
  pdb:
    enabled: true
    minAvailable: 1
  hpa:

    enabled: false
    minReplicas: 1
    maxReplicas: 1
    metrics: []


scheduler:
  enabled: true
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  resources: {}
  securityContext: {}
  podSecurityContext: {}
  livenessProbe: {}
  readinessProbe: {}
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    name: http
  env: {}
  envFromSecrets: []
  volumes: []
  volumeMounts: []
  affinity: {}
  pdb:
    enabled: true
    minAvailable: 1


worker:
  enabled: false
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  resources: {}
  securityContext: {}
  podSecurityContext: {}
  livenessProbe: {}
  readinessProbe: {}
  env: {}
  envFromSecrets: []
  volumes: []
  volumeMounts: []
  affinity: {}
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    metrics: []


redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: ""
    existingSecretPasswordKey: ""
  master: {}
  metrics: {}
  networkPolicy:
    enabled: true


postgresql:
  enabled: false
  auth: {}
  primary: {}
  metrics: {}
  networkPolicy:
    enabled: true


monitoring:
  prometheus:
    enabled: false
  grafana:
    enabled: false


configMap:
  enabled: true
  scopeJson: |
    {
      "program": "REPLACE_ME",
      "authorized_by": "REPLACE_ME",
      "authorization_ref": "REPLACE_ME",
      "include": ["*.example.com"],
      "exclude": [],
      "authorized_networks": ["10.0.0.0/8"],
      "allowed_ports": [80, 443],
      "allow_broad_networks": false,
      "auth": {"users": []}
    }
  additionalConfigs: {}


secrets:
  enabled: true
  createSecrets: false
  ishastraSecrets: {}
  redisSecret: {}
  postgresqlSecret: {}
  grafanaSecret: {}
  annotations: {}


pvc:
  ishastraData:
    enabled: true
    name: ""
    accessModes: ["ReadWriteOnce"]
    resources:
      requests:
        storage: 10Gi
    storageClassName: ""
    volumeMode: Filesystem
  redis:
    enabled: true


serviceAccount:
  enabled: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true


rbac:
  enabled: true
  createClusterRole: true
  clusterRoleRules: []
  roleRules: []


networkPolicy:
  enabled: true
  apiIngress: []
  apiEgress: []


podSecurityPolicy:
  enabled: true
  restricted: {}


environments:
  dev: {}
  staging: {}
  production: {}


imagePullSecrets: []
additionalLabels: {}
additionalAnnotations: {}
priorityClassName: ""
topologySpreadConstraints: []