k8sJobs:
  enabled: false
  allowScopeNetworks: false
  authorizedNetworks: []
  allowedPorts: []
  scopeConfigMapName: ishastra-scope
  scopeConfigMapKey: scope.json
  dbSecretName: ishastra-secrets
  dbSecretKey: database-url
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  activeDeadlineSeconds: 7200

seccompProfiles:
  enabled: false
  configMapName: ishastra-seccomp-profiles




operator:
  enabled: false
  replicas: 1

  image:
    repository: ghcr.io/hacker-194/ishastra-operator
    tag: "v1.0.0"
    pullPolicy: IfNotPresent

  metrics:
    port: 8080
  health:
    port: 8081

  webhook:
    enabled: false
    port: 9443
    certDir: /tmp/k8s-webhook-server/serving-certs
    caBundle: ""

  enableK8sJobsMode: true
  enableRedisStreamsMode: false
  redis:
    address: "redis-master:6379"

  logLevel: "info"
  logFormat: "json"

  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "512Mi"

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  seccompProfileType: "RuntimeDefault"
  seccompProfile: "ishastra-seccomp-default"

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

  affinity: {}
  tolerations: []

  priorityClassName: ""

  runtimeClassName: ""

  env:
    ISHASTRA_OPERATOR_LOG_FORMAT: "json"
    ISHASTRA_OPERATOR_LOG_LEVEL: "INFO"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  envFromSecrets:
    - name: ishastra-secrets

  volumes:
    - name: ishastra-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 100Mi
  volumeMounts:
    - name: ishastra-tmp
      mountPath: /tmp

  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"

  pdb:
    enabled: true
    minAvailable: 1
