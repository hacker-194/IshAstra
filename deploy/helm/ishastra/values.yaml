    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ishastra
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ishastra




test:
