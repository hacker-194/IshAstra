# Strix ExternalSecrets Example
#
# Prerequisites:
#   1. Install External Secrets Operator:
#      helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   2. Configure a SecretStore (Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager, etc.)
#
# Usage:
#   1. Store secrets in your secret manager (Vault, AWS, Azure, GCP)
#   2. Create SecretStore resource pointing to your backend
#   3. Apply this ExternalSecret resource
#   4. Deploy Strix with Helm (createSecrets: false):
#      helm upgrade --install strix ./deploy/helm/strix -f values-secrets.yaml --set secrets.createSecrets=false

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: strix-vault-backend
  namespace: strix
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret/data/strix"
      version: "v2"
      auth:
        # Use token auth or Kubernetes auth
        tokenSecretRef:
          name: vault-token
          key: token
        # OR kubernetes auth:
        # kubernetes:
        #   mountPath: kubernetes
        #   role: strix
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: strix-secrets
  namespace: strix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: strix-vault-backend
    kind: SecretStore
  target:
    name: strix-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/name: strix
          app.kubernetes.io/component: secrets
  data:
    - secretKey: STRIX_API_KEY
      remoteRef:
        key: strix-secrets
        property: STRIX_API_KEY
    - secretKey: STRIX_AUDIT_HMAC_KEY
      remoteRef:
        key: strix-secrets
        property: STRIX_AUDIT_HMAC_KEY
    - secretKey: STRIX_WEBHOOK_SECRET
      remoteRef:
        key: strix-secrets
        property: STRIX_WEBHOOK_SECRET
    - secretKey: STRIX_ENCRYPTION_KEY
      remoteRef:
        key: strix-secrets
        property: STRIX_ENCRYPTION_KEY
    - secretKey: STRIX_DATABASE_URL
      remoteRef:
        key: strix-secrets
        property: STRIX_DATABASE_URL
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: strix-redis-secret
  namespace: strix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: strix-vault-backend
    kind: SecretStore
  target:
    name: strix-redis-secret
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: strix-redis
        property: redis-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: strix-postgresql-secret
  namespace: strix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: strix-vault-backend
    kind: SecretStore
  target:
    name: strix-postgresql-secret
    creationPolicy: Owner
  data:
    - secretKey: postgresql-password
      remoteRef:
        key: strix-postgresql
        property: postgresql-password
    - secretKey: database-url
      remoteRef:
        key: strix-postgresql
        property: database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: strix-grafana-secret
  namespace: strix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: strix-vault-backend
    kind: SecretStore
  target:
    name: strix-grafana-secret
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: strix-grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: strix-grafana
        property: admin-password