# Strix SealedSecrets Example
# Generated by: kubeseal --format=yaml < secrets.yaml > sealedsecrets.yaml
#
# Prerequisites:
#   1. Install SealedSecrets controller in cluster:
#      kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.0/controller.yaml
#   2. Install kubeseal CLI:
#      brew install kubeseal (macOS) / see https://github.com/bitnami-labs/sealed-secrets#kubeseal
#
# Usage:
#   1. Generate plaintext secrets: python3 scripts/generate-secrets.py --output-dir ./secrets --k8s-manifest
#   2. Seal them: kubeseal --format=yaml < ./secrets/secrets.yaml > ./sealedsecrets.yaml
#   3. Commit sealedsecrets.yaml to git (safe - encrypted)
#   4. Deploy: kubectl apply -f sealedsecrets.yaml
#   5. Deploy Strix with Helm (createSecrets: false):
#      helm upgrade --install strix ./deploy/helm/strix -f values-secrets.yaml --set secrets.createSecrets=false

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: strix-secrets
  namespace: strix
  labels:
    app.kubernetes.io/name: strix
    app.kubernetes.io/component: secrets
spec:
  encryptedData:
    # These values are ENCRYPTED - only the SealedSecrets controller in the target cluster can decrypt
    # DO NOT put plaintext secrets here. Generate with: kubeseal --format=yaml < secrets.yaml
    STRIX_API_KEY: AgBy3i4I...encrypted...
    STRIX_AUDIT_HMAC_KEY: AgBy3i4I...encrypted...
    STRIX_WEBHOOK_SECRET: AgBy3i4I...encrypted...
    STRIX_ENCRYPTION_KEY: AgBy3i4I...encrypted...
    STRIX_DATABASE_URL: AgBy3i4I...encrypted...
  template:
    metadata:
      name: strix-secrets
      namespace: strix
      labels:
        app.kubernetes.io/name: strix
        app.kubernetes.io/component: secrets
    type: Opaque
---
