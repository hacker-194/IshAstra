{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strix.fullname" . }}-scheduler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    {{- if .Values.scheduler.annotations }}
    {{- toYaml .Values.scheduler.annotations | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "strix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  strategy:
    {{- include "strix.scheduler.updateStrategy" . }}
  template:
    metadata:
      labels:
        {{- include "strix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        {{- if .Values.scheduler.podAnnotations }}
        {{- toYaml .Values.scheduler.podAnnotations | nindent 8 }}
        {{- end }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.scheduler.service.port }}"
        prometheus.io/path: "/api/metrics"
        {{- if .Values.global.podSecurityStandard }}
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
        {{- end }}
    spec:
      serviceAccountName: {{- if .Values.serviceAccount.enabled }} {{ .Values.serviceAccount.name | default (include "strix.fullname" .) }}{{- else }} default{{- end }}
      {{- include "strix.priorityClassName" . | nindent 6 }}
      {{- if .Values.topologySpreadConstraints }}
      {{- include "strix.topologySpreadConstraints" . | nindent 6 }}
      {{- end }}
      {{- if .Values.scheduler.affinity }}
      {{- include "strix.scheduler.affinity" . | nindent 6 }}
      {{- end }}
      {{- if .Values.scheduler.tolerations }}
      {{- include "strix.scheduler.tolerations" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- if .Values.scheduler.podSecurityContext }}
        {{- toYaml .Values.scheduler.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- include "strix.podSecurityContext" . | nindent 8 }}
        {{- end }}
      {{- include "strix.imagePullSecrets" . }}
      containers:
        - name: scheduler
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # There is no `strix scheduler` command: scheduling runs inside the
          # API process, so the scheduler Deployment is the same server process.
          command:
            - python
            - -m
            - strix
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.scheduler.service.targetPort }}"
          env:
            {{- include "strix.scheduler.env" . | nindent 12 }}
          envFrom:
            {{- include "strix.scheduler.envFromSecrets" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.scheduler.service.targetPort }}
              protocol: TCP
          {{- if .Values.scheduler.livenessProbe }}
          livenessProbe:
            {{- include "strix.scheduler.livenessProbe" . | nindent 12 }}
          {{- end }}
          {{- if .Values.scheduler.readinessProbe }}
          readinessProbe:
            {{- include "strix.scheduler.readinessProbe" . | nindent 12 }}
          {{- end }}
          {{- include "strix.scheduler.resources" . | nindent 10 }}
          {{- include "strix.scheduler.volumeMounts" . | nindent 10 }}
          securityContext:
            {{- if .Values.scheduler.securityContext }}
            {{- toYaml .Values.scheduler.securityContext | nindent 12 }}
            {{- else }}
            {{- include "strix.containerSecurityContext" . | nindent 12 }}
            {{- end }}
      {{- include "strix.scheduler.volumes" . | nindent 6 }}
      {{- if .Values.scheduler.extraVolumes }}
      {{- toYaml .Values.scheduler.extraVolumes | nindent 6 }}
      {{- end }}
{{- end }}