{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strix.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    {{- if .Values.worker.annotations }}
    {{- toYaml .Values.worker.annotations | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "strix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  strategy:
    {{- include "strix.worker.updateStrategy" . }}
  template:
    metadata:
      labels:
        {{- include "strix.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        {{- if .Values.worker.podAnnotations }}
        {{- toYaml .Values.worker.podAnnotations | nindent 8 }}
        {{- end }}
        {{- if .Values.global.podSecurityStandard }}
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
        {{- end }}
    spec:
      serviceAccountName: {{- if .Values.serviceAccount.enabled }} {{ .Values.serviceAccount.name | default (include "strix.fullname" .) }}{{- else }} default{{- end }}
      {{- include "strix.priorityClassName" . | nindent 6 }}
      {{- if .Values.topologySpreadConstraints }}
      {{- include "strix.topologySpreadConstraints" . | nindent 6 }}
      {{- end }}
      {{- if .Values.worker.affinity }}
      {{- include "strix.worker.affinity" . | nindent 6 }}
      {{- end }}
      {{- if .Values.worker.tolerations }}
      {{- include "strix.worker.tolerations" . | nindent 6 }}
      {{- end }}
      securityContext:
        {{- if .Values.worker.podSecurityContext }}
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- include "strix.podSecurityContext" . | nindent 8 }}
        {{- end }}
      {{- include "strix.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: worker
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # In-process queue: worker replicas run the same server, which is
          # what the image ships. (Distributed fleet mode is the k8s-jobs path.)
          command:
            - python
            - -m
            - strix
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.worker.service.port | default 8000 }}"
          env:
            {{- include "strix.worker.env" . | nindent 12 }}
          envFrom:
            {{- include "strix.worker.envFromSecrets" . | nindent 12 }}
          {{- if .Values.worker.livenessProbe }}
          livenessProbe:
            {{- include "strix.worker.livenessProbe" . | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.readinessProbe }}
          readinessProbe:
            {{- include "strix.worker.readinessProbe" . | nindent 12 }}
          {{- end }}
          {{- include "strix.worker.resources" . | nindent 10 }}
          {{- include "strix.worker.volumeMounts" . | nindent 10 }}
          securityContext:
            {{- if .Values.worker.securityContext }}
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
            {{- else }}
            {{- include "strix.containerSecurityContext" . | nindent 12 }}
            {{- end }}
      {{- include "strix.worker.volumes" . | nindent 6 }}
      {{- if .Values.worker.extraVolumes }}
      {{- toYaml .Values.worker.extraVolumes | nindent 6 }}
      {{- end }}
{{- end }}