{{- if .Values.monitoringExtras.finops.enabled }}
---
# OpenCost Integration for Kubernetes Cost Allocation
# Deploys OpenCost for real-time cost monitoring and allocation
apiVersion: v1
kind: Namespace
metadata:
  name: opencost
  labels:
    app.kubernetes.io/name: opencost
    app.kubernetes.io/managed-by: helm
---
# OpenCost Helm Release (deployed via Helm chart)
# This ConfigMap documents the recommended OpenCost configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-opencost-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: finops-config
data:
  opencost-values.yaml: |
    # OpenCost Helm Chart Values for Strix Integration
    # Install with: helm repo add opencost https://opencost.github.io/opencost-helm-chart
    # helm install opencost opencost/opencost -n opencost -f this-file.yaml

    global:
      # Strix-specific labels for cost allocation
      prometheus:
        fqdn: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
      # Custom labels for tenant/project attribution
      costLabels:
        - "strix.io/tenant"
        - "strix.io/project"
        - "strix.io/priority-tier"
        - "app.kubernetes.io/component"

    opencost:
      enabled: true
      exporter:
        defaultClusterId: {{ .Values.monitoringExtras.finops.clusterId | default "strix-primary" }}
        # Enable per-pod cost allocation
        enablePodCost: true
        # Enable container-level costs
        enableContainerCost: true
        # Enable namespace costs
        enableNamespaceCost: true
        # Enable node costs
        enableNodeCost: true
        # Enable PV costs
        enablePVCost: true
        # Enable network costs
        enableNetworkCost: true
        # Enable load balancer costs
        enableLoadBalancerCost: true

      # Custom pricing (override cloud provider defaults)
      customPricing:
        # CPU cost per hour (USD)
        cpu: {{ .Values.monitoringExtras.finops.pricing.cpuPerHour | default 0.034 }}
        # RAM cost per GB-hour (USD)
        ram: {{ .Values.monitoringExtras.finops.pricing.ramPerGibHour | default 0.0045 }}
        # GPU cost per hour (USD)
        gpu: {{ .Values.monitoringExtras.finops.pricing.gpuPerHour | default 2.50 }}
        # Spot pricing discounts
        spot:
          cpu: {{ .Values.monitoringExtras.finops.pricing.spotCpuPerHour | default 0.0068 }}
          ram: {{ .Values.monitoringExtras.finops.pricing.spotRamPerGibHour | default 0.0009 }}
        # PV cost per GB-month (USD)
        pv:
          gp3: 0.08
          gp2: 0.10
          io1: 0.125
          io2: 0.125
          standard: 0.045
        # Load balancer cost per hour (USD)
        loadBalancer: 0.025
        # Network cost per GB (USD)
        network:
          zone: 0.01
          region: 0.02
          internet: 0.09

    # Prometheus exporter for OpenCost metrics
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: monitoring
        interval: 60s
        labels:
          release: prometheus

    # UI for cost visualization
    ui:
      enabled: true
      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
        hosts:
          - host: opencost.strix.example.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: opencost-tls
            hosts:
              - opencost.strix.example.com

    # Allocation API for custom cost breakdowns
    allocation:
      enabled: true
      # Custom allocation groups for Strix
      customGroups:
        - name: "tenant"
          keys: ["strix.io/tenant"]
        - name: "project"
          keys: ["strix.io/project"]
        - name: "priority"
          keys: ["strix.io/priority-tier"]
        - name: "component"
          keys: ["app.kubernetes.io/component"]
        - name: "instance_type"
          keys: ["node.kubernetes.io/instance-type", "beta.kubernetes.io/instance-type"]
        - name: "lifecycle"
          keys: ["node.kubernetes.io/lifecycle", "kubernetes.io/lifecycle"]

    # Cost models for chargeback/showback
    costModels:
      - name: "strix-chargeback"
        type: "allocation"
        spec:
          # Chargeback model: allocate all cluster costs to tenants
          cluster:
            cpu: 0.034
            ram: 0.0045
          # Per-tenant overrides
          namespaces:
            strix-tenant-*:
              cpu: 0.034
              ram: 0.0045

    # Alerting integration
    alerting:
      enabled: true
      rules:
        - name: "opencost-budget-exceeded"
          condition: "sum by (namespace) (namespace_monthly_cost) > namespace_budget"
          severity: "critical"
          annotations:
            summary: "Namespace {{ "{{ $labels.namespace }}" }} exceeded monthly budget"

    # Integration with Strix metrics
    strixIntegration:
      enabled: true
      # Map Strix assessment costs to OpenCost allocations
      assessmentCostMapping:
        enabled: true
        # Strix cost exporter metrics to OpenCost
        metrics:
          - strix_assessment_cost_usd_total
          - strix:cost:hourly:tenant_project
          - strix:budget:utilization:monthly

---
# Kubecost Integration (Alternative to OpenCost)
# If using Kubecost instead of OpenCost
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-kubecost-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: finops-config
data:
  kubecost-values.yaml: |
    # Kubecost Helm Chart Values for Strix Integration
    # Install with: helm repo add kubecost https://kubecost.github.io/cost-analyzer/
    # helm install kubecost kubecost/cost-analyzer -n kubecost -f this-file.yaml

    global:
      prometheus:
        fqdn: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
      # Strix-specific labels
      customLabels:
        - "strix.io/tenant"
        - "strix.io/project"
        - "strix.io/priority-tier"
        - "app.kubernetes.io/component"

    kubecostToken: ""  # Set via secret
    kubecostProductConfigs: ""

    # Cost model customization
    customPricing:
      enabled: true
      cpu: {{ .Values.monitoringExtras.finops.pricing.cpuPerHour | default 0.034 }}
      ram: {{ .Values.monitoringExtras.finops.pricing.ramPerGibHour | default 0.0045 }}
      spotCPU: {{ .Values.monitoringExtras.finops.pricing.spotCpuPerHour | default 0.0068 }}
      spotRAM: {{ .Values.monitoringExtras.finops.pricing.spotRamPerGibHour | default 0.0009 }}

    # Prometheus ServiceMonitor
    prometheus:
      serviceMonitor:
        enabled: true
        namespace: monitoring
        interval: 60s
        labels:
          release: prometheus

    # Network costs
    networkCosts:
      enabled: true
      zoneNetworkCost: 0.01
      regionNetworkCost: 0.02
      internetNetworkCost: 0.09

    # PV costs
    pvCost:
      enabled: true
      defaultCostPerGBMonth: 0.10

    # Load balancer costs
    loadBalancerCost:
      enabled: true
      costPerHour: 0.025

    # Allocation API
    allocation:
      enabled: true
      # Custom allocation for Strix
      customGroups:
        - name: "tenant"
          keys: ["strix.io/tenant"]
        - name: "project"
          keys: ["strix.io/project"]
        - name: "priority"
          keys: ["strix.io/priority-tier"]
        - name: "component"
          keys: ["app.kubernetes.io/component"]

    # Alerting
    alerts:
      enabled: true
      rules:
        - name: "kubecost-budget-exceeded"
          expr: "sum by (namespace) (namespace_monthly_cost) > namespace_budget"
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Namespace {{ "{{ $labels.namespace }}" }} exceeded monthly budget"

---
# FinOps PrometheusRules for Strix-specific Cost Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "strix.fullname" . }}-finops-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheusrule
    release: {{ .Values.monitoring.prometheusrule.release | default "prometheus" }}
spec:
  groups:
    - name: strix.finops.chargeback
      interval: 5m
      rules:
        # Daily cost per tenant for chargeback
        - record: strix:finops:daily_cost:tenant
          expr: |
            sum by (strix_io_tenant) (
              rate(container_cpu_usage_seconds_total{container!="",pod=~"strix-.*"}[24h]) * 0.034 +
              rate(container_memory_usage_bytes{container!="",pod=~"strix-.*"}[24h]) / 1024 / 1024 / 1024 * 0.0045
            )

        # Monthly projected cost per tenant
        - record: strix:finops:monthly_projected:tenant
          expr: |
            strix:finops:daily_cost:tenant * 30

        # Cost per assessment (combining infrastructure + assessment-specific)
        - record: strix:finops:cost_per_assessment
          expr: |
            sum by (strix_io_tenant, strix_io_project) (
              rate(strix_assessment_cost_usd_total[24h])
            ) / sum by (strix_io_tenant, strix_io_project) (
              rate(strix_assessment_count_total[24h])
            )

        # Spot savings calculation
        - record: strix:finops:spot_savings_usd_per_hour
          expr: |
            sum by (node_kubernetes_io_lifecycle) (
              kube_node_status_capacity_cpu_cores * 0.034 +
              kube_node_status_capacity_memory_bytes / 1024 / 1024 / 1024 * 0.0045
            )
            -
            sum by (node_kubernetes_io_lifecycle) (
              kube_node_status_capacity_cpu_cores * 0.0068 +
              kube_node_status_capacity_memory_bytes / 1024 / 1024 / 1024 * 0.0009
            )

        # Budget utilization with FinOps data
        - record: strix:finops:budget_utilization
          expr: |
            strix:finops:monthly_projected:tenant / strix_tenant_budget_monthly_usd

        # Idle resource cost (running but not processing)
        - record: strix:finops:idle_worker_cost_usd_per_hour
          expr: |
            sum by (strix_io_tenant) (
              (kube_pod_status_phase{phase="Running", pod=~"strix-worker-.*"} - strix_worker_busy)
              * (container_spec_cpu_quota / container_spec_cpu_period) * 0.034
            )

    - name: strix.finops.alerting
      interval: 5m
      rules:
        # Tenant daily spend alert (80% of daily budget)
        - alert: StrixFinOpsDailyBudgetWarning
          expr: |
            strix:finops:daily_cost:tenant > (strix_tenant_budget_monthly_usd / 30 * 0.8)
          for: 15m
          labels:
            severity: warning
            team: finops
            category: budget
          annotations:
            summary: "Tenant {{ "{{ $labels.strix_io_tenant }}" }} approaching daily budget threshold"
            description: "Daily spend is ' }} USD, daily budget is USD."
            runbook_url: "https://wiki.strix.io/runbooks/finops-daily-budget"

        # Tenant monthly spend alert (100% of monthly budget)
        - alert: StrixFinOpsMonthlyBudgetExceeded
          expr: |
            strix:finops:monthly_projected:tenant > strix_tenant_budget_monthly_usd
          for: 5m
          labels:
            severity: critical
            team: finops
            category: budget
          annotations:
            summary: "Tenant {{ "{{ $labels.strix_io_tenant }}" }} EXCEEDED monthly budget"
            description: "Projected monthly spend {{ "{{ $value | humanize  }}" }} USD exceeds budget {{ "{{ strix_tenant_budget_monthly_usd }}" }} USD"
            runbook_url: "https://wiki.strix.io/runbooks/finops-monthly-budget"

        # Cost per assessment anomaly
        - alert: StrixFinOpsCostPerAssessmentAnomaly
          expr: |
            strix:finops:cost_per_assessment >
            avg_over_time(strix:finops:cost_per_assessment[7d]) * 2
          for: 30m
          labels:
            severity: warning
            team: finops
            category: anomaly
          annotations:
            summary: "Cost per assessment anomaly for {{ "{{ $labels.strix_io_tenant }}" }}/{{ "{{ $labels.strix_io_project }}" }}"
            description: "Current cost per assessment is {{ "{{ $value | humanize  }}" }} USD, 2x the 7-day average"
            runbook_url: "https://wiki.strix.io/runbooks/finops-cost-anomaly"

        # Spot instance savings not being realized
        - alert: StrixFinOpsLowSpotUtilization
          expr: |
            (
              sum(kube_node_status_capacity_cpu_cores{node_kubernetes_io_lifecycle="spot"})
              /
              sum(kube_node_status_capacity_cpu_cores)
            ) < 0.3
          for: 1h
          labels:
            severity: info
            team: finops
            category: optimization
          annotations:
            summary: "Low spot instance utilization (< 30%)"
            description: "Only {{ "{{ $value | humanizePercentage  }}" }} of CPU capacity is on spot instances. Consider migrating more batch workloads to spot."
            runbook_url: "https://wiki.strix.io/runbooks/finops-low-spot-utilization"

        # Idle worker cost accumulation
        - alert: StrixFinOpsIdleWorkerCostAccumulating
          expr: |
            strix:finops:idle_worker_cost_usd_per_hour > 10
          for: 2h
          labels:
            severity: warning
            team: finops
            category: optimization
          annotations:
            summary: "Idle worker cost exceeding $10/hour for tenant {{ "{{ $labels.strix_io_tenant }}" }}"
            description: "Idle workers costing {{ "{{ $value | humanize  }}" }}/hour. Enable scale-to-zero or reduce minReplicas."
            runbook_url: "https://wiki.strix.io/runbooks/finops-idle-workers"

        # Multi-cluster burst cost spike
        - alert: StrixFinOpsBurstClusterCostSpike
          expr: |
            sum by (cluster) (rate(kubecost_cluster_cost_usd_total[1h])) > 500
          for: 15m
          labels:
            severity: warning
            team: finops
            category: burst
          annotations:
            summary: "Burst cluster {{ "{{ $labels.cluster }}" }} hourly cost spike"
            description: "Burst cluster cost is {{ "{{ $value | humanize  }}" }}/hour. Verify burst is necessary."
            runbook_url: "https://wiki.strix.io/runbooks/finops-burst-cost"

---
# ServiceMonitor for FinOps Metrics (OpenCost/Kubecost)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "strix.fullname" . }}-finops-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: servicemonitor
    release: {{ .Values.monitoring.servicemonitor.release | default "prometheus" }}
spec:
  selector:
    matchLabels:
      app: opencost  # or kubecost-cost-analyzer
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
      path: /metrics
---
# Grafana Dashboard for FinOps
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-grafana-dashboard-finops
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboard
    grafana_dashboard: "1"
data:
  strix-finops.json: |
    {
      "dashboard": {
        "title": "Strix FinOps Dashboard",
        "uid": "strix-finops",
        "tags": ["strix", "finops", "cost", "kubecost", "opencost"],
        "timezone": "browser",
        "refresh": "1m",
        "time": { "from": "now-24h", "to": "now" },
        "panels": [
          {
            "id": 1,
            "title": "Cluster Cost Allocation by Tenant",
            "type": "piechart",
            "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "sum by (strix_io_tenant) (rate(kubecost_namespace_cost_usd_total[1h]))", "legendFormat": "{{ "{{strix_io_tenant}}" }}" }
            ]
          },
          {
            "id": 2,
            "title": "Monthly Projected Spend vs Budget",
            "type": "bargauge",
            "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "strix:finops:monthly_projected:tenant", "legendFormat": "Projected - {{ "{{strix_io_tenant}}" }}" },
              { "expr": "strix_tenant_budget_monthly_usd", "legendFormat": "Budget - {{ "{{ tenant }}" }}" }
            ],
            "fieldConfig": { "defaults": { "unit": "currencyUSD" } }
          },
          {
            "id": 3,
            "title": "Cost per Assessment Trend",
            "type": "timeseries",
            "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "strix:finops:cost_per_assessment", "legendFormat": "{{ "{{strix_io_tenant}}" }}/{{ "{{strix_io_project}}" }}" }
            ],
            "fieldConfig": { "defaults": { "unit": "currencyUSD" } }
          },
          {
            "id": 4,
            "title": "Spot Savings (USD/hour)",
            "type": "stat",
            "gridPos": { "x": 12, "y": 8, "w": 6, "h": 4 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "strix:finops:spot_savings_usd_per_hour", "legendFormat": "Savings" }
            ],
            "fieldConfig": { "defaults": { "unit": "currencyUSD/hr", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 10 } ] } } }
          },
          {
            "id": 5,
            "title": "Spot Utilization %",
            "type": "gauge",
            "gridPos": { "x": 18, "y": 8, "w": 6, "h": 4 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "sum(kube_node_status_capacity_cpu_cores{node_kubernetes_io_lifecycle=\"spot\"}) / sum(kube_node_status_capacity_cpu_cores) * 100", "legendFormat": "Spot %" }
            ],
            "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 30 }, { "color": "green", "value": 60 } ] } } }
          },
          {
            "id": 6,
            "title": "Infrastructure Cost Breakdown",
            "type": "table",
            "gridPos": { "x": 0, "y": 16, "w": 24, "h": 10 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "kubecost_cluster_cost_usd_total", "format": "table" }
            ]
          },
          {
            "id": 7,
            "title": "Budget Utilization by Tenant",
            "type": "table",
            "gridPos": { "x": 0, "y": 26, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "strix:finops:budget_utilization * 100", "legendFormat": "{{ "{{strix_io_tenant}}" }}", "format": "table" }
            ],
            "fieldConfig": { "defaults": { "unit": "percent", "custom": { "align": "auto" } }, "overrides": [ { "matcher": { "type": "byName", "options": "Value" }, "properties": [ { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 60 }, { "color": "orange", "value": 80 }, { "color": "red", "value": 100 } ] } } ] } }
          },
          {
            "id": 8,
            "title": "Idle Worker Cost",
            "type": "timeseries",
            "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
            "datasource": "Prometheus",
            "targets": [
              { "expr": "strix:finops:idle_worker_cost_usd_per_hour", "legendFormat": "{{ "{{strix_io_tenant}}" }}" }
            ],
            "fieldConfig": { "defaults": { "unit": "currencyUSD/hr" } }
          }
        ],
        "schemaVersion": 38,
        "version": 1
      }
    }
{{- end }}