{{- if .Values.workerCostOptimization.gracefulPreemption.enabled }}
---
# PodDisruptionBudget for Graceful Worker Eviction
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "strix.fullname" . }}-worker-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdb
spec:
  minAvailable: {{ .Values.workerCostOptimization.gracefulPreemption.minAvailable | default "50%" }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "strix.name" . }}
      app.kubernetes.io/component: worker
---
# PreStop Hook Script for Graceful Shutdown
# This script runs in the worker container before SIGTERM
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-graceful-shutdown
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: shutdown-script
data:
  graceful-shutdown.sh: |
    #!/bin/bash
    set -euo pipefail

    # Graceful shutdown handler for Strix assessment workers
    # Handles: checkpointing, requeue, cleanup

    echo "[$(date)] Received termination signal, starting graceful shutdown..."

    # Configuration
    CHECKPOINT_DIR="${STRIX_CHECKPOINT_DIR:-/var/lib/strix/checkpoints}"
    REDIS_URL="${STRIX_REDIS_URL:-redis://redis-master:6379/0}"
    QUEUE_NAME="${STRIX_QUEUE_NAME:-strix}"
    GRACE_PERIOD="${STRIX_GRACE_PERIOD:-300}"
    CHECKPOINT_INTERVAL="${STRIX_CHECKPOINT_INTERVAL:-30}"

    # Signal the application to stop accepting new work
    echo "[$(date)] Signaling application to drain..."
    kill -SIGUSR1 $(cat /tmp/strix-worker.pid 2>/dev/null || pgrep -f "celery.*worker" | head -1) 2>/dev/null || true

    # Wait for current assessment to checkpoint or complete
    echo "[$(date)] Waiting for checkpoint (max ${GRACE_PERIOD}s)..."
    START_TIME=$(date +%s)
    while [ -f /tmp/strix-assessment-active ]; do
      CURRENT_TIME=$(date +%s)
      ELAPSED=$((CURRENT_TIME - START_TIME))

      if [ $ELAPSED -ge $GRACE_PERIOD ]; then
        echo "[$(date)] Grace period exceeded, forcing checkpoint..."
        break
      fi

      # Check if checkpoint was created recently
      if [ -f "${CHECKPOINT_DIR}/latest.checkpoint" ]; then
        CHECKPOINT_AGE=$((CURRENT_TIME - $(stat -c %Y "${CHECKPOINT_DIR}/latest.checkpoint" 2>/dev/null || echo $CURRENT_TIME)))
        if [ $CHECKPOINT_AGE -lt $CHECKPOINT_INTERVAL ]; then
          echo "[$(date)] Recent checkpoint found, safe to terminate"
          break
        fi
      fi

      sleep 2
    done

    # Create final checkpoint if assessment was running
    if [ -f /tmp/strix-assessment-active ]; then
      echo "[$(date)] Creating final checkpoint..."
      ASSESSMENT_ID=$(cat /tmp/strix-current-assessment-id 2>/dev/null || echo "unknown")
      CHECKPOINT_FILE="${CHECKPOINT_DIR}/${ASSESSMENT_ID}-$(date +%s).checkpoint"

      # Call application checkpoint endpoint
      python -c "
import redis
import json
import sys
r = redis.from_url('${REDIS_URL}')
assessment_id = '${ASSESSMENT_ID}'
checkpoint_data = {
    'assessment_id': assessment_id,
    'timestamp': '$(date -Iseconds)',
    'status': 'checkpointed',
    'reason': 'preemption',
    'progress': r.get(f'strix:assessment:{assessment_id}:progress') or '0',
    'current_task': r.get(f'strix:assessment:{assessment_id}:current_task') or 'unknown',
    'findings': r.lrange(f'strix:assessment:{assessment_id}:findings', 0, -1) or [],
    'queue_position': r.lpos('${QUEUE_NAME}', assessment_id) or 0
}
r.set(f'strix:checkpoint:{assessment_id}', json.dumps(checkpoint_data))
r.expire(f'strix:checkpoint:{assessment_id}', 86400 * 7)
print(f'Checkpoint saved for {assessment_id}')
" 2>/dev/null || echo "[$(date)] Warning: Could not create checkpoint via Redis"

      # Requeue the assessment for another worker
      echo "[$(date)] Requeueing assessment ${ASSESSMENT_ID}..."
      python -c "
import redis
import json
r = redis.from_url('${REDIS_URL}')
assessment_id = '${ASSESSMENT_ID}'

# Get assessment data
assessment_data = r.get(f'strix:assessment:{assessment_id}:data')
if assessment_data:
    # Re-add to queue with high priority for quick reschedule
    r.lpush('${QUEUE_NAME}:priority', assessment_id)
    # Update status
    r.hset(f'strix:assessment:{assessment_id}', mapping={
        'status': 'queued',
        'requeued_at': '$(date -Iseconds)',
        'requeue_reason': 'preemption',
        'requeue_count': r.hincrby(f'strix:assessment:{assessment_id}', 'requeue_count', 1)
    })
    print(f'Requeued assessment {assessment_id}')
else:
    print(f'No assessment data found for {assessment_id}')
" 2>/dev/null || echo "[$(date)] Warning: Could not requeue assessment"
    fi

    # Clean up temporary files
    echo "[$(date)] Cleaning up..."
    rm -f /tmp/strix-assessment-active /tmp/strix-current-assessment-id

    # Notify monitoring
    python -c "
import redis
r = redis.from_url('${REDIS_URL}')
r.incr('strix:worker:graceful_shutdown_total')
r.lpush('strix:worker:shutdown_log', json.dumps({
    'worker_id': '${HOSTNAME}',
    'timestamp': '$(date -Iseconds)',
    'assessment_id': '${ASSESSMENT_ID:-unknown}',
    'reason': 'preemption'
}))
" 2>/dev/null || true

    echo "[$(date)] Graceful shutdown complete"
    exit 0
---
# Worker Deployment with Graceful Preemption
# This extends the existing worker deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strix.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "strix.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "strix.name" . }}
        app.kubernetes.io/component: worker
        strix.io/priority-tier: {{ .Values.workerCostOptimization.priorityClass | default "batch" }}
      annotations:
        {{- if .Values.workerCostOptimization.gracefulPreemption.preStopEnabled }}
        # PreStop hook for graceful shutdown
        lifecycle:
          preStop:
            exec:
              command:
                - /bin/bash
                - /scripts/graceful-shutdown.sh
        {{- end }}
        {{- if .Values.workerCostOptimization.gracefulPreemption.checkpointing.enabled }}
        # Checkpointing sidecar annotation
        strix.io/checkpointing: "enabled"
        strix.io/checkpoint-interval: "{{ .Values.workerCostOptimization.gracefulPreemption.checkpointing.interval | default "30s" }}"
        {{- end }}
    spec:
      serviceAccountName: {{ include "strix.fullname" . }}-worker
      priorityClassName: {{ .Values.workerCostOptimization.priorityClass | default "strix-batch" }}
      terminationGracePeriodSeconds: {{ .Values.workerCostOptimization.gracefulPreemption.terminationGracePeriodSeconds | default 330 }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      {{- if .Values.workerCostOptimization.gracefulPreemption.checkpointing.enabled }}
      initContainers:
        - name: checkpoint-init
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/lib/strix/checkpoints
              chmod 755 /var/lib/strix/checkpoints
          volumeMounts:
            - name: strix-data
              mountPath: /var/lib/strix
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              # Start the graceful shutdown script in background
              /scripts/graceful-shutdown.sh &
              # Start the actual worker
              exec celery -A strix.worker worker \
                --loglevel=${STRIX_LOG_LEVEL:-INFO} \
                --concurrency=${STRIX_WORKERS:-1} \
                --queues=${STRIX_QUEUE_NAME:-celery} \
                --prefetch-multiplier=1 \
                --max-tasks-per-child=100 \
                --time-limit=3600 \
                --soft-time-limit=3300
          env:
            {{- toYaml .Values.worker.env | nindent 12 }}
            - name: STRIX_CHECKPOINT_DIR
              value: "/var/lib/strix/checkpoints"
            - name: STRIX_GRACE_PERIOD
              value: "{{ .Values.workerCostOptimization.gracefulPreemption.gracePeriod | default "300" }}"
            - name: STRIX_CHECKPOINT_INTERVAL
              value: "{{ .Values.workerCostOptimization.gracefulPreemption.checkpointing.interval | default "30" }}"
            - name: STRIX_QUEUE_NAME
              value: "{{ .Values.workerCostOptimization.keda.redis.listName | default "celery" }}"
          envFrom:
            {{- toYaml .Values.worker.envFromSecrets | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.worker.volumeMounts | nindent 12 }}
            - name: shutdown-script
              mountPath: /scripts
              readOnly: true
            {{- if .Values.workerCostOptimization.gracefulPreemption.checkpointing.enabled }}
            - name: strix-data
              mountPath: /var/lib/strix
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.worker.readinessProbe | nindent 12 }}
      volumes:
        {{- toYaml .Values.worker.volumes | nindent 8 }}
        - name: shutdown-script
          configMap:
            name: {{ include "strix.fullname" . }}-graceful-shutdown
            defaultMode: 0755
      {{- if .Values.worker.affinity }}
      affinity:
        {{- toYaml .Values.worker.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.tolerations }}
      tolerations:
        {{- toYaml .Values.worker.tolerations | nindent 8 }}
      {{- else }}
      # Default tolerations for spot instances
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "batch"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      {{- end }}
      {{- if .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml .Values.worker.topologySpreadConstraints | nindent 8 }}
      {{- end }}
---
# Checkpoint Recovery Job (runs on worker startup)
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "strix.fullname" . }}-checkpoint-recovery
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint-recovery
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "strix.name" . }}
        app.kubernetes.io/component: checkpoint-recovery
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "strix.fullname" . }}-worker
      containers:
        - name: recovery
          image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              echo "[$(date)] Starting checkpoint recovery..."
              python -c "
import redis
import json
import os

r = redis.from_url(os.environ.get('STRIX_REDIS_URL', 'redis://redis-master:6379/0'))
queue_name = os.environ.get('STRIX_QUEUE_NAME', 'celery')

# Find all checkpoints
checkpoint_keys = r.keys('strix:checkpoint:*')
recovered = 0

for key in checkpoint_keys:
    checkpoint = json.loads(r.get(key))
    assessment_id = checkpoint['assessment_id']

    # Check if assessment is still in a terminal state
    status = r.hget(f'strix:assessment:{assessment_id}', 'status')
    if status in [b'completed', b'failed', b'cancelled']:
        print(f'Skipping {assessment_id}: already {status.decode()}')
        continue

    # Check requeue count (max 3 retries)
    requeue_count = int(r.hget(f'strix:assessment:{assessment_id}', 'requeue_count') or 0)
    if requeue_count >= 3:
        print(f'Skipping {assessment_id}: max retries exceeded ({requeue_count})')
        r.hset(f'strix:assessment:{assessment_id}', 'status', 'failed')
        r.hset(f'strix:assessment:{assessment_id}', 'failure_reason', 'max_retries_exceeded')
        continue

    # Requeue with priority
    r.lpush(f'{queue_name}:priority', assessment_id)
    r.hset(f'strix:assessment:{assessment_id}', mapping={
        'status': 'queued',
        'recovered_at': '$(date -Iseconds)',
        'recovery_reason': 'checkpoint_recovery'
    })
    recovered += 1
    print(f'Recovered assessment {assessment_id} (attempt {requeue_count + 1})')

print(f'Recovery complete: {recovered} assessments requeued')
r.set('strix:recovery:last_run', '$(date -Iseconds)')
r.set('strix:recovery:count', recovered)
"
          env:
            - name: STRIX_REDIS_URL
              value: "{{ .Values.worker.env.STRIX_REDIS_URL | default "redis://redis-master:6379/0" }}"
            - name: STRIX_QUEUE_NAME
              value: "{{ .Values.workerCostOptimization.keda.redis.listName | default "celery" }}"
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
{{- end }}