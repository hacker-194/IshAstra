{{- if and .Values.worker.enabled .Values.workerCostOptimization.keda.enabled }}
---
# KEDA ScaledObject for worker autoscaling
# Scales based on Redis queue depth with scale-to-zero support
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "strix.fullname" . }}-worker-keda
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: keda-scaledobject
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "strix.fullname" . }}-worker
  pollingInterval: {{ .Values.workerCostOptimization.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.workerCostOptimization.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.workerCostOptimization.keda.minReplicas | default 0 }}
  maxReplicaCount: {{ .Values.workerCostOptimization.keda.maxReplicas | default 50 }}
  {{- if .Values.workerCostOptimization.keda.fallback }}
  fallback:
    {{- toYaml .Values.workerCostOptimization.keda.fallback | nindent 4 }}
  {{- end }}
  advanced:
    {{- if .Values.workerCostOptimization.keda.restoreToOriginalReplicaCount }}
    restoreToOriginalReplicaCount: {{ .Values.workerCostOptimization.keda.restoreToOriginalReplicaCount }}
    {{- end }}
    {{- if .Values.workerCostOptimization.keda.horizontalPodAutoscalerConfig }}
    horizontalPodAutoscalerConfig:
      {{- toYaml .Values.workerCostOptimization.keda.horizontalPodAutoscalerConfig | nindent 6 }}
    {{- end }}
  triggers:
    # Redis List-based queue depth trigger
    - type: redis
      metadata:
        address: {{ .Values.workerCostOptimization.keda.redis.address | default (printf "redis://%s-redis-master:6379/1" (include "strix.fullname" .)) }}
        username: ""
        passwordFromEnv: REDIS_PASSWORD
        dbIndex: "1"
        listName: {{ .Values.workerCostOptimization.keda.redis.listName | default "celery" }}
        listLength: "{{ .Values.workerCostOptimization.keda.redis.listLength | default "10" }}"
        enableTLS: "{{ .Values.workerCostOptimization.keda.redis.enableTLS | default "false" }}"
      authenticationRef:
        name: {{ include "strix.fullname" . }}-keda-redis-auth
    # Prometheus-based trigger for custom metrics (e.g., queue latency, pending assessments)
    {{- if .Values.workerCostOptimization.keda.prometheus.enabled }}
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.workerCostOptimization.keda.prometheus.serverAddress | default "http://prometheus-operated.monitoring.svc.cluster.local:9090" }}
        metricName: {{ .Values.workerCostOptimization.keda.prometheus.metricName | default "strix_assessment_queue_pending" }}
        threshold: "{{ .Values.workerCostOptimization.keda.prometheus.threshold | default "5" }}"
        query: {{ .Values.workerCostOptimization.keda.prometheus.query | default "strix_assessment_queue_pending" }}
        authModes: "{{ .Values.workerCostOptimization.keda.prometheus.authModes | default "none" }}"
      {{- if .Values.workerCostOptimization.keda.prometheus.authRef }}
      authenticationRef:
        name: {{ .Values.workerCostOptimization.keda.prometheus.authRef }}
      {{- end }}
    {{- end }}
    # CPU/Memory fallback for resource-based scaling
    - type: cpu
      metadata:
        type: Utilization
        value: "{{ .Values.workerCostOptimization.keda.cpu.threshold | default "70" }}"
      metricType: {{ .Values.workerCostOptimization.keda.cpu.metricType | default "Utilization" }}
    - type: memory
      metadata:
        type: Utilization
        value: "{{ .Values.workerCostOptimization.keda.memory.threshold | default "80" }}"
      metricType: {{ .Values.workerCostOptimization.keda.memory.metricType | default "Utilization" }}
---
# TriggerAuthentication for Redis
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "strix.fullname" . }}-keda-redis-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: keda-triggerauth
spec:
  secretTargetRef:
    - parameter: password
      name: {{ .Values.workerCostOptimization.keda.redis.secretName | default (printf "%s-redis-secret" (include "strix.fullname" .)) }}
      key: {{ .Values.workerCostOptimization.keda.redis.secretKey | default "redis-password" }}
---
# ClusterRole for KEDA to read metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "strix.fullname" . }}-keda-metrics-reader
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: keda-rbac
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
      - nodes/metrics
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - custom.metrics.k8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - external.metrics.k8s.io
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
# ClusterRoleBinding for KEDA operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "strix.fullname" . }}-keda-metrics-reader-binding
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: keda-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "strix.fullname" . }}-keda-metrics-reader
subjects:
  - kind: ServiceAccount
    name: keda-operator
    namespace: keda
  - kind: ServiceAccount
    name: {{ include "strix.fullname" . }}-worker
    namespace: {{ .Release.Namespace }}
{{- end }}