{{- if and .Values.api.enabled .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "strix.fullname" . }}-api-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdb
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.additionalAnnotations | nindent 4 }}
  {{- end }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "strix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
{{- if and .Values.scheduler.enabled .Values.scheduler.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "strix.fullname" . }}-scheduler-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdb
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.additionalAnnotations | nindent 4 }}
  {{- end }}
spec:
  minAvailable: {{ .Values.scheduler.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "strix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
{{- end }}
{{- if and .Values.worker.enabled .Values.worker.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "strix.fullname" . }}-worker-pdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pdb
  {{- if .Values.additionalAnnotations }}
  annotations:
    {{- toYaml .Values.additionalAnnotations | nindent 4 }}
  {{- end }}
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "strix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}