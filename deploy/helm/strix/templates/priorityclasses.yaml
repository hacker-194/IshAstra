{{- if .Values.costOptimization.priorityClasses.enabled }}
---
# PriorityClass for Critical Assessment Workloads (On-Demand Instances)
# Highest priority - guaranteed scheduling, preemption of lower priority pods
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.costOptimization.priorityClasses.critical.name | default "strix-critical" }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: priorityclass
    strix.io/priority-tier: "critical"
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    strix.io/description: "Critical assessments - production security scans, compliance audits"
    strix.io/instance-type: "on-demand"
value: {{ .Values.costOptimization.priorityClasses.critical.value | default 1000000 }}
globalDefault: false
description: "Critical priority for production security assessments. Runs on on-demand instances only. Preempts batch workloads."
preemptionPolicy: {{ .Values.costOptimization.priorityClasses.critical.preemptionPolicy | default "PreemptLowerPriority" }}
---
# PriorityClass for Standard Assessment Workloads (Mixed Instances)
# Medium priority - balanced scheduling
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.costOptimization.priorityClasses.standard.name | default "strix-standard" }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: priorityclass
    strix.io/priority-tier: "standard"
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    strix.io/description: "Standard assessments - scheduled scans, development testing"
    strix.io/instance-type: "mixed"
value: {{ .Values.costOptimization.priorityClasses.standard.value | default 500000 }}
globalDefault: false
description: "Standard priority for scheduled assessments. Runs on mixed on-demand/spot instances."
preemptionPolicy: {{ .Values.costOptimization.priorityClasses.standard.preemptionPolicy | default "PreemptLowerPriority" }}
---
# PriorityClass for Batch/Background Workloads (Spot/Preemptible Instances)
# Lowest priority - runs on spot instances, first to be preempted
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.costOptimization.priorityClasses.batch.name | default "strix-batch" }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: priorityclass
    strix.io/priority-tier: "batch"
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    strix.io/description: "Batch assessments - bulk scanning, nightly regression, non-critical"
    strix.io/instance-type: "spot"
value: {{ .Values.costOptimization.priorityClasses.batch.value | default 100000 }}
globalDefault: false
description: "Batch priority for non-critical workloads. Runs on spot/preemptible instances. First to be preempted."
preemptionPolicy: {{ .Values.costOptimization.priorityClasses.batch.preemptionPolicy | default "PreemptLowerPriority" }}
---
# PriorityClass for System/Infrastructure Components
# Higher than critical - for control plane, monitoring, operators
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.costOptimization.priorityClasses.system.name | default "strix-system" }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: priorityclass
    strix.io/priority-tier: "system"
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    strix.io/description: "System components - API, scheduler, Redis, operators"
    strix.io/instance-type: "on-demand"
value: {{ .Values.costOptimization.priorityClasses.system.value | default 2000000 }}
globalDefault: false
description: "System priority for control plane components. Runs on on-demand instances only."
preemptionPolicy: {{ .Values.costOptimization.priorityClasses.system.preemptionPolicy | default "PreemptLowerPriority" }}
{{- end }}