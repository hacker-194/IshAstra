{{- if .Values.costOptimization.resourceQuota.enabled }}
---
# ResourceQuota per Tenant Namespace
# Enforces resource limits and cost controls per tenant/project
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Values.costOptimization.resourceQuota.name | default "strix-tenant-quota" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: resourcequota
    strix.io/quota-type: "tenant"
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    strix.io/tenant: "{{ .Values.costOptimization.resourceQuota.tenantId | default .Release.Namespace }}"
    strix.io/project: "{{ .Values.costOptimization.resourceQuota.projectId | default "default" }}"
    strix.io/budget-monthly-usd: "{{ .Values.costOptimization.resourceQuota.budgetMonthlyUSD | default "1000" }}"
spec:
  hard:
    # Compute resources
    requests.cpu: {{ .Values.costOptimization.resourceQuota.limits.requestsCpu | default "32" }}
    requests.memory: {{ .Values.costOptimization.resourceQuota.limits.requestsMemory | default "64Gi" }}
    limits.cpu: {{ .Values.costOptimization.resourceQuota.limits.limitsCpu | default "64" }}
    limits.memory: {{ .Values.costOptimization.resourceQuota.limits.limitsMemory | default "128Gi" }}
    # Pod limits
    pods: {{ .Values.costOptimization.resourceQuota.limits.pods | default "100" }}
    # Services and networking
    services: {{ .Values.costOptimization.resourceQuota.limits.services | default "20" }}
    services.loadbalancers: {{ .Values.costOptimization.resourceQuota.limits.servicesLoadBalancers | default "5" }}
    services.nodeports: {{ .Values.costOptimization.resourceQuota.limits.servicesNodePorts | default "0" }}
    # Storage
    persistentvolumeclaims: {{ .Values.costOptimization.resourceQuota.limits.persistentVolumeClaims | default "20" }}
    requests.storage: {{ .Values.costOptimization.resourceQuota.limits.requestsStorage | default "500Gi" }}
    # ConfigMaps and Secrets
    configmaps: {{ .Values.costOptimization.resourceQuota.limits.configMaps | default "50" }}
    secrets: {{ .Values.costOptimization.resourceQuota.limits.secrets | default "50" }}
    # ResourceQuota-scoped limits
    {{- if .Values.costOptimization.resourceQuota.limits.cpuBurst }}
    requests.ephemeral-storage: {{ .Values.costOptimization.resourceQuota.limits.requestsEphemeralStorage | default "100Gi" }}
    limits.ephemeral-storage: {{ .Values.costOptimization.resourceQuota.limits.limitsEphemeralStorage | default "200Gi" }}
    {{- end }}
---
# LimitRange for default resource requests/limits per container
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ .Values.costOptimization.resourceQuota.name | default "strix-tenant-quota" }}-limits
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: limitrange
spec:
  limits:
    # Default limits for containers without explicit resources
    - type: Container
      default:
        cpu: {{ .Values.costOptimization.resourceQuota.defaultLimits.cpu | default "1000m" }}
        memory: {{ .Values.costOptimization.resourceQuota.defaultLimits.memory | default "1Gi" }}
      defaultRequest:
        cpu: {{ .Values.costOptimization.resourceQuota.defaultRequests.cpu | default "250m" }}
        memory: {{ .Values.costOptimization.resourceQuota.defaultRequests.memory | default "512Mi" }}
      max:
        cpu: {{ .Values.costOptimization.resourceQuota.maxLimits.cpu | default "8000m" }}
        memory: {{ .Values.costOptimization.resourceQuota.maxLimits.memory | default "16Gi" }}
      min:
        cpu: {{ .Values.costOptimization.resourceQuota.minLimits.cpu | default "50m" }}
        memory: {{ .Values.costOptimization.resourceQuota.minLimits.memory | default "128Mi" }}
      maxLimitRequestRatio:
        cpu: {{ .Values.costOptimization.resourceQuota.maxLimitRequestRatio.cpu | default "10" }}
        memory: {{ .Values.costOptimization.resourceQuota.maxLimitRequestRatio.memory | default "10" }}
    # Default limits for Pods
    - type: Pod
      max:
        cpu: {{ .Values.costOptimization.resourceQuota.maxLimits.podCpu | default "16000m" }}
        memory: {{ .Values.costOptimization.resourceQuota.maxLimits.podMemory | default "32Gi" }}
    # PersistentVolumeClaim limits
    - type: PersistentVolumeClaim
      max:
        storage: {{ .Values.costOptimization.resourceQuota.maxLimits.pvcStorage | default "100Gi" }}
      min:
        storage: {{ .Values.costOptimization.resourceQuota.minLimits.pvcStorage | default "1Gi" }}
{{- end }}