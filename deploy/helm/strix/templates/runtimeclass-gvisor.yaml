# RuntimeClass for gVisor (runsc)
# Apply this to the cluster to enable gVisor sandbox isolation
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtimeclass
handler: runsc
scheduling:
  podOverhead:
    podFixed:
      memory: "120Mi"
      cpu: "300m"