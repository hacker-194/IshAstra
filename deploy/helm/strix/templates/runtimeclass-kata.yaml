# RuntimeClass for Kata Containers
# Apply this to the cluster to enable Kata Containers sandbox isolation
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtimeclass
handler: kata
scheduling:
  podOverhead:
    podFixed:
      memory: "200Mi"
      cpu: "500m"