{{- include "strix.validateScopeSigning" . -}}
{{- if and .Values.scopeSigning.enabled .Values.scopeSigning.rotation.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "strix.fullname" . }}-scope-key-rotation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: scope-key-rotation
spec:
  schedule: {{ .Values.scopeSigning.rotation.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "strix.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scope-key-rotation
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate
              image: {{ .Values.scopeSigning.rotation.image | default (printf "%s:%s" .Values.global.image.repository .Values.global.image.tag) | quote }}
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
                - |
                  base=/var/lib/strix/scope-signing
                  kid="rotated-$(date -u +%Y%m%d%H%M%S)"
                  mkdir -p "$base/{{ .Values.scopeSigning.privateDirectory }}"
                  strix scope-key-rotate \
                    --kid "$kid" \
                    --key "$base/{{ .Values.scopeSigning.privateDirectory }}/$kid.pem" \
                    --jwks "$base/{{ .Values.scopeSigning.publicDirectory }}/{{ .Values.scopeSigning.jwksFile }}"
              volumeMounts:
                - name: scope-signing
                  mountPath: /var/lib/strix/scope-signing
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
          volumes:
            - name: scope-signing
              persistentVolumeClaim:
                claimName: {{ .Values.scopeSigning.existingClaim | quote }}
{{- end }}
