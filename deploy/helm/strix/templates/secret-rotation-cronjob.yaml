{{- if and .Values.secrets.enabled .Values.secrets.rotation (eq .Values.secrets.rotation.enabled true) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "strix.fullname" . }}-secret-rotation
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-rotation
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
spec:
  schedule: {{ .Values.secrets.rotation.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: {{ include "strix.serviceAccountName" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: secret-rotation
              image: {{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "Starting secret rotation at $(date)"
                  # Rotation logic for Strix secrets
                  # This would integrate with Vault/External Secrets Operator
                  # For now, we log and trigger the secret store refresh
                  if [[ -n "${VAULT_ADDR:-}" ]]; then
                    echo "Vault detected, triggering secret renewal..."
                    # vault token renew or similar
                  fi
                  # Trigger CSI driver refresh for secrets-store.csi.k8s.io
                  # This is a placeholder - actual implementation depends on secret backend
                  echo "Secret rotation check completed at $(date)"
              envFrom:
                - secretRef:
                    name: {{ include "strix.fullname" . }}-secrets
                    optional: true
              env:
                - name: VAULT_ADDR
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "strix.fullname" . }}-config
                      key: vault-addr
                      optional: true
                - name: VAULT_ROLE
                  valueFrom:
                    configMapKeyRef:
                      name: {{ include "strix.fullname" . }}-config
                      key: vault-role
                      optional: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}