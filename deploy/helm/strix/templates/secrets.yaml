{{- if and .Values.secrets.enabled .Values.secrets.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strix.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
    {{- if .Values.secrets.annotations }}
    {{- toYaml .Values.secrets.annotations | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.strixSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strix.fullname" . }}-redis-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-secret
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
type: Opaque
stringData:
  redis-password: {{ index .Values.secrets.redisSecret "redis-password" | default (randAlphaNum 32) | quote }}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strix.fullname" . }}-postgresql-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-secret
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
type: Opaque
{{- $pgPass := index .Values.secrets.postgresqlSecret "postgresql-password" | default (randAlphaNum 32) }}
stringData:
  postgresql-password: {{ $pgPass | quote }}
  # The app reads STRIX_DATABASE_URL; without this the chart silently stayed on SQLite.
  database-url: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username $pgPass (include "strix.fullname" .) .Values.postgresql.auth.database | quote }}
---
{{- end }}
{{- if .Values.monitoring.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strix.fullname" . }}-grafana-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-secret
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ index .Values.secrets.grafanaSecret "admin-user" | default "admin" | quote }}
  admin-password: {{ index .Values.secrets.grafanaSecret "admin-password" | default (randAlphaNum 32) | quote }}
---
{{- end }}
{{- end }}