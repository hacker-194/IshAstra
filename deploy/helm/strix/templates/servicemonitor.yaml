{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "strix.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: servicemonitor
    release: {{ .Release.Name }}
  annotations:
    {{- include "strix.annotations" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "strix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      # /api/metrics requires the administrator key; the ServiceAccount token
      # is not that key, so send the bootstrap key from the chart secret.
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.secrets.name | default "strix-secrets" }}
          key: STRIX_API_KEY
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          targetLabel: component
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: app
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
