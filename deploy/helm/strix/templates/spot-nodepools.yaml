---
# Kubernetes Node Affinity and Tolerations for Strix Workloads
# Apply these via pod templates or mutating webhook
---
# Critical Workload Pod Template Patch
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-critical-pod-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-patch
data:
  patch.yaml: |
    # Apply to critical priority pods (API, Scheduler, Critical Assessments)
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - critical
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: instance-lifecycle
                    operator: In
                    values:
                      - on-demand
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "critical"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Equal"
          value: "on-demand"
          effect: "NoSchedule"
      priorityClassName: {{ .Values.costOptimization.priorityClasses.critical.name | default "strix-critical" }}
---
# Batch Workload Pod Template Patch
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-batch-pod-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-patch
data:
  patch.yaml: |
    # Apply to batch priority pods (Standard/Batch Assessments)
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - batch
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: instance-lifecycle
                    operator: In
                    values:
                      - spot
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "batch"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Equal"
          value: "spot"
          effect: "NoSchedule"
      priorityClassName: {{ .Values.costOptimization.priorityClasses.batch.name | default "strix-batch" }}
---
# Standard Workload Pod Template Patch
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "strix.fullname" . }}-standard-pod-patch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "strix.labels" . | nindent 4 }}
    app.kubernetes.io/component: pod-patch
data:
  patch.yaml: |
    # Apply to standard priority pods (Standard Assessments)
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - critical
            - weight: 50
              preference:
                matchExpressions:
                  - key: instance-lifecycle
                    operator: In
                    values:
                      - on-demand
            - weight: 30
              preference:
                matchExpressions:
                  - key: workload-type
                    operator: In
                    values:
                      - batch
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "critical"
          effect: "NoSchedule"
        - key: "workload-type"
          operator: "Equal"
          value: "batch"
          effect: "NoSchedule"
        - key: "instance-lifecycle"
          operator: "Exists"
          effect: "NoSchedule"
      priorityClassName: {{ .Values.costOptimization.priorityClasses.standard.name | default "strix-standard" }}
{{- end }}