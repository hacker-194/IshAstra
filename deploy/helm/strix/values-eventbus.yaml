# Event Bus Configuration for Strix
# Redis Streams (primary) and NATS JetStream (alternative) deployment values

# ============================================================================
# Global Event Bus Settings
# ============================================================================

eventBus:
  # Event bus backend: "redis" or "nats"
  backend: "redis"

  # Redis Streams Configuration
  redis:
    enabled: true
    # Redis connection (uses existing Redis from values.yaml if available)
    host: "strix-redis-master"
    port: 6379
    password: ""  # From existing secret
    db: 0
    # Connection pool
    maxConnections: 50
    timeout: 5000
    # Consumer group settings
    consumerGroupPrefix: "strix"
    # Stream settings
    streamMaxLength: 1000000
    streamTrimStrategy: "MAXLEN"
    # Acknowledgment
    ackTimeout: 300000  # 5 minutes
    # Dead letter queue
    dlqEnabled: true
    dlqMaxRetries: 3
    dlqTtlDays: 30
    # Health check
    healthCheckInterval: 30

  # NATS JetStream Configuration (alternative)
  nats:
    enabled: false
    # NATS connection
    servers:
      - "nats://strix-nats:4222"
    # JetStream settings
    streamName: "STRIX_EVENTS"
    streamSubjects:
      - "strix.>"
    streamMaxBytes: 10737418240  # 10GB
    streamMaxMsgs: 10000000
    streamStorage: "file"  # or "memory"
    streamReplicas: 1
    # Consumer settings
    consumerDurablePrefix: "strix"
    consumerAckWait: 300  # 5 minutes
    consumerMaxDeliver: 3
    consumerAckPolicy: "explicit"
    # Dead letter
    dlqEnabled: true
    dlqSubject: "strix.dlq"
    # TLS
    tlsEnabled: false
    tlsCertFile: ""
    tlsKeyFile: ""
    tlsCaFile: ""

# ============================================================================
# Event Publisher Deployment
# ============================================================================

eventPublisher:
  enabled: true
  replicaCount: 2

  image:
    repository: "strix/event-publisher"
    tag: "v3.5.0"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    - name: EVENT_BUS_BACKEND
      value: "redis"
    - name: REDIS_HOST
      value: "strix-redis-master"
    - name: REDIS_PORT
      value: "6379"
    - name: LOG_LEVEL
      value: "INFO"

  service:
    type: ClusterIP
    port: 8080

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# ============================================================================
# Event Consumer Deployments
# ============================================================================

eventConsumers:
  # Assessment Handler - runs K8s Jobs for assessments
  assessmentHandler:
    enabled: true
    replicaCount: 1  # Single leader for job coordination

    image:
      repository: "strix/assessment-handler"
      tag: "v3.5.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi

    env:
      - name: EVENT_BUS_BACKEND
        value: "redis"
      - name: REDIS_HOST
        value: "strix-redis-master"
      - name: REDIS_PORT
        value: "6379"
      - name: K8S_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: LOG_LEVEL
        value: "INFO"
      - name: HANDLER_MAX_CONCURRENT
        value: "5"
      - name: HANDLER_JOB_TTL_SECONDS
        value: "86400"  # 24 hours

    # K8s Job template settings
    jobTemplate:
      # Base image for assessment jobs
      image: "strix/assessment-worker:v3.5.0"
      # Resource limits per assessment job
      resources:
        limits:
          cpu: 2000m
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 512Mi
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        capabilities:
          drop:
            - ALL
      # Service account
      serviceAccountName: "strix-assessment-worker"
      # TTL after completion
      ttlSecondsAfterFinished: 86400
      # Backoff limit
      backoffLimit: 3
      # Active deadline
      activeDeadlineSeconds: 7200  # 2 hours

    livenessProbe:
      httpGet:
        path: /health
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 30

    readinessProbe:
      httpGet:
        path: /ready
        port: 8081
      initialDelaySeconds: 10
      periodSeconds: 10

  # Findings Dashboard Projection
  findingsProjection:
    enabled: true
    replicaCount: 1

    image:
      repository: "strix/findings-projection"
      tag: "v3.5.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    env:
      - name: EVENT_BUS_BACKEND
        value: "redis"
      - name: REDIS_HOST
        value: "strix-redis-master"
      - name: REDIS_PORT
        value: "6379"
      - name: POSTGRES_HOST
        value: "strix-postgresql"
      - name: POSTGRES_PORT
        value: "5432"
      - name: LOG_LEVEL
        value: "INFO"

    service:
      type: ClusterIP
      port: 8082

  # Compliance Report Projection
  complianceProjection:
    enabled: true
    replicaCount: 1

    image:
      repository: "strix/compliance-projection"
      tag: "v3.5.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    env:
      - name: EVENT_BUS_BACKEND
        value: "redis"
      - name: REDIS_HOST
        value: "strix-redis-master"
      - name: REDIS_PORT
        value: "6379"
      - name: POSTGRES_HOST
        value: "strix-postgresql"
      - name: POSTGRES_PORT
        value: "5432"
      - name: LOG_LEVEL
        value: "INFO"

    service:
      type: ClusterIP
      port: 8083

  # Assessment History Projection
  historyProjection:
    enabled: true
    replicaCount: 1

    image:
      repository: "strix/history-projection"
      tag: "v3.5.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    env:
      - name: EVENT_BUS_BACKEND
        value: "redis"
      - name: REDIS_HOST
        value: "strix-redis-master"
      - name: REDIS_PORT
        value: "6379"
      - name: POSTGRES_HOST
        value: "strix-postgresql"
      - name: POSTGRES_PORT
        value: "5432"
      - name: LOG_LEVEL
        value: "INFO"

    service:
      type: ClusterIP
      port: 8084

  # Metrics Projection
  metricsProjection:
    enabled: true
    replicaCount: 1

    image:
      repository: "strix/metrics-projection"
      tag: "v3.5.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    env:
      - name: EVENT_BUS_BACKEND
        value: "redis"
      - name: REDIS_HOST
        value: "strix-redis-master"
      - name: REDIS_PORT
        value: "6379"
      - name: LOG_LEVEL
        value: "INFO"

    service:
      type: ClusterIP
      port: 8085

  # Webhook Consumer
  webhookConsumer:
    enabled: true
    replicaCount: 2

    image:
      repository: "strix/webhook-consumer"
      tag: "v3.5.0"
      pullPolicy: IfNotPresent

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    env:
      - name: EVENT_BUS_BACKEND
        value: "redis"
      - name: REDIS_HOST
        value: "strix-redis-master"
      - name: REDIS_PORT
        value: "6379"
      - name: POSTGRES_HOST
        value: "strix-postgresql"
      - name: POSTGRES_PORT
        value: "5432"
      - name: LOG_LEVEL
        value: "INFO"
      - name: WEBHOOK_MAX_CONCURRENT
        value: "10"
      - name: WEBHOOK_MAX_RETRIES
        value: "5"
      - name: WEBHOOK_TIMEOUT_SECONDS
        value: "30"

    service:
      type: ClusterIP
      port: 8086

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70

# ============================================================================
# Schema Registry
# ============================================================================

schemaRegistry:
  enabled: true
  replicaCount: 1

  image:
    repository: "strix/schema-registry"
    tag: "v3.5.0"
    pullPolicy: IfNotPresent

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    - name: REDIS_HOST
      value: "strix-redis-master"
    - name: REDIS_PORT
      value: "6379"
    - name: POSTGRES_HOST
      value: "strix-postgresql"
    - name: POSTGRES_PORT
      value: "5432"
    - name: LOG_LEVEL
      value: "INFO"

  service:
    type: ClusterIP
    port: 8087

  # Schema storage
  storage:
    backend: "postgres"  # or "redis"
    # Schemas are stored in the database

# ============================================================================
# Monitoring & Observability
# ============================================================================

monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      namespace: monitoring
      labels:
        release: prometheus

  # Grafana dashboards
  grafana:
    enabled: true
    dashboards:
      - name: strix-event-bus
        title: "Strix Event Bus"
      - name: strix-assessments
        title: "Strix Assessments"
      - name: strix-findings
        title: "Strix Findings"
      - name: strix-webhooks
        title: "Strix Webhooks"

  # Distributed tracing
  tracing:
    enabled: true
    jaeger:
      agentHost: "jaeger-agent"
      agentPort: 6831
      samplerType: "const"
      samplerParam: 1
    zipkin:
      endpoint: "http://zipkin:9411/api/v2/spans"

  # Logging
  logging:
    level: "INFO"
    format: "json"
    output: "stdout"

# ============================================================================
# Security
# ============================================================================

security:
  # Network policies
  networkPolicy:
    enabled: true
    # Allow ingress from Strix components only
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: strix
        ports:
          - protocol: TCP
            port: 6379  # Redis
          - protocol: TCP
            port: 4222  # NATS
          - protocol: TCP
            port: 8080  # Event Publisher
          - protocol: TCP
            port: 8081  # Assessment Handler
          - protocol: TCP
            port: 8082  # Findings Projection
          - protocol: TCP
            port: 8083  # Compliance Projection
          - protocol: TCP
            port: 8084  # History Projection
          - protocol: TCP
            port: 8085  # Metrics Projection
          - protocol: TCP
            port: 8086  # Webhook Consumer
          - protocol: TCP
            port: 8087  # Schema Registry

  # Pod security
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

# ============================================================================
# Redis (if not using existing)
# ============================================================================

redis:
  # Use existing Redis from main values.yaml
  # These settings override if eventBus.redis.enabled = true and using dedicated Redis
  architecture: standalone
  auth:
    enabled: true
    existingSecret: "strix-redis"
    existingSecretPasswordKey: "redis-password"
  master:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ============================================================================
# NATS (alternative backend)
# ============================================================================

nats:
  enabled: false
  # JetStream enabled
  jetstream:
    enabled: true
    # Memory/file storage
    memStorage: 1Gi
    fileStorage: 10Gi
  # Resources
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  # Monitoring
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

# ============================================================================
# PostgreSQL (for schema registry, projections)
# ============================================================================

postgresql:
  # Use existing PostgreSQL from main values.yaml
  # These settings override if using dedicated PostgreSQL
  auth:
    enabled: true
    existingSecret: "strix-postgresql"
    existingSecretPasswordKey: "postgres-password"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# ============================================================================
# Ingress (for external access to event bus APIs)
# ============================================================================

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: events.strix.example.com
      paths:
        - path: /publisher
          pathType: Prefix
          service: event-publisher
          port: 8080
        - path: /schema
          pathType: Prefix
          service: schema-registry
          port: 8087
        - path: /webhooks
          pathType: Prefix
          service: webhook-consumer
          port: 8086
        - path: /findings
          pathType: Prefix
          service: findings-projection
          port: 8082
        - path: /compliance
          pathType: Prefix
          service: compliance-projection
          port: 8083
        - path: /history
          pathType: Prefix
          service: history-projection
          port: 8084
        - path: /metrics
          pathType: Prefix
          service: metrics-projection
          port: 8085
  tls:
    - secretName: strix-events-tls
      hosts:
        - events.strix.example.com

# ============================================================================
# Service Accounts & RBAC
# ============================================================================

serviceAccounts:
  # Assessment worker needs permissions to create Jobs
  assessmentWorker:
    create: true
    name: "strix-assessment-worker"
    annotations: {}
  # Event publisher/consumer
  eventBus:
    create: true
    name: "strix-event-bus"
    annotations: {}

rbac:
  create: true
  # Role for assessment worker to create Jobs
  assessmentWorkerRole:
    rules:
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["create", "get", "list", "watch", "delete", "patch"]
      - apiGroups: [""]
        resources: ["pods", "pods/log"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["configmaps", "secrets"]
        verbs: ["get", "list"]
  # Role for event bus components
  eventBusRole:
    rules:
      - apiGroups: [""]
        resources: ["configmaps", "secrets"]
        verbs: ["get", "list", "watch"]

# ============================================================================
# ConfigMaps for Event Schemas
# ============================================================================

configMaps:
  eventSchemas:
    create: true
    # JSON schemas are embedded in the schema registry image
    # This ConfigMap can hold additional/custom schemas

# ============================================================================
# Secrets (referenced from main values.yaml)
# ============================================================================

secrets:
  # Redis password - use existing secret
  redis:
    existingSecret: "strix-redis"
    passwordKey: "redis-password"
  # PostgreSQL password - use existing secret
  postgresql:
    existingSecret: "strix-postgresql"
    passwordKey: "postgres-password"
  # Webhook secrets - created per-webhook
  webhooks: {}
  # TLS certificates
  tls:
    existingSecret: "strix-events-tls"

# ============================================================================
# Affinity & Tolerations
# ============================================================================

affinity:
  # Spread event bus pods across nodes
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - strix-event-bus
          topologyKey: kubernetes.io/hostname

tolerations: []

# ============================================================================
# Pod Disruption Budgets
# ============================================================================

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # For single-replica components
  singleReplica:
    minAvailable: 0

# ============================================================================
# Backup & Disaster Recovery
# ============================================================================

backup:
  # Velero annotations for backup
  velero:
    enabled: true
    # Backup schedules
    schedules:
      - name: "event-bus-daily"
        schedule: "0 2 * * *"
        template:
          includedNamespaces:
            - strix
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: strix-event-bus