















apiVersion: k0sctl.k0sproject.io/v1beta1
metadata:
  name: ishastra-cluster
spec:
  hosts:
  - role: controller+worker
    ssh:
      address: <ISHASTRA_CP1_PUBLIC_IP>
      user: ubuntu
      keyPath: ~/.ssh/oracle_key
      port: 22

    installFlags:
      - --enable-worker
      - --enable-controller
  - role: controller+worker
    ssh:
      address: <ISHASTRA_CP2_PUBLIC_IP>
      user: ubuntu
      keyPath: ~/.ssh/oracle_key
      port: 22
    installFlags:
      - --enable-worker
      - --enable-controller






  k0s:
    version: 1.29.4+k0s.0
    config:
      api:
        address: 0.0.0.0
        port: 6443


      network:
        calico:



        kubeProxy:
          mode: ipvs
      storage:
        type: local-path


      telemetry:
        enabled: false

      featureGates:

        InPlacePodVerticalScaling: true



