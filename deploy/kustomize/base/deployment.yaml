apiVersion: apps/v1
kind: Deployment
metadata:
  name: ishastra-api
  labels:
    app.kubernetes.io/name: ishastra
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ishastra-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ishastra
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ishastra
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ishastra-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/ishastra:3.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ISHASTRA_DB
              value: /var/lib/ishastra/ishastra.db
            - name: ISHASTRA_SCOPE_FILE
              value: /etc/ishastra/scope.json
          envFrom:
            - secretRef:
                name: ishastra-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 1000m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/ishastra
            - name: config
              mountPath: /etc/ishastra
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ishastra-data-pvc
        - name: config
          configMap:
            name: ishastra-config
            items:
              - key: scope.json
                path: scope.json
