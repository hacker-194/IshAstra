---

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
data:
  email.default.html: |
    {{ define "email.default.html" }}
    <html>
      <body>
        <h2>{{ .GroupLabels.alertname }}</h2>
        <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
        <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
        {{ range .Alerts }}
        <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
          <h3>{{ .Annotations.summary }}</h3>
          <p>{{ .Annotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>
          <p><strong>Starts at:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
          {{ if .EndsAt }}<p><strong>Ends at:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05" }}</p>{{ end }}
        </div>
        {{ end }}
      </body>
    </html>
    {{ end }}

  email.critical.html: |
    {{ define "email.critical.html" }}
    <html>
      <body style="background-color: #fff0f0; border: 2px solid #ff0000; padding: 20px;">
        <h1 style="color: #ff0000;">🚨 CRITICAL ALERT</h1>
        <h2>{{ .GroupLabels.alertname }}</h2>
        <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
        <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
        {{ range .Alerts }}
        <div style="background-color: #fff; border: 1px solid #ccc; padding: 15px; margin: 10px 0;">
          <h3 style="color: #ff0000;">{{ .Annotations.summary }}</h3>
          <p>{{ .Annotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>
          <p><strong>Starts at:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
          {{ if .EndsAt }}<p><strong>Ends at:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05" }}</p>{{ end }}
        </div>
        {{ end }}
      </body>
    </html>
    {{ end }}

  email.security.html: |
    {{ define "email.security.html" }}
    <html>
      <body style="background-color: #f0f0ff; border: 2px solid #0000ff; padding: 20px;">
        <h1 style="color: #0000ff;">🔒 SECURITY ALERT</h1>
        <h2>{{ .GroupLabels.alertname }}</h2>
        <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
        <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
        {{ range .Alerts }}
        <div style="background-color: #fff; border: 1px solid #ccc; padding: 15px; margin: 10px 0;">
          <h3 style="color: #0000ff;">{{ .Annotations.summary }}</h3>
          <p>{{ .Annotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">{{ .Annotations.runbook_url }}</a></p>
          <p><strong>Starts at:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
          {{ if .EndsAt }}<p><strong>Ends at:</strong> {{ .EndsAt.Format "2006-01-02 15:04:05" }}</p>{{ end }}
        </div>
        {{ end }}
      </body>
    </html>
    {{ end }}

---

apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: alertmanager
    alertmanager: ishastra
spec:

  replicas: 3


  serviceAccountName: alertmanager


  securityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534


  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 512Mi


  storage:
    volumeClaimTemplate:
      metadata:
        name: alertmanager-data
        labels:
          app: alertmanager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: fast-ssd


  enableClusterMode: true


  cluster:
    peerTimeout: 15s
    peerAddress: ""
    gossipInterval: 2s
    pushPullInterval: 30s
    reconnectInterval: 15s
    tlsConfig:
      caFile: /etc/alertmanager/certs/ca.crt
      certFile: /etc/alertmanager/certs/tls.crt
      keyFile: /etc/alertmanager/certs/tls.key
      serverName: alertmanager.monitoring.svc.cluster.local
      minVersion: TLS1.2
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256


  web:
    routePrefix: /
    externalUrl: https://alertmanager.ishastra.example.com
    tlsConfig:
      certFile: /etc/alertmanager/certs/tls.crt
      keyFile: /etc/alertmanager/certs/tls.key
      clientCAFile: /etc/alertmanager/certs/ca.crt
      minVersion: TLS1.2
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256


  configSecret: alertmanager-config


  image: quay.io/prometheus/alertmanager:v0.26.0


  nodeSelector:
    node-role.kubernetes.io/monitoring: "true"
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"


  priorityClassName: system-cluster-critical


  volumes:
    - name: alertmanager-tls
      secret:
        secretName: alertmanager-tls
    - name: alertmanager-ca
      secret:
        secretName: alertmanager-ca
    - name: alertmanager-templates
      configMap:
        name: alertmanager-templates


  volumeMounts:
    - name: alertmanager-tls
      mountPath: /etc/alertmanager/certs
      readOnly: true
    - name: alertmanager-ca
      mountPath: /etc/alertmanager/certs/ca.crt
      subPath: ca.crt
      readOnly: true
    - name: alertmanager-templates
      mountPath: /etc/alertmanager/templates
      readOnly: true

---

apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 9093
      targetPort: 9093
      protocol: TCP
    - name: grpc
      port: 9094
      targetPort: 9094
      protocol: TCP
    - name: gossip
      port: 9095
      targetPort: 9095
      protocol: TCP
  selector:
    app: alertmanager
    alertmanager: ishastra

---

apiVersion: v1
kind: Service
metadata:
  name: alertmanager-operated
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http-web
      port: 9093
      targetPort: 9093
      protocol: TCP
    - name: grpc
      port: 9094
      targetPort: 9094
      protocol: TCP
    - name: gossip
      port: 9095
      targetPort: 9095
      protocol: TCP
  selector:
    app: alertmanager
    alertmanager: ishastra

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    release: prometheus
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
spec:
  selector:
    matchLabels:
      app: alertmanager
      alertmanager: ishastra
  endpoints:
    - port: http-web
      path: /metrics
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        caFile: /etc/prometheus/certs/alertmanager-ca.crt
        certFile: /etc/prometheus/certs/prometheus-client.crt
        keyFile: /etc/prometheus/certs/prometheus-client.key
        serverName: alertmanager.monitoring.svc.cluster.local
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  namespaceSelector:
    matchNames:
      - monitoring

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: alertmanager
      alertmanager: ishastra

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
spec:
  scaleTargetRef:
    apiVersion: monitoring.coreos.com/v1
    kind: Alertmanager
    name: alertmanager
  minReplicas: 3
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
spec:
  podSelector:
    matchLabels:
      app: alertmanager
      alertmanager: ishastra
  policyTypes:
    - Ingress
    - Egress
  ingress:

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
              prometheus: ishastra
      ports:
        - protocol: TCP
          port: 9093

    - from:
        - podSelector:
            matchLabels:
              app: alertmanager
              alertmanager: ishastra
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus-operator
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095
  egress:

    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 443

    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
              alertmanager: ishastra
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
        - protocol: TCP
          port: 9095