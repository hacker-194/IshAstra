



---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: alertmanager

---

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@ishastra.example.com'
      smtp_auth_username: 'alertmanager'
      smtp_auth_password: '${SMTP_PASSWORD}'
      smtp_require_tls: true

      slack_api_url: '${SLACK_WEBHOOK_URL}'
      slack_api_url_critical: '${SLACK_WEBHOOK_URL_CRITICAL}'
      slack_api_url_security: '${SLACK_WEBHOOK_URL_SECURITY}'

      pagerduty_service_key: '${PAGERDUTY_SERVICE_KEY}'

    route:
      group_by: ['alertname', 'component']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
      routes:
        - match:
            severity: critical
          receiver: 'critical-alerts'
          continue: true
        - match:
            component: auth
          receiver: 'security-alerts'
        - match:
            component: audit
          receiver: 'security-alerts'
        - match:
            component: sli
          receiver: 'sli-alerts'
        - match:
            component: compliance
          receiver: 'compliance-alerts'

    receivers:
      - name: 'default'
        email_configs:
          - to: 'oncall@ishastra.example.com'
            send_resolved: true
            html: '{{ template "email.default.html" . }}'
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#ishastra-alerts'
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            icon_emoji: ':ishastra:'
            username: 'Alertmanager'

      - name: 'critical-alerts'
        email_configs:
          - to: 'oncall-critical@ishastra.example.com'
            send_resolved: true
            html: '{{ template "email.critical.html" . }}'
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL_CRITICAL}'
            channel: '#ishastra-critical'
            send_resolved: true
            title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            icon_emoji: ':alert:'
            username: 'Alertmanager-Critical'
        pagerduty_configs:
          - service_key: '${PAGERDUTY_SERVICE_KEY}'
            severity: critical
            description: '{{ .GroupLabels.alertname }} - {{ .Annotations.summary }}'
            details:
              component: '{{ .GroupLabels.component }}'
              alertname: '{{ .GroupLabels.alertname }}'
              description: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
              runbook_url: '{{ range .Alerts }}{{ .Annotations.runbook_url }}{{ end }}'

      - name: 'security-alerts'
        email_configs:
          - to: 'security@ishastra.example.com'
            send_resolved: true
            html: '{{ template "email.security.html" . }}'
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL_SECURITY}'
            channel: '#ishastra-security'
            send_resolved: true
            title: '🔒 SECURITY: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
            icon_emoji: ':lock:'
            username: 'Alertmanager-Security'

      - name: 'sli-alerts'
        email_configs:
          - to: 'sli-alerts@ishastra.example.com'
            send_resolved: true
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#ishastra-sli'
            send_resolved: true
            title: '📊 SLI Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

      - name: 'compliance-alerts'
        email_configs:
          - to: 'compliance@ishastra.example.com'
            send_resolved: true
        slack_configs:
          - api_url: '${SLACK_WEBHOOK_URL}'
            channel: '#ishastra-compliance'
            send_resolved: true
            title: '📋 Compliance Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'


    templates:
      - '/etc/alertmanager/templates/*.tmpl'


    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'component']
      - source_match:
          alertname: 'IshastraServiceDown'
        target_match_re:
          alertname: 'Ishastra.*'
        equal: ['component']

---

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-tls
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""

---

apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-ca
  namespace: monitoring
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
data:
  ca.crt: ""

---

apiVersion: v1
kind: Secret
metadata:
  name: prometheus-client-certs
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
type: kubernetes.io/tls
