          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "pluginVersion": "11.2.0",
          "targets": [{"expr": "sum(strix_jobs_active)", "refId": "A"}],
          "title": "Active Jobs",
          "type": "stat"
