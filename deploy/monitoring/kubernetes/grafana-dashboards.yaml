            "hide": 0,
            "includeAll": true,
            "label": "Tenant",
            "multi": true,
            "name": "tenant",
            "options": [],
            "query": {"query": "label_values(strix_http_requests_total, tenant)", "refId": "StandardVariableQuery"},
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query"
