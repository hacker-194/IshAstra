data:
  ishastra-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [
        {
          "asDropdown": true,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "name": "Job Latency",
          "tags": ["latency"],
          "targetBlank": true,
          "title": "Job Latency",
          "type": "dashboards",
          "uid": "ishastra-job-latency",
          "url": ""
        },
        {
          "asDropdown": true,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "name": "Adapter Success Rates",
          "tags": ["adapters"],
          "targetBlank": true,
          "title": "Adapter Success Rates",
          "type": "dashboards",
          "uid": "ishastra-adapter-success-rates",
          "url": ""
        },
        {
          "asDropdown": true,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
