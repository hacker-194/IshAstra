            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 3, "x": 6, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto"},
          "pluginVersion": "11.2.0",
          "targets": [{"expr": "up{job=\"grafana\"}", "refId": "A"}],
          "title": "Grafana Up",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [
                {"options": {"0": {"color": "red", "index": 0}, "1": {"color": "green", "index": 1}}, "type": "value"}
              ],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]},
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 3, "x": 9, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "none", "justifyMode": "auto"},
          "pluginVersion": "11.2.0",
          "targets": [{"expr": "up{job=\"redis\"}", "refId": "A"}],
          "title": "Redis Up",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.01}, {"color": "red", "value": 0.05}]},
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 5,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto"},
          "pluginVersion": "11.2.0",
          "targets": [{"expr": "sum(rate(strix_http_requests_total{status=~\"5..\"}[5m])) / sum(rate(strix_http_requests_total[5m]))", "refId": "A"}],
          "title": "Overall 5xx Error Rate",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
