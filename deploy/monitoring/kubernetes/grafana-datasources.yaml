



---

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: ishastra-observability

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: grafana-datasources
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:

      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: https://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          tlsSkipVerify: false
          timeInterval: "30s"
          queryTimeout: "60s"
          httpMethod: POST
          exemplarsTraceIdDestinations:
            - name: TraceID
              datasourceUid: tempo


        secureJsonData:
          httpHeaderValue1: ""







      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: https://loki.monitoring.svc.cluster.local:3100
        editable: false
        jsonData:
          tlsSkipVerify: false
          timeInterval: "30s"
          queryTimeout: "60s"
          maxLines: 1000
          derivedFields:
            - name: traceID
              matcherRegex: "traceID=(\\w+)"
              url: '$${__value.raw}'
              datasourceUid: tempo


        secureJsonData:
          httpHeaderValue1: ""




      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: https://tempo.monitoring.svc.cluster.local:3200
        editable: false
        jsonData:
          tlsSkipVerify: false
          timeInterval: "30s"
          queryTimeout: "60s"
          nodeGraph:
            enabled: true
          search:
            hide: false
          spans:
            search:
              hide: false
          tracesToLogs:
            datasourceUid: loki
            tags:
              - job
              - component
            spanStartTimeShift: "1h"
            spanEndTimeShift: "-1h"
            filterByTraceID: true
            filterBySpanID: false
          lokiSearch:
            datasourceUid: loki


        secureJsonData:
          httpHeaderValue1: ""




      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        access: proxy
        url: https://alertmanager.monitoring.svc.cluster.local:9093
        editable: false
        jsonData:
          tlsSkipVerify: false
          implementation: prometheus

        secureJsonData:
          httpHeaderValue1: ""















































