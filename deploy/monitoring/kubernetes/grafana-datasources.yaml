apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-ishastra
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: grafana-datasources
    grafana_datasource: "1"
data:
  ishastra-datasources.yaml: |
    apiVersion: 1
    datasources:













