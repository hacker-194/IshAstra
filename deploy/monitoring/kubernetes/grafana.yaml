



---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: grafana

---

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
stringData:
  admin-user: admin
  admin-password: ${GRAFANA_ADMIN_PASSWORD}

---

apiVersion: v1
kind: Secret
metadata:
  name: grafana-database
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
stringData:
  database-url: "postgres://grafana:${GRAFANA_DB_PASSWORD}@postgres.monitoring.svc.cluster.local:5432/grafana?sslmode=require"



---

apiVersion: v1
kind: Secret
metadata:
