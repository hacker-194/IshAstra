---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
data:
  grafana.ini: |
    [server]
    domain = grafana.ishastra.example.com
    root_url = https://grafana.ishastra.example.com/
    serve_from_sub_path = false
    router_logging = false
    static_root_path = public
    enable_gzip = true
    cert_file = /etc/grafana/certs/tls.crt
    cert_key = /etc/grafana/certs/tls.key
    protocol = https
    http_addr = ""
    http_port = 3000

    [database]

    type = sqlite3
    path = /var/lib/grafana/grafana.db
    max_idle_conn = 2
    max_open_conn = 0
    conn_max_lifetime = 14400
    log_queries = false
    ssl_mode = disable

    [session]
    provider = file
    provider_config = /var/lib/grafana/sessions
    cookie_name = grafana_sess
    cookie_secure = true
    session_life_time = 86400
    gc_interval_time = 86400

    [analytics]
    reporting_enabled = false
    check_for_updates = false
    google_analytics_ua_id =
    google_tag_manager_id =

    [security]
    admin_user = admin
    admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
    secret_key = ${GF_SECURITY_SECRET_KEY}
    login_remember_days = 7
    cookie_username = grafana_user
    cookie_remember_name = grafana_remember
    disable_gravatar = true
    disable_brute_force_protection = false
    cookie_secure = true
    cookie_samesite = lax
    strict_transport_security = true
    strict_transport_security_max_age_seconds = 31536000
    strict_transport_security_preload = true
    strict_transport_security_subdomains = true
    csrf_always_check = true
    disable_initial_admin_creation = false

    [snapshots]
    external_enabled = false
    external_snapshot_url = https://snapshots-origin.raintank.io
    external_snapshot_name = Publish to snapshots.raintank.io
    snapshot_remove_expired = true

    [dashboards]
    versions_to_keep = 20
    min_refresh_interval = 5s
    default_home_dashboard_path =

    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    verify_email_enabled = false
    login_hint = email or username
    default_theme = dark
    home_page = /d/ishastra-overview/ishastra-observability-overview

    [auth]
    disable_login_form = false
    disable_signout_menu = false
    signout_redirect_url =
    oauth_auto_login = false
    oauth_state_cookie_max_age = 600
    oauth_skip_org_role_update_sync = false
    oauth_allow_insecure_email_lookup = false
    sigv4_auth_enabled = false
    sigv4_verbose_logging = false

    [auth.anonymous]
    enabled = false
    org_name = Main Org.
    org_role = Viewer
    hide_version = false

    [auth.basic]
    enabled = true

    [auth.ldap]
    enabled = false
    config_file = /etc/grafana/ldap.toml
    allow_sign_up = true

    [auth.saml]
    enabled = false
    certificate_path =
    private_key_path =
    signature_algorithm = rsa-sha256
    allow_idp_initiated = true
    assertion_attribute_name = http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
    assertion_attribute_login = http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
    assertion_attribute_email = http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
    assertion_attribute_groups = http://schemas.xmlsoap.org/ws/2005/05/identity/claims/groups
    assertion_attribute_org = http://schemas.xmlsoap.org/ws/2005/05/identity/claims/org
    assertion_attribute_role = http://schemas.xmlsoap.org/ws/2005/05/identity/claims/role

    [auth.proxy]
    enabled = false
    header_name = X-WEBAUTH-USER
    header_property = username
    auto_sign_up = true
    sync_ttl = 60
    whitelist = 192.168.1.1, 192.168.2.1
    headers = Email:X-WEBAUTH-EMAIL, Name:X-WEBAUTH-NAME

    [auth.generic_oauth]
    enabled = false
    name = OAuth
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = user:email,read:org
    auth_url = https://example.com/oauth/authorize
    token_url = https://example.com/oauth/token
    api_url = https://example.com/user
    team_ids =
    allowed_organizations =
    allowed_domains =
    role_attribute_path =
    groups_attribute_path =
    tls_skip_verify_insecure = false
    tls_client_cert =
    tls_client_key =
    tls_client_ca =

    [auth.github]
    enabled = false
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = user:email,read:org
    auth_url = https://github.com/login/oauth/authorize
    token_url = https://github.com/login/oauth/access_token
    api_url = https://api.github.com/user
    team_ids =
    allowed_organizations =
    allowed_domains =

    [auth.google]
    enabled = false
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email
    auth_url = https://accounts.google.com/o/oauth2/auth
    token_url = https://accounts.google.com/o/oauth2/token
    api_url = https://www.googleapis.com/oauth2/v1/userinfo
    allowed_domains =
    team_ids =
    allowed_organizations =
    role_attribute_path =
    groups_attribute_path =
    tls_skip_verify_insecure = false

    [auth.generic_oauth]
    enabled = false
    name = OAuth
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = user:email,read:org
    auth_url = https://example.com/oauth/authorize
    token_url = https://example.com/oauth/token
    api_url = https://example.com/user
    team_ids =
    allowed_organizations =
    allowed_domains =
    role_attribute_path =
    groups_attribute_path =

    [auth.azuread]
    enabled = false
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = openid email profile
    auth_url = https://login.microsoftonline.com/common/oauth2/v2.0/authorize
    token_url = https://login.microsoftonline.com/common/oauth2/v2.0/token
    api_url = https://graph.microsoft.com/v1.0/me
    allowed_domains =
    team_ids =
    allowed_organizations =
    role_attribute_path =
    groups_attribute_path =
    tls_skip_verify_insecure = false

    [auth.okta]
    enabled = false
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = openid email profile
    auth_url = https://example.okta.com/oauth2/v1/authorize
    token_url = https://example.okta.com/oauth2/v1/token
    api_url = https://example.okta.com/oauth2/v1/userinfo
    allowed_domains =
    team_ids =
    allowed_organizations =
    role_attribute_path =
    groups_attribute_path =
    tls_skip_verify_insecure = false

    [auth.gitlab]
    enabled = false
    allow_sign_up = true
    client_id = some_id
    client_secret = some_secret
    scopes = read_user
    auth_url = https://gitlab.com/oauth/authorize
    token_url = https://gitlab.com/oauth/token
    api_url = https://gitlab.com/api/v4/user
    allowed_domains =
    team_ids =
    allowed_organizations =
    role_attribute_path =
    groups_attribute_path =
    tls_skip_verify_insecure = false

    [log]
    mode = console
    level = info
    format = text

    [log.frontend]
    enabled = true
    logger_name = frontend

    [log.console]
    level = info
    format = text

    [log.file]
    level = info
    format = text
    log_rotate = true
    max_lines = 1000000
    max_size_shift = 28
    daily_rotate = true
    max_days = 7

    [log.syslog]
    network = udp
    address = localhost:514
    facility = daemon
    tag = grafana

    [event_publisher]
    enabled = false
    rabbitmq_url = amqp://localhost/
    exchange = grafana_events
    exchange_type = fanout

    [metric]
    enabled = true
    interval_seconds = 10
    disable_total_stats = false
    basic_auth_username =
    basic_auth_password =
    statsd_address = :8125
    statsd_prefix = grafana

    [grafana_com]
    url = https://grafana.com

    [tracing.jaeger]
    address = tempo.monitoring.svc.cluster.local:14268
    always_included_tag = tag1:value1
    sampler_type = const
    sampler_param = 1
    sampling_server_url =

    [tracing.datadog]
    address = localhost:8126
    always_included_tag = tag1:value1

    [tracing.zipkin]
    address = localhost:9411
    always_included_tag = tag1:value1

    [tracing.opentelemetry]
    address = localhost:4317
    always_included_tag = tag1:value1

    [unified_alerting]
    enabled = true
    admin_config_poll_interval = 60s
    ha_redis_address = redis.monitoring.svc.cluster.local:6379
    ha_redis_password =
    ha_redis_db = 0
    ha_redis_prefix = grafana
    ha_listen_address = 0.0.0.0:9094
    ha_peer_timeout = 15s
    ha_gossip_interval = 200ms
    ha_push_pull_interval = 60s
    evaluation_timeout = 30s
    max_attempts = 3
    min_interval = 10s
    search_max_results = 1000
    alert_rule_config_cache_expiration = 5m
    no_data_state = NoData
    error_state = Error

    [alerting]
    enabled = true
    execute_alerts = true
    error_or_timeout = alerting
    no_data_state = no_data
    min_interval_seconds = 10
    max_attempts = 3
    min_interval = 10s
    search_max_results = 1000

    [alerting.notification]
    send_email = true
    webhook_retry = 3
    webhook_timeout = 30s

    [remote_cache]
    type = database

    [dataproxy]
    timeout = 30
    dial_timeout = 10
    keep_alive_seconds = 30
    tls_handshake_timeout_seconds = 10
    tls_skip_verify_insecure = false
    send_user_header = false

    [plugins]
    enable_alpha = false
    allow_loading_unsigned_plugins =
    plugin_admin_enabled = true
    plugin_admin_external_manage = false
    plugin_catalog_url = https://grafana.com/api/plugins
    plugin_catalog_hidden =

    [panels]
    disable_sanitize_html = false

    [dates]
    default_timezone = UTC

    [databricks]
    enabled = false

    [sentry]
    enabled = false
    dsn =
    environment = production

    [live]
    enabled = true
    max_connections = 100
    ha_engine = ""
    ha_engine_address = ""
    ha_engine_max_connections = 100
    ha_channel_prefix =

    [feature_toggles]
    enable =

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ishastra-observability
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: https://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        jsonData:
          tlsSkipVerify: false
          timeInterval: "30s"
          queryTimeout: "60s"
          httpMethod: POST
          exemplarsTraceIdDestinations:
            - name: TraceID
              datasourceUid: tempo
        secureJsonData:
          httpHeaderValue1: ""
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: https://loki.monitoring.svc.cluster.local:3100
        editable: false
        jsonData:
          tlsSkipVerify: false
          timeInterval: "30s"
          queryTimeout: "60s"
          maxLines: 1000
          derivedFields:
            - name: traceID
              matcherRegex: "traceID=(\\w+)"
              url: '$${__value.raw}'
              datasourceUid: tempo
        secureJsonData:
          httpHeaderValue1: ""
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: https://tempo.monitoring.svc.cluster.local:3200
        editable: false
        jsonData:
          tlsSkipVerify: false
          timeInterval: "30s"
          queryTimeout: "60s"
          nodeGraph:
            enabled: true
          search:
            hide: false
          spans:
            search:
              hide: false
          tracesToLogs:
            datasourceUid: loki
            tags:
              - job
              - component
            spanStartTimeShift: "1h"
            spanEndTimeShift: "-1h"
            filterByTraceID: true
            filterBySpanID: false
          lokiSearch:
            datasourceUid: loki
        secureJsonData:
          httpHeaderValue1: ""
      - name: Alertmanager
        type: alertmanager
        uid: alertmanager
        access: proxy
        url: https://alertmanager.monitoring.svc.cluster.local:9093
        editable: false
        jsonData:
          tlsSkipVerify: false
          implementation: prometheus
        secureJsonData:
          httpHeaderValue1: ""

