# Kustomize overlay for Strix Observability Stack - Production
# Apply with: kubectl apply -k deploy/monitoring/kubernetes/
# Requires: Prometheus Operator CRDs installed, cert-manager for TLS

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Common metadata applied to all resources
commonLabels:
  app.kubernetes.io/name: strix-observability
  app.kubernetes.io/part-of: strix
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "3.5.0"
  environment: production

# Namespace for all resources
namespace: monitoring

# Resources in dependency order (CRDs first, then operators, then CRs)
resources:
  # 1. Prometheus Operator CRDs + Operator deployment (must be first)
  - prometheus-operator.yaml

  # 2. Core monitoring components (Prometheus, Alertmanager, Grafana)
  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml

  # 3. Logging stack (Loki + Promtail)
  - loki.yaml

  # 4. Tracing stack (Tempo + OTel Collector)
  - tempo.yaml

  # 5. ServiceMonitors and PodMonitors for scraping
  - servicemonitors.yaml

  # 6. PrometheusRules for alerting
  - prometheusrules.yaml

  # 7. Grafana datasources and dashboards
  - grafana-datasources.yaml
  - grafana-dashboards.yaml

# ConfigMapGenerator for TLS certificates (create from files or cert-manager)
