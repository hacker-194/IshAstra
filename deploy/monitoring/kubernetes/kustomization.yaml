# Patches for production-specific configurations
patches:
  # Increase Prometheus retention for production
  - patch: |-
      apiVersion: monitoring.coreos.com/v1
      kind: Prometheus
      metadata:
        name: strix-prometheus
        namespace: monitoring
      spec:
        retention: 30d
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 100Gi
    target:
      kind: Prometheus
      name: strix-prometheus

  # Increase Grafana replicas for HA
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: monitoring
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: grafana

  # Increase Loki retention for production
  - patch: |-
      apiVersion: v1
      kind: StatefulSet
      metadata:
        name: loki
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: loki
                args:
                  - -config.file=/etc/loki/loki.yaml
                  - -target=all
                env:
                  - name: LOKI_S3_BUCKET
                    value: strix-loki-production
    target:
      kind: StatefulSet
      name: loki

  # Increase Tempo retention for production
  - patch: |-
      apiVersion: v1
      kind: StatefulSet
      metadata:
        name: tempo
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: tempo
                args:
                  - -config.file=/etc/tempo/tempo.yaml
                  - -target=all
                env:
                  - name: TEMPO_S3_BUCKET
                    value: strix-tempo-production
    target:
      kind: StatefulSet
      name: tempo

  # Increase Alertmanager storage for production
  - patch: |-
      apiVersion: monitoring.coreos.com/v1
      kind: Alertmanager
      metadata:
        name: strix-alertmanager
        namespace: monitoring
      spec:
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 20Gi
    target:
      kind: Alertmanager
      name: strix-alertmanager

# Replica count overrides for production HA
replicas:
  - name: prometheus-operator
    count: 2
  - name: grafana
    count: 3

# Images with specific tags for production (pin to specific versions)
images:
  - name: quay.io/prometheus-operator/prometheus-operator
    newTag: v0.75.2
  - name: prom/prometheus
    newTag: v2.48.1
  - name: prom/alertmanager
    newTag: v0.26.0
  - name: grafana/grafana
    newTag: 10.2.2
  - name: grafana/loki
    newTag: 2.9.2
  - name: grafana/promtail
    newTag: 2.9.2
  - name: grafana/tempo
    newTag: 2.3.1
  - name: otel/opentelemetry-collector-contrib
    newTag: 0.95.0
  - name: quay.io/prometheus/node-exporter
    newTag: v1.6.1
  - name: quay.io/prometheus/kube-state-metrics
    newTag: v2.9.2
  - name: gcr.io/cadvisor/cadvisor
    newTag: v0.47.2
  - name: oliver006/redis_exporter
    newTag: v1.45.0
  - name: nginx/nginx-prometheus-exporter
    newTag: v0.11.0

# ConfigMap for environment-specific settings
configMapGenerator:
  - name: strix-observability-config
    namespace: monitoring
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - METRICS_RETENTION=30d
      - LOGS_RETENTION=14d
      - TRACES_RETENTION=7d
      - SAMPLE_RATE=0.1
      - ENABLE_EXEMPLARS=true
      - CLUSTER_NAME=strix-production

# Secret for TLS certificates (managed by cert-manager in production)
# These are placeholders - cert-manager will create actual secrets
# secretGenerator:
#   - name: prometheus-tls
#     namespace: monitoring
#     type: kubernetes.io/tls
#   - name: alertmanager-tls
#     namespace: monitoring
#     type: kubernetes.io/tls
#   - name: grafana-tls
#     namespace: monitoring
#     type: kubernetes.io/tls
#   - name: loki-tls
#     namespace: monitoring
#     type: kubernetes.io/tls
#   - name: tempo-tls
#     namespace: monitoring
#     type: kubernetes.io/tls

# Validation and ordering
vars:
  - name: ENVIRONMENT
    objref:
      kind: ConfigMap
      name: strix-observability-config
      apiVersion: v1
    fieldref:
      fieldpath: data.ENVIRONMENT

# Prune options for production (remove resources not in kustomization)
# prune: true
# pruneOptions:
#   labelSelector: app.kubernetes.io/part-of=strix-observability