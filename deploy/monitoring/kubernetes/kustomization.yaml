



apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


commonLabels:
  app.kubernetes.io/name: ishastra-observability
  app.kubernetes.io/part-of: ishastra
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "3.5.0"
  environment: production


namespace: monitoring


resources:

  - prometheus-operator.yaml


  - prometheus.yaml
  - alertmanager.yaml
  - grafana.yaml


  - loki.yaml


  - tempo.yaml


  - servicemonitors.yaml


  - prometheusrules.yaml


  - grafana-datasources.yaml
  - grafana-dashboards.yaml





























































patches:

  - patch: |-
      apiVersion: monitoring.coreos.com/v1
      kind: Prometheus
      metadata:
        name: ishastra-prometheus
        namespace: monitoring
      spec:
        retention: 30d
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 100Gi
    target:
      kind: Prometheus
      name: ishastra-prometheus


  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: monitoring
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: grafana


  - patch: |-
      apiVersion: v1
      kind: StatefulSet
      metadata:
        name: loki
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: loki
                args:
                  - -config.file=/etc/loki/loki.yaml
                  - -target=all
                env:
                  - name: LOKI_S3_BUCKET
                    value: ishastra-loki-production
    target:
      kind: StatefulSet
      name: loki


  - patch: |-
      apiVersion: v1
      kind: StatefulSet
      metadata:
        name: tempo
        namespace: monitoring
      spec:
        template:
          spec:
            containers:
              - name: tempo
                args:
                  - -config.file=/etc/tempo/tempo.yaml
                  - -target=all
                env:
                  - name: TEMPO_S3_BUCKET
                    value: ishastra-tempo-production
    target:
      kind: StatefulSet
      name: tempo


  - patch: |-
      apiVersion: monitoring.coreos.com/v1
      kind: Alertmanager
      metadata:
        name: ishastra-alertmanager
        namespace: monitoring
      spec:
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 20Gi
    target:
      kind: Alertmanager
      name: ishastra-alertmanager


replicas:
  - name: prometheus-operator
    count: 2
  - name: grafana
    count: 3


images:
  - name: quay.io/prometheus-operator/prometheus-operator
    newTag: v0.75.2
  - name: prom/prometheus
    newTag: v2.48.1
  - name: prom/alertmanager
    newTag: v0.26.0
  - name: grafana/grafana
    newTag: 10.2.2
  - name: grafana/loki
    newTag: 2.9.2
  - name: grafana/promtail
    newTag: 2.9.2
  - name: grafana/tempo
    newTag: 2.3.1
  - name: otel/opentelemetry-collector-contrib
    newTag: 0.95.0
  - name: quay.io/prometheus/node-exporter
    newTag: v1.6.1
  - name: quay.io/prometheus/kube-state-metrics
    newTag: v2.9.2
  - name: gcr.io/cadvisor/cadvisor
    newTag: v0.47.2
  - name: oliver006/redis_exporter
    newTag: v1.45.0
  - name: nginx/nginx-prometheus-exporter
    newTag: v0.11.0


configMapGenerator:
  - name: ishastra-observability-config
    namespace: monitoring
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - METRICS_RETENTION=30d
      - LOGS_RETENTION=14d
      - TRACES_RETENTION=7d
      - SAMPLE_RATE=0.1
      - ENABLE_EXEMPLARS=true
      - CLUSTER_NAME=ishastra-production





















vars:
  - name: ENVIRONMENT
    objref:
      kind: ConfigMap
      name: ishastra-observability-config
      apiVersion: v1
    fieldref:
      fieldpath: data.ENVIRONMENT




