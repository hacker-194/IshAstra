---
# Prometheus Operator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-operator
  namespace: monitoring
  labels:
    app: prometheus-operator
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/version: "0.75.0"
    app.kubernetes.io/part-of: strix-observability
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-operator
  template:
    metadata:
      labels:
        app: prometheus-operator
        app.kubernetes.io/name: prometheus-operator
        app.kubernetes.io/version: "0.75.0"
        app.kubernetes.io/part-of: strix-observability
        app.kubernetes.io/component: operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: prometheus-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus-operator
          image: quay.io/prometheus-operator/prometheus-operator:v0.75.0
          args:
            - --kubelet-service=monitoring/kubelet
            - --config-reloader-image=quay.io/prometheus-operator/prometheus-config-reloader:v0.75.0
            - --prometheus-config-reloader=quay.io/prometheus-operator/prometheus-config-reloader:v0.75.0
            - --alertmanager-config-reloader=quay.io/prometheus-operator/prometheus-config-reloader:v0.75.0
            - --thanos-image=quay.io/thanos/thanos:v0.35.0
            - --thanos-web-image=quay.io/thanos/thanos:v0.35.0
            - --enable-admission-webhooks=true
            - --webhook-port=8081
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8081
              name: webhook
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
      volumes:
        - name: webhook-certs
          secret:
            secretName: prometheus-operator-webhook-certs
            optional: true

---
# Service for Prometheus Operator metrics and webhook
apiVersion: v1
kind: Service
metadata:
  name: prometheus-operator
  namespace: monitoring
  labels:
    app: prometheus-operator
    app.kubernetes.io/name: prometheus-operator
    app.kubernetes.io/part-of: strix-observability
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: webhook
      port: 8081
      targetPort: webhook
      protocol: TCP
  selector:
    app: prometheus-operator

