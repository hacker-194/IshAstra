



---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: prometheus

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
      - namespaces
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - proxy
  - nonResourceURLs:
      - /metrics
      - /metrics/*
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: prometheus
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: v1
kind: Secret
metadata:
  name: ishastra-api-key
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
stringData:
  api-key: ${ISHASTRA_API_KEY}

---

apiVersion: v1
kind: Secret
metadata:
  name: prometheus-tls
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: ishastra-production
        environment: production

    alerting:
      alertmanagers:
        - namespace: monitoring
          name: alertmanager
          port: http-web
          scheme: https
          tls_config:
            ca_file: /etc/prometheus/certs/alertmanager-ca.crt
            cert_file: /etc/prometheus/certs/prometheus-client.crt
            key_file: /etc/prometheus/certs/prometheus-client.key
            server_name: alertmanager.monitoring.svc.cluster.local

    remote_write:
      - url: https://prometheus.monitoring.svc.cluster.local:9091/api/v1/write
        tls_config:
          ca_file: /etc/prometheus/certs/remote-write-ca.crt
          cert_file: /etc/prometheus/certs/prometheus-client.crt
          key_file: /etc/prometheus/certs/prometheus-client.key


    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
        scheme: https
        tls_config:
          ca_file: /etc/prometheus/certs/prometheus-ca.crt
          cert_file: /etc/prometheus/certs/prometheus-client.crt
          key_file: /etc/prometheus/certs/prometheus-client.key

      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: kubernetes-nodes
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: kubernetes-cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: kubernetes-service-endpoints
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: kubernetes_name

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

---

apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: prometheus
    prometheus: ishastra
spec:

  replicas: 2


  serviceAccountName: prometheus


  securityContext:
    fsGroup: 65534
    runAsNonRoot: true
    runAsUser: 65534


  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi


  storage:
    volumeClaimTemplate:
      metadata:
        name: prometheus-data
        labels:
          app: prometheus
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        storageClassName: fast-ssd


  retention: 15d
  retentionSize: 45Gi


  enableAdminAPI: true


  enableRemoteWriteReceiver: true


  query:
    maxConcurrency: 20
    maxSamples: 50000000
    timeout: 2m
    lookbackDelta: 5m


  web:
    enableRemoteShutdown: false
    enableRemoteWriteReceiver: true
    pageTitle: "Ishastra Prometheus"
    routePrefix: /
    externalUrl: https://prometheus.ishastra.example.com
    tlsConfig:
      certFile: /etc/prometheus/certs/tls.crt
      keyFile: /etc/prometheus/certs/tls.key
      clientCAFile: /etc/prometheus/certs/ca.crt
      minVersion: TLS1.2
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256


  additionalScrapeConfigs:
    name: prometheus-config
    key: prometheus.yml


  serviceMonitorSelector:
    matchLabels:
      release: prometheus
  serviceMonitorNamespaceSelector:
    matchNames:
      - monitoring
      - ishastra
      - kube-system


  podMonitorSelector:
    matchLabels:
      release: prometheus
  podMonitorNamespaceSelector:
    matchNames:
      - monitoring
      - ishastra


  ruleSelector:
    matchLabels:
      release: prometheus
  ruleNamespaceSelector:
    matchNames:
      - monitoring
      - ishastra


  alerting:
    alertmanagers:
      - namespace: monitoring
        name: alertmanager
        port: http-web
        scheme: https
        tlsConfig:
          caFile: /etc/prometheus/certs/alertmanager-ca.crt
          certFile: /etc/prometheus/certs/prometheus-client.crt
          keyFile: /etc/prometheus/certs/prometheus-client.key
          serverName: alertmanager.monitoring.svc.cluster.local
        apiVersion: v2
        timeout: 10s


  remoteWrite:
    - url: https://thanos-receive.monitoring.svc.cluster.local:10902/api/v1/receive
      tlsConfig:
        caFile: /etc/prometheus/certs/remote-write-ca.crt
        certFile: /etc/prometheus/certs/prometheus-client.crt
        keyFile: /etc/prometheus/certs/prometheus-client.key
      queueConfig:
        capacity: 10000
        maxShards: 100
        minShards: 10
        maxSamplesPerSend: 5000
        batchSendDeadline: 20s
        minBackoff: 100ms
        maxBackoff: 10s


  image: quay.io/prometheus/prometheus:v2.48.0


  nodeSelector:
    node-role.kubernetes.io/monitoring: "true"
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "monitoring"
      effect: "NoSchedule"


  priorityClassName: system-cluster-critical


  volumes:
    - name: prometheus-tls
      secret:
        secretName: prometheus-tls
    - name: alertmanager-ca
      secret:
        secretName: alertmanager-ca
    - name: remote-write-ca
      secret:
        secretName: remote-write-ca
    - name: prometheus-client-certs
      secret:
        secretName: prometheus-client-certs


  volumeMounts:
    - name: prometheus-tls
      mountPath: /etc/prometheus/certs
      readOnly: true
    - name: alertmanager-ca
      mountPath: /etc/prometheus/certs/alertmanager-ca.crt
      subPath: ca.crt
      readOnly: true
    - name: remote-write-ca
      mountPath: /etc/prometheus/certs/remote-write-ca.crt
      subPath: ca.crt
      readOnly: true
    - name: prometheus-client-certs
      mountPath: /etc/prometheus/certs/prometheus-client.crt
      subPath: tls.crt
      readOnly: true
    - name: prometheus-client-certs
      mountPath: /etc/prometheus/certs/prometheus-client.key
      subPath: tls.key
      readOnly: true

---

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http-web
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: grpc
      port: 9091
      targetPort: 9091
      protocol: TCP
  selector:
    app: prometheus
    prometheus: ishastra

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    release: prometheus
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
spec:
  selector:
    matchLabels:
      app: prometheus
      prometheus: ishastra
  endpoints:
    - port: http-web
      path: /metrics
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        caFile: /etc/prometheus/certs/prometheus-ca.crt
        certFile: /etc/prometheus/certs/prometheus-client.crt
        keyFile: /etc/prometheus/certs/prometheus-client.key
        serverName: prometheus.monitoring.svc.cluster.local
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  namespaceSelector:
    matchNames:
      - monitoring

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: prometheus
      prometheus: ishastra

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
spec:
  scaleTargetRef:
    apiVersion: monitoring.coreos.com/v1
    kind: Prometheus
    name: prometheus
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: ishastra-observability
spec:
  podSelector:
    matchLabels:
      app: prometheus
      prometheus: ishastra
  policyTypes:
    - Ingress
    - Egress
  ingress:

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus-operator
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - protocol: TCP
          port: 9090

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090

    - from:
        - podSelector:
            matchLabels:
              app: prometheus
              prometheus: ishastra
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9091
  egress:

    - to:
        - namespaceSelector:
            matchLabels:
              name: ishastra
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090

    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 9100
        - protocol: TCP
          port: 10250
        - protocol: TCP
          port: 10255

    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3100
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 9095

    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: thanos-receive
      ports:
        - protocol: TCP
          port: 10902