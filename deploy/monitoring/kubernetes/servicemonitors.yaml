



---

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: ishastra-observability

---

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ishastra-api
  namespace: monitoring
  labels:
    release: prometheus
    app: ishastra
    app.kubernetes.io/name: ishastra-api
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: service-monitor
spec:
  selector:
    matchLabels:
      app: ishastra
      component: api
  endpoints:
    - port: http
      path: /api/metrics
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        certFile: /etc/prometheus/certs/prometheus-client.crt
        keyFile: /etc/prometheus/certs/prometheus-client.key
        serverName: ishastra-api.ishastra.svc.cluster.local
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          targetLabel: component
  namespaceSelector:
    matchNames:
      - ishastra

