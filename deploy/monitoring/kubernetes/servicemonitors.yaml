# Kubernetes ServiceMonitors for Prometheus Operator
# Apply with: kubectl apply -f servicemonitors.yaml
# Requires Prometheus Operator CRDs installed

---
# Namespace for monitoring stack
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: strix-observability

---
# ServiceMonitor for Strix API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: strix-api
  namespace: monitoring
  labels:
    release: prometheus
    app: strix
    app.kubernetes.io/name: strix-api
    app.kubernetes.io/part-of: strix-observability
    app.kubernetes.io/component: service-monitor
spec:
  selector:
    matchLabels:
      app: strix
      component: api
  endpoints:
    - port: http
      path: /api/metrics
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        certFile: /etc/prometheus/certs/prometheus-client.crt
        keyFile: /etc/prometheus/certs/prometheus-client.key
        serverName: strix-api.strix.svc.cluster.local
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          targetLabel: component
  namespaceSelector:
    matchNames:
      - strix

