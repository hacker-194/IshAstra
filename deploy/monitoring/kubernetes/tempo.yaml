apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tempo
  namespace: monitoring
  labels:
    app: tempo
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ishastra-observability
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: tempo

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tempo
  namespace: monitoring
  labels:
    app: tempo
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ishastra-observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: tempo
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ishastra-observability
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: ishastra-observability
        app.kubernetes.io/component: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.103.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otel-collector/otel-collector-config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
            - containerPort: 4318
              name: otlp-http
              protocol: TCP
            - containerPort: 8888
              name: prometheus
              protocol: TCP
            - containerPort: 13133
              name: health
              protocol: TCP
            - containerPort: 55679
              name: zpages
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ISHASTRA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ishastra-api-key
                  key: api-key
                  optional: true
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel-collector
              readOnly: true
            - name: otel-collector-tls
              mountPath: /etc/otel-collector/certs
              readOnly: true
            - name: tempo-ca
              mountPath: /etc/otel-collector/certs/tempo-ca.crt
              subPath: ca.crt
              readOnly: true
            - name: otel-client-certs
              mountPath: /etc/otel-collector/certs/otel-client.crt
              subPath: tls.crt
              readOnly: true
            - name: otel-client-certs
              mountPath: /etc/otel-collector/certs/otel-client.key
              subPath: tls.key
              readOnly: true
      volumes:
        - name: otel-collector-config
          secret:
            secretName: otel-collector-config
        - name: otel-collector-tls
          secret:
            secretName: otel-collector-tls
        - name: tempo-ca
          secret:
            secretName: tempo-ca
        - name: otel-client-certs
          secret:
            secretName: otel-client-certs

