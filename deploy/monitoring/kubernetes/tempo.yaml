apiVersion: v1
kind: Secret
metadata:
  name: tempo-config
  namespace: monitoring
  labels:
    app: tempo
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
stringData:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        jaeger:
          protocols:
            thrift_http:
              endpoint: 0.0.0.0:14268
        zipkin:
          endpoint: 0.0.0.0:9411

    ingester:
      max_block_duration: 5m
      max_block_bytes: 1_048_576
      complete_block_timeout: 15m
      lifecycler:
        ring:
          replication_factor: 1
        final_sleep: 0s

    compactor:
      compaction:
        block_retention: 336h
        compacted_block_retention: 1h
      compaction_window: 1h

    storage:
      trace:
        backend: local
        local:
          path: /tempo/traces
        pool:
          max_workers: 100
          queue_depth: 10000
        wal:
          path: /tempo/wal
          encoding: snappy


    blocklist:
      poll_interval: 5m


    limits:
      ingestion_rate_limit: 10MB
      ingestion_burst_limit: 20MB
      max_spans_per_trace: 10000
      max_trace_idle_time: 5m


    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
      max_outstanding_requests_per_tenant: 100

    metrics_generator:
      registry:
        external_labels:
          source: tempo
          cluster: ishastra-production
      storage:
        path: /tempo/metrics-generator
        remote_write:
          - url: https://prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            send_exemplars: true
            tls_config:
              ca_file: /etc/tempo/certs/prometheus-ca.crt
              cert_file: /etc/tempo/certs/tempo-client.crt
              key_file: /etc/tempo/certs/tempo-client.key
              server_name: prometheus.monitoring.svc.cluster.local
      processor:
        service_graphs:
          dimensions:
            - service.name
            - service.namespace
        span_metrics:
          dimensions:
            - service.name
            - span.name
            - span.kind
            - status.code


    reporting:
      enabled: false


    log_level: info


    tls:
      cert_file: /etc/tempo/certs/tls.crt
      key_file: /etc/tempo/certs/tls.key
      client_ca_file: /etc/tempo/certs/ca.crt
      min_version: TLS1.2
      cipher_suites:
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

---

apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-config
  namespace: monitoring
  labels:
    app: otel-collector
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: ishastra-observability
type: Opaque
stringData:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/otel-collector/certs/tls.crt
              key_file: /etc/otel-collector/certs/tls.key
              client_ca_file: /etc/otel-collector/certs/ca.crt
          http:
            endpoint: 0.0.0.0:4318
            tls:
              cert_file: /etc/otel-collector/certs/tls.crt
              key_file: /etc/otel-collector/certs/tls.key
              client_ca_file: /etc/otel-collector/certs/ca.crt
      prometheus:
        config:
          scrape_configs:
            - job_name: 'ishastra'
              static_configs:
                - targets: ['ishastra.ishastra.svc.cluster.local:8000']
              metrics_path: '/api/metrics'
              scheme: https
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              authorization:
                type: Bearer
                credentials: ${ISHASTRA_API_KEY}

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      resource:
        attributes:
          - key: service.name
            value: "ishastra"
            action: insert
          - key: service.namespace
            value: "ishastra-production"
            action: insert
          - key: deployment.environment
            value: "production"
            action: insert
      k8sattributes:
        auth_type: "service_account"
        pod_association:
          - from: resource_attribute
            name: k8s.pod.ip
        namespace: "ishastra"
        filter:
          node_from_env_var: KUBE_NODE_NAME
      tail_sampling:
        decision_wait: 30s
        num_traces: 50000
        expected_new_traces_per_sec: 1000
        policy:
          - name: errors
            type: string_attribute
            string_attribute:
              key: status.code
              values: ["ERROR", "error", "5xx"]
          - name: slow
            type: latency
            latency:
              threshold_ms: 5000
          - name: critical-ops
            type: string_attribute
            string_attribute:
              key: http.route
              values: ["/api/v1/assessments", "/api/v1/jobs"]
          - name: default
            type: probabilistic
            probabilistic:
              sampling_percentage: 10

    exporters:
      otlp:
        endpoint: tempo.monitoring.svc.cluster.local:4317
        tls:
          ca_file: /etc/otel-collector/certs/tempo-ca.crt
          cert_file: /etc/otel-collector/certs/otel-client.crt
          key_file: /etc/otel-collector/certs/otel-client.key
          server_name: tempo.monitoring.svc.cluster.local
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      prometheus:
        endpoint: 0.0.0.0:8888
        namespace: ishastra
        send_timestamps: true
      logging:
        loglevel: debug
        sampling_initial: 5
        sampling_thereafter: 100

    service:
      extensions: [health_check, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, k8sattributes, tail_sampling]
          exporters: [otlp, logging]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
      telemetry:
        logs:
          level: info
        metrics:
          level: detailed
        address: 0.0.0.0:8888

