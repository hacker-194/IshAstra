apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tempo
  namespace: monitoring
  labels:
    release: prometheus
    app: tempo
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: ishastra-observability
spec:
  selector:
    matchLabels:
      app: tempo
  endpoints:
    - port: http
      path: /metrics
      scheme: https
      interval: 30s
      scrapeTimeout: 10s
      tlsConfig:
        caFile: /etc/prometheus/certs/tempo-ca.crt
        certFile: /etc/prometheus/certs/prometheus-client.crt
        keyFile: /etc/prometheus/certs/prometheus-client.key
        serverName: tempo.monitoring.svc.cluster.local
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
  namespaceSelector:
    matchNames:
      - monitoring

