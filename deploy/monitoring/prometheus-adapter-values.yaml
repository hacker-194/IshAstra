prometheus:
  url: http://prometheus-operated.monitoring.svc
  port: 9090

rules:
  default: false
  external:
    - seriesQuery: 'ishastra_assessment_queue_pending'
      name:
        matches: "^ishastra_assessment_queue_pending$"
        as: ishastra_assessment_queue_pending
      metricsQuery: "sum(<<.Series>>)"
    - seriesQuery: 'ishastra_scope_gate_decision_latency_seconds_p95'
      name:
        matches: "^ishastra_scope_gate_decision_latency_seconds_p95$"
        as: ishastra_scope_gate_decision_latency_seconds_p95
      metricsQuery: "max(<<.Series>>)"
