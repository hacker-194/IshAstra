prometheus:
  url: http://prometheus-operated.monitoring.svc
  port: 9090

rules:
  default: false
  external:
    - seriesQuery: 'strix_assessment_queue_pending'
      name:
        matches: "^strix_assessment_queue_pending$"
        as: strix_assessment_queue_pending
      metricsQuery: "sum(<<.Series>>)"
    - seriesQuery: 'strix_scope_gate_decision_latency_seconds_p95'
      name:
        matches: "^strix_scope_gate_decision_latency_seconds_p95$"
        as: strix_scope_gate_decision_latency_seconds_p95
      metricsQuery: "max(<<.Series>>)"
