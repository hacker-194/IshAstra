global:
  scrape_interval: 30s
  evaluation_interval: 30s


alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]


rule_files:
  - "alerting.yml"

scrape_configs:
  - job_name: ishastra
    scheme: http
    metrics_path: /api/metrics
    authorization:
      type: Bearer

      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["ishastra:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]


  - job_name: redis
    static_configs:
      - targets: ["redis:9121"]

