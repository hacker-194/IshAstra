global:
  scrape_interval: 30s
  evaluation_interval: 30s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Rule files
rule_files:
  - "alerting.yml"

scrape_configs:
  - job_name: strix
    scheme: http
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      # Mounted from ./secrets/strix_api_key by docker-compose.monitoring.yml.
      credentials_file: /etc/prometheus/token
    static_configs:
      - targets: ["strix:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Redis metrics (requires redis_exporter sidecar or built-in metrics in Redis 7+)
  - job_name: redis
    static_configs:
      - targets: ["redis:9121"]
    # Note: Requires redis_exporter container or Redis 7.2+ with --enable-module metrics
    # See: https://github.com/oliver006/redis_exporter