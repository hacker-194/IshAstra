



apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ishastra-sli-slo
  namespace: monitoring
  labels:
    release: prometheus
    app: ishastra
spec:
  groups:
    - name: ishastra.sli.slo
      interval: 30s
      rules:




        - record: ishastra:sli:api_availability:ratio_rate5m
          expr: |
            sum(rate(ishastra_http_requests_total{status!~"5.."}[5m]))
            /
            sum(rate(ishastra_http_requests_total[5m]))


        - record: ishastra:slo:api_availability:target
          expr: 0.999


        - record: ishastra:slo:api_availability:error_budget_remaining
          expr: |
            (
              1 - (0.999 - ishastra:sli:api_availability:ratio_rate5m)
            ) / (1 - 0.999)


        - alert: IshastraSLOApiAvailabilityFastBurn
          expr: |
            (1 - ishastra:sli:api_availability:ratio_rate1h) / (1 - 0.999) > 0.02
          for: 5m
          labels:
            severity: critical
            component: slo
            slo: api_availability
          annotations:
            summary: "API Availability SLO fast burn rate detected"
            description: |
              API availability error budget is burning at {{ $value | printf "%.2f" }}% per hour.
              At this rate, the 30-day error budget will be exhausted in {{ 1 / $value | printf "%.1f" }} hours.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-api-availability.md"


        - alert: IshastraSLOApiAvailabilitySlowBurn
          expr: |
            (1 - ishastra:sli:api_availability:ratio_rate6h) / (1 - 0.999) > 0.10
          for: 30m
          labels:
            severity: warning
            component: slo
            slo: api_availability
          annotations:
            summary: "API Availability SLO slow burn rate detected"
            description: |
              API availability error budget is burning at {{ $value | printf "%.2f" }}% per 6 hours.
              At this rate, the 30-day error budget will be exhausted in {{ 6 / $value | printf "%.1f" }} hours.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-api-availability.md"





        - record: ishastra:sli:api_latency_p99:ratio_rate5m
          expr: |
            sum(rate(ishastra_http_request_duration_seconds_bucket{le="5.0"}[5m]))
            /
            sum(rate(ishastra_http_request_duration_seconds_count[5m]))


        - record: ishastra:slo:api_latency_p99:target
          expr: 0.99

        - record: ishastra:slo:api_latency_p99:error_budget_remaining
          expr: |
            (
              1 - (0.99 - ishastra:sli:api_latency_p99:ratio_rate5m)
            ) / (1 - 0.99)

        - alert: IshastraSLOApiLatencyFastBurn
          expr: |
            (1 - ishastra:sli:api_latency_p99:ratio_rate1h) / (1 - 0.99) > 0.02
          for: 5m
          labels:
            severity: critical
            component: slo
            slo: api_latency_p99
          annotations:
            summary: "API Latency SLO fast burn rate detected"
            description: |
              API p99 latency error budget is burning at {{ $value | printf "%.2f" }}% per hour.
              Current p99 ratio: {{ ishastra:sli:api_latency_p99:ratio_rate1h | printf "%.4f" }}
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-api-latency.md"

        - alert: IshastraSLOApiLatencySlowBurn
          expr: |
            (1 - ishastra:sli:api_latency_p99:ratio_rate6h) / (1 - 0.99) > 0.10
          for: 30m
          labels:
            severity: warning
            component: slo
            slo: api_latency_p99
          annotations:
            summary: "API Latency SLO slow burn rate detected"
            description: |
              API p99 latency error budget is burning at {{ $value | printf "%.2f" }}% per 6 hours.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-api-latency.md"





        - record: ishastra:sli:job_completion:ratio_rate5m
          expr: |
            sum(rate(ishastra_jobs_total{state="completed"}[5m]))
            /
            sum(rate(ishastra_jobs_total{state=~"completed|failed"}[5m]))


        - record: ishastra:slo:job_completion:target
          expr: 0.95

        - record: ishastra:slo:job_completion:error_budget_remaining
          expr: |
            (
              1 - (0.95 - ishastra:sli:job_completion:ratio_rate5m)
            ) / (1 - 0.95)

        - alert: IshastraSLOJobCompletionFastBurn
          expr: |
            (1 - ishastra:sli:job_completion:ratio_rate1h) / (1 - 0.95) > 0.02
          for: 5m
          labels:
            severity: critical
            component: slo
            slo: job_completion
          annotations:
            summary: "Job Completion SLO fast burn rate detected"
            description: |
              Job completion error budget is burning at {{ $value | printf "%.2f" }}% per hour.
              Current completion ratio: {{ ishastra:sli:job_completion:ratio_rate1h | printf "%.4f" }}
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-job-completion.md"

        - alert: IshastraSLOJobCompletionSlowBurn
          expr: |
            (1 - ishastra:sli:job_completion:ratio_rate6h) / (1 - 0.95) > 0.10
          for: 30m
          labels:
            severity: warning
            component: slo
            slo: job_completion
          annotations:
            summary: "Job Completion SLO slow burn rate detected"
            description: |
              Job completion error budget is burning at {{ $value | printf "%.2f" }}% per 6 hours.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-job-completion.md"





        - record: ishastra:sli:job_queue_latency:ratio_rate5m
          expr: |
            sum(rate(ishastra_job_queue_duration_seconds_bucket{le="60.0"}[5m]))
            /
            sum(rate(ishastra_job_queue_duration_seconds_count[5m]))


        - record: ishastra:slo:job_queue_latency:target
          expr: 0.95

        - record: ishastra:slo:job_queue_latency:error_budget_remaining
          expr: |
            (
              1 - (0.95 - ishastra:sli:job_queue_latency:ratio_rate5m)
            ) / (1 - 0.95)

        - alert: IshastraSLOJobQueueLatencyFastBurn
          expr: |
            (1 - ishastra:sli:job_queue_latency:ratio_rate1h) / (1 - 0.95) > 0.02
          for: 5m
          labels:
            severity: warning
            component: slo
            slo: job_queue_latency
          annotations:
            summary: "Job Queue Latency SLO fast burn rate detected"
            description: |
              Job queue latency error budget is burning at {{ $value | printf "%.2f" }}% per hour.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-job-queue-latency.md"





        - record: ishastra:sli:adapter_success:ratio_rate5m
          expr: |
            1 - (
              sum(rate(ishastra_adapter_errors_total[5m]))
              /
              sum(rate(ishastra_adapter_errors_total[5m] + ishastra_adapter_duration_seconds_count[5m]))
            )


        - record: ishastra:slo:adapter_success:target
          expr: 0.99

        - record: ishastra:slo:adapter_success:error_budget_remaining
          expr: |
            (
              1 - (0.99 - ishastra:sli:adapter_success:ratio_rate5m)
            ) / (1 - 0.99)

        - alert: IshastraSLOAdapterSuccessFastBurn
          expr: |
            (1 - ishastra:sli:adapter_success:ratio_rate1h) / (1 - 0.99) > 0.02
          for: 5m
          labels:
            severity: warning
            component: slo
            slo: adapter_success
          annotations:
            summary: "Adapter Success SLO fast burn rate detected"
            description: |
              Adapter success error budget is burning at {{ $value | printf "%.2f" }}% per hour.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-adapter-success.md"





        - record: ishastra:sli:findings_latency:ratio_rate5m
          expr: |
            sum(rate(ishastra_job_duration_seconds_bucket{le="300.0"}[5m]))
            /
            sum(rate(ishastra_job_duration_seconds_count[5m]))


        - record: ishastra:slo:findings_latency:target
          expr: 0.99

        - record: ishastra:slo:findings_latency:error_budget_remaining
          expr: |
            (
              1 - (0.99 - ishastra:sli:findings_latency:ratio_rate5m)
            ) / (1 - 0.99)





        - record: ishastra:sli:webhook_delivery:ratio_rate5m
          expr: |
            sum(rate(ishastra_webhook_deliveries_total{status="success"}[5m]))
            /
            sum(rate(ishastra_webhook_deliveries_total[5m]))


        - record: ishastra:slo:webhook_delivery:target
          expr: 0.995

        - record: ishastra:slo:webhook_delivery:error_budget_remaining
          expr: |
            (
              1 - (0.995 - ishastra:sli:webhook_delivery:ratio_rate5m)
            ) / (1 - 0.995)

        - alert: IshastraSLOWebhookDeliveryFastBurn
          expr: |
            (1 - ishastra:sli:webhook_delivery:ratio_rate1h) / (1 - 0.995) > 0.02
          for: 5m
          labels:
            severity: warning
            component: slo
            slo: webhook_delivery
          annotations:
            summary: "Webhook Delivery SLO fast burn rate detected"
            description: |
              Webhook delivery error budget is burning at {{ $value | printf "%.2f" }}% per hour.
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-webhook-delivery.md"





        - record: ishastra:sli:auth_success:ratio_rate5m
          expr: |
            sum(rate(ishastra_auth_success_total[5m]))
            /
            (sum(rate(ishastra_auth_success_total[5m])) + sum(rate(ishastra_auth_failures_total[5m])))


        - record: ishastra:slo:auth_success:target
          expr: 0.999

        - record: ishastra:slo:auth_success:error_budget_remaining
          expr: |
            (
              1 - (0.999 - ishastra:sli:auth_success:ratio_rate5m)
            ) / (1 - 0.999)





        - record: ishastra:slo:overall:healthy
          expr: |
            min(
              ishastra:sli:api_availability:ratio_rate5m / 0.999,
              ishastra:sli:api_latency_p99:ratio_rate5m / 0.99,
              ishastra:sli:job_completion:ratio_rate5m / 0.95,
              ishastra:sli:adapter_success:ratio_rate5m / 0.99
            )

        - alert: IshastraSLOOverallDegraded
          expr: |
            ishastra:slo:overall:healthy < 1
          for: 5m
          labels:
            severity: critical
            component: slo
            slo: overall
          annotations:
            summary: "Overall service health SLO degraded"
            description: |
              One or more critical SLOs are below target.
              Overall health score: {{ $value | printf "%.2f" }}
            runbook_url: "https://github.com/hacker-194/IshAstra/blob/main/docs/runbooks/slo-overall.md"




        - record: ishastra:slo:error_budget:api_availability:burn_rate_1h
          expr: |
            (1 - ishastra:sli:api_availability:ratio_rate1h) / (1 - 0.999)

        - record: ishastra:slo:error_budget:api_availability:burn_rate_6h
          expr: |
            (1 - ishastra:sli:api_availability:ratio_rate6h) / (1 - 0.999)

        - record: ishastra:slo:error_budget:api_latency_p99:burn_rate_1h
          expr: |
            (1 - ishastra:sli:api_latency_p99:ratio_rate1h) / (1 - 0.99)

        - record: ishastra:slo:error_budget:api_latency_p99:burn_rate_6h
          expr: |
            (1 - ishastra:sli:api_latency_p99:ratio_rate6h) / (1 - 0.99)

        - record: ishastra:slo:error_budget:job_completion:burn_rate_1h
          expr: |
            (1 - ishastra:sli:job_completion:ratio_rate1h) / (1 - 0.95)

        - record: ishastra:slo:error_budget:job_completion:burn_rate_6h
          expr: |
            (1 - ishastra:sli:job_completion:ratio_rate6h) / (1 - 0.95)

        - record: ishastra:slo:error_budget:adapter_success:burn_rate_1h
          expr: |
            (1 - ishastra:sli:adapter_success:ratio_rate1h) / (1 - 0.99)

        - record: ishastra:slo:error_budget:adapter_success:burn_rate_6h
          expr: |
            (1 - ishastra:sli:adapter_success:ratio_rate6h) / (1 - 0.99)




        - record: ishastra:slo:compliance:api_availability:30d
          expr: |
            avg_over_time(ishastra:sli:api_availability:ratio_rate5m[30d]) >= 0.999

        - record: ishastra:slo:compliance:api_latency_p99:30d
          expr: |
            avg_over_time(ishastra:sli:api_latency_p99:ratio_rate5m[30d]) >= 0.99

        - record: ishastra:slo:compliance:job_completion:30d
          expr: |
            avg_over_time(ishastra:sli:job_completion:ratio_rate5m[30d]) >= 0.95

        - record: ishastra:slo:compliance:adapter_success:30d
          expr: |
            avg_over_time(ishastra:sli:adapter_success:ratio_rate5m[30d]) >= 0.99


        - record: ishastra:slo:compliance:overall:30d
          expr: |
            min(
              ishastra:slo:compliance:api_availability:30d,
              ishastra:slo:compliance:api_latency_p99:30d,
              ishastra:slo:compliance:job_completion:30d,
              ishastra:slo:compliance:adapter_success:30d
            )