# Tempo Configuration for Strix Distributed Tracing
# Deploy with: docker compose -f docker-compose.monitoring.yml -f docker-compose.tempo.yml up -d

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
    zipkin:
      endpoint: 0.0.0.0:9411

ingester:
  max_block_duration: 5m
  max_block_bytes: 1_048_576
  complete_block_timeout: 15m
  lifecycler:
    ring:
      replication_factor: 1
    final_sleep: 0s

compactor:
  compaction:
    block_retention: 336h  # 14 days
    compacted_block_retention: 1h
  compaction_window: 1h

storage:
  trace:
    backend: local
    local:
      path: /tempo/traces
    pool:
      max_workers: 100
      queue_depth: 10000
    wal:
      path: /tempo/wal
      encoding: snappy

# Blocklist for traces we don't want to store
blocklist:
  poll_interval: 5m

# Limits for multi-tenancy
limits:
  ingestion_rate_limit: 10MB
  ingestion_burst_limit: 20MB
  max_spans_per_trace: 10000
  max_trace_idle_time: 5m

# Query frontend
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  max_outstanding_requests_per_tenant: 100

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: strix-production
  storage:
    path: /tempo/metrics-generator
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      dimensions:
        - service.name
        - service.namespace
    span_metrics:
      dimensions:
        - service.name
        - span.name
        - span.kind
        - status.code

# Reporting
reporting:
  enabled: false

# Logging
log_level: info