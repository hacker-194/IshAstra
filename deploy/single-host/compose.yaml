# Single-host deployment: PostgreSQL + API + dispatcher + worker-manager + egress gateway + Caddy reverse proxy.
# Topology: one writer, PostgreSQL for queue/state, egress gateway for CONNECT proxy enforcement,
# dispatcher orchestrates jobs, worker-manager runs assessment workers, Caddy provides TLS termination.
#
# Services:
#   postgres   – PostgreSQL 16 with the ishastra_queue table (idempotent init).
#   ishastra   – The API + dispatcher process (built from source).
#   gateway    – Egress CONNECT proxy (bound to the dispatcher's job ID).
#   worker     – Assessment worker connected to the gateway network.
#   caddy      – TLS-terminating reverse proxy on ports 80/443.
#
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ishastra
      POSTGRES_DB: ishastra
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ishastra:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ishastra:${ISHASTRA_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ISHASTRA_ENV: development
      ISHASTRA_DB: postgres://postgres:ishastra@postgres:5432/ishastra
      ISHASTRA_SCOPE_FILE: /var/lib/ishastra/scope.json
      ISHASTRA_LOG_FORMAT: json
      ISHASTRA_LOG_LEVEL: ${ISHASTRA_LOG_LEVEL:-INFO}
      ISHASTRA_WORKERS: ${ISHASTRA_WORKERS:-2}
      ISHASTRA_TRUSTED_PROXIES: ${ISHASTRA_TRUSTED_PROXIES:-172.16.0.0/12}
      ISHASTRA_GATEWAY_URL: http://gateway:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ishastra_data:/var/lib/ishastra
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ishastra:${ISHASTRA_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ISHASTRA_ENV: development
      ISHASTRA_DB: postgres://postgres:ishastra@postgres:5432/ishastra
      ISHASTRA_SCOPE_FILE: /var/lib/ishastra/scope.json
      ISHASTRA_LOG_FORMAT: json
      ISHASTRA_LOG_LEVEL: ${ISHASTRA_LOG_LEVEL:-INFO}
      ISHASTRA_JOB_ID: Ishastra-Gateway-Scan
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ishastra_data:/var/lib/ishastra
    expose:
      - "8080"  # CONNECT proxy port
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ishastra:${ISHASTRA_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ISHASTRA_ENV: development
      ISHASTRA_DB: postgres://postgres:ishastra@postgres:5432/ishastra
      ISHASTRA_SCOPE_FILE: /var/lib/ishastra/scope.json
      ISHASTRA_LOG_FORMAT: json
      ISHASTRA_LOG_LEVEL: ${ISHASTRA_LOG_LEVEL:-INFO}
      ISHASTRA_WORKERS: "1"
      ISHASTRA_GATEWAY_URL: http://gateway:8080
      ISHASTRA_JOB_ID: Ishastra-Worker-Scan
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    volumes:
      - ishastra_data:/var/lib/ishastra
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ishastra:
        condition: service_healthy

volumes:
  postgres_data:
  ishastra_data:
  caddy_data:
  caddy_config: