services:
  postgres:
    image: postgres:16-alpine
    container_name: ishastra-postgres
    environment:
      POSTGRES_DB: ishastra
      POSTGRES_USER: ishastra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (no default credential)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ishastra -d ishastra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ishastra-network

  redis:
    image: redis:7-alpine
    container_name: ishastra-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ishastra-network

  scope-gate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: ishastra-scope-gate
    image: ishastra/scope-gate:dev
    environment:
      - ISHASTRA_DATABASE_URL=postgresql://ishastra:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ishastra
      - ISHASTRA_REDIS_URL=redis://redis:6379/0
      - ISHASTRA_SCOPE_DIR=/etc/ishastra/scopes
      - ISHASTRA_SCOPE_JWKS=/etc/ishastra/scope-jwks.json
      - ISHASTRA_SCOPE_MAX_AGE_SECONDS=86400
      - ISHASTRA_OIDC_ISSUER=${ISHASTRA_OIDC_ISSUER:-}
      - ISHASTRA_OIDC_CLIENT_ID=${ISHASTRA_OIDC_CLIENT_ID:-}
      - ISHASTRA_OIDC_CLIENT_SECRET=${ISHASTRA_OIDC_CLIENT_SECRET:-}
      - ISHASTRA_OIDC_REDIRECT_URI=${ISHASTRA_OIDC_REDIRECT_URI:-}
      - ISHASTRA_LOG_LEVEL=INFO
      - ISHASTRA_METRICS_ENABLED=true
      - ISHASTRA_OTEL_ENABLED=false
      - PYTHONUNBUFFERED=1
    volumes:
      - ./examples/scopes:/etc/ishastra/scopes:ro
      - ./examples/jwks:/etc/ishastra:ro
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ishastra-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ishastra-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - ishastra-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ishastra-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env (no default credential)}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - ishastra-network

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: ishastra-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - jaeger_data:/var/lib/jaeger
    networks:
      - ishastra-network

  nginx:
    image: nginx:alpine
    container_name: ishastra-nginx
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - scope-gate
    networks:
      - ishastra-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: ishastra-keycloak
    profiles: ["sso"]
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env (no default credential)}
      KC_HOSTNAME: keycloak.localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      ishastra-network:
        aliases:
          - keycloak.localhost

networks:
  ishastra-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  jaeger_data:
  keycloak_data:
