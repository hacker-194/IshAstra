









splunk_hec:
  type: "splunk_hec"
  enabled: true
  host: "splunk.example.com"
  port: 8088
  token: "${SPLUNK_HEC_TOKEN}"
  index: "main"
  sourcetype: "_json"
  use_ssl: true
  verify_ssl: true
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


elastic:
  type: "elastic"
  enabled: true
  hosts:
    - "https://elasticsearch.example.com:9200"


  api_key: "${ELASTIC_API_KEY}"



  index: "ishastra-findings-%{+yyyy.MM.dd}"
  verify_ssl: true
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


datadog:
  type: "datadog"
  enabled: true
  api_key: "${DATADOG_API_KEY}"
  site: "datadoghq.com"
  ddsource: "ishastra"
  ddtags: "env:prod,team:security"
  service: "ishastra"
  host: "ishastra-scanner"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


sentinel:
  type: "sentinel"
  enabled: true
  workspace_id: "${SENTINEL_WORKSPACE_ID}"
  shared_key: "${SENTINEL_SHARED_KEY}"
  log_type: "IshastraFindings"





  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0







jira:
  type: "jira"
  enabled: true
  base_url: "https://company.atlassian.net"
  email: "security@company.com"
  api_token: "${JIRA_API_TOKEN}"
  project_key: "SEC"
  issue_type: "Task"
  default_priority: "Medium"
  labels: ["ishastra", "automated", "security"]
  custom_fields:
    "customfield_10001": "Security Team"
    "customfield_10002": "External"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


github_issues:
  type: "github_issues"
  enabled: true
  token: "${GITHUB_TOKEN}"
  owner: "myorg"
  repo: "security-tracking"
  labels: ["ishastra", "security", "automated"]
  assignees: ["security-team"]
  projects: [1, 2]
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


gitlab_issues:
  type: "gitlab_issues"
  enabled: true
  base_url: "https://gitlab.com"
  token: "${GITLAB_TOKEN}"
  project_id: "mygroup/myproject"
  labels: ["ishastra", "security", "automated"]
  assignee_ids: [12345, 67890]
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


servicenow:
  type: "servicenow"
  enabled: true
  instance_url: "https://company.service-now.com"

  username: "ishastra.integration"
  password: "${SERVICENOW_PASSWORD}"



  table: "incident"
  caller_id: "ishastra.integration"
  assignment_group: "Security Operations"
  category: "security"
  subcategory: "vulnerability"
  impact: "2"
  urgency: "2"
  ci_identifier_field: "name"
  custom_fields:
    "u_strix_scanner": "ishastra-v3.5"
  timeout_seconds: 60.0
  retry_attempts: 3
  retry_backoff_seconds: 2.0







slack:
  type: "slack"
  enabled: true

  webhook_url: "${SLACK_WEBHOOK_URL}"



  default_channel: "#security-alerts"
  username: "ishastra"
  icon_emoji: ":shield:"
  timeout_seconds: 15.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


teams:
  type: "teams"
  enabled: true
  webhook_url: "${TEAMS_WEBHOOK_URL}"
  timeout_seconds: 15.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


mattermost:
  type: "mattermost"
  enabled: true
  webhook_url: "${MATTERMOST_WEBHOOK_URL}"
  username: "ishastra"
  icon_url: "https://example.com/ishastra-icon.png"
  channel: "security-alerts"
  timeout_seconds: 15.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0







github_actions:
  type: "github_actions"
  enabled: true
  token: "${GITHUB_ACTIONS_TOKEN}"
  owner: "myorg"
  repo: "security-pipeline"
  workflow_file: "security-scan.yml"
  ref: "main"
  inputs:
    scan_type: "full"
    severity_threshold: "medium"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


gitlab_ci:
  type: "gitlab_ci"
  enabled: true
  base_url: "https://gitlab.com"
  token: "${GITLAB_CI_TOKEN}"
  project_id: "mygroup/myproject"
  ref: "main"
  variables:
    SCAN_TYPE: "full"
    SEVERITY_THRESHOLD: "medium"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0







webhook:
  type: "webhook"
  enabled: true
  url: "https://my-system.example.com/webhook/ishastra"
  secret: "${WEBHOOK_SECRET}"
  signature_header: "X-Ishastra-Signature"
  timestamp_header: "X-Ishastra-Timestamp"
  content_type: "application/json"
  custom_headers:
    "X-Source": "ishastra"
    "X-Version": "3.5.0"
  max_retries: 5
  initial_backoff_seconds: 1.0
  max_backoff_seconds: 60.0
  dead_letter_queue_size: 1000
  timeout_seconds: 30.0







vault:
  type: "vault"
  enabled: true
  address: "https://vault.example.com"

  token: "${VAULT_TOKEN}"







  mount_point: "secret"
  namespace: "security"
  transit_key: "ishastra-encryption"
  verify_ssl: true
  timeout_seconds: 30.0


aws_secretsmanager:
  type: "aws_secretsmanager"
  enabled: true
  region: "us-east-1"






  kms_key_id: "alias/ishastra-secrets"
  timeout_seconds: 30.0


azure_keyvault:
  type: "azure_keyvault"
  enabled: true
  vault_url: "https://ishastra-secrets.vault.azure.net"
  tenant_id: "${AZURE_TENANT_ID}"
  client_id: "${AZURE_CLIENT_ID}"
  client_secret: "${AZURE_CLIENT_SECRET}"
  timeout_seconds: 30.0


gcp_secretmanager:
  type: "gcp_secretmanager"
  enabled: true
  project_id: "my-gcp-project"
  credentials_path: "/path/to/service-account.json"
  location: "global"
  timeout_seconds: 30.0