# Strix Integration Configuration Examples
#
# Copy this file to config/integrations.yaml and customize for your environment.
# All secrets should be provided via environment variables or secret management.

# =============================================================================
# SIEM CONNECTORS
# =============================================================================

# Splunk HTTP Event Collector (HEC)
splunk_hec:
  type: "splunk_hec"
  enabled: true
  host: "splunk.example.com"
  port: 8088
  token: "${SPLUNK_HEC_TOKEN}"  # Set via environment variable
  index: "main"
  sourcetype: "_json"
  use_ssl: true
  verify_ssl: true
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# Elasticsearch / Elastic Cloud
elastic:
  type: "elastic"
  enabled: true
  hosts:
    - "https://elasticsearch.example.com:9200"
  # Alternative: use Elastic Cloud ID
  # cloud_id: "my-cluster:base64encoded..."
  api_key: "${ELASTIC_API_KEY}"  # Base64 encoded id:key
  # Or use basic auth:
  # username: "elastic"
  # password: "${ELASTIC_PASSWORD}"
  index: "strix-findings-%{+yyyy.MM.dd}"
  verify_ssl: true
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# Datadog Logs Intake
datadog:
  type: "datadog"
  enabled: true
  api_key: "${DATADOG_API_KEY}"
  site: "datadoghq.com"  # or datadoghq.eu, us3.datadoghq.com, etc.
  ddsource: "strix"
  ddtags: "env:prod,team:security"
  service: "strix"
  host: "strix-scanner"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# Microsoft Azure Sentinel (Log Analytics)
sentinel:
  type: "sentinel"
  enabled: true
  workspace_id: "${SENTINEL_WORKSPACE_ID}"
  shared_key: "${SENTINEL_SHARED_KEY}"  # Base64 encoded
  log_type: "StrixFindings"
  # Alternative: Azure AD authentication
  # use_azure_ad: true
  # tenant_id: "${AZURE_TENANT_ID}"
  # client_id: "${AZURE_CLIENT_ID}"
  # client_secret: "${AZURE_CLIENT_SECRET}"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


# =============================================================================
# TICKETING CONNECTORS
# =============================================================================

# Jira Cloud / Data Center
jira:
  type: "jira"
  enabled: true
  base_url: "https://company.atlassian.net"
  email: "security@company.com"
  api_token: "${JIRA_API_TOKEN}"
  project_key: "SEC"
  issue_type: "Task"
  default_priority: "Medium"
  labels: ["strix", "automated", "security"]
  custom_fields:
    "customfield_10001": "Security Team"  # Example custom field
    "customfield_10002": "External"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# GitHub Issues
github_issues:
  type: "github_issues"
  enabled: true
  token: "${GITHUB_TOKEN}"  # Classic PAT or GitHub App token
  owner: "myorg"
  repo: "security-tracking"
  labels: ["strix", "security", "automated"]
  assignees: ["security-team"]
  projects: [1, 2]  # Project board IDs
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# GitLab Issues
gitlab_issues:
  type: "gitlab_issues"
  enabled: true
  base_url: "https://gitlab.com"  # Or self-hosted: https://gitlab.company.com
  token: "${GITLAB_TOKEN}"  # Personal access token with api scope
  project_id: "mygroup/myproject"  # Or numeric project ID
  labels: ["strix", "security", "automated"]
  assignee_ids: [12345, 67890]  # User IDs
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# ServiceNow Incident Management
servicenow:
  type: "servicenow"
  enabled: true
  instance_url: "https://company.service-now.com"
  # Basic auth
  username: "strix.integration"
  password: "${SERVICENOW_PASSWORD}"
  # Or OAuth:
  # client_id: "${SERVICENOW_CLIENT_ID}"
  # client_secret: "${SERVICENOW_CLIENT_SECRET}"
  table: "incident"
  caller_id: "strix.integration"
  assignment_group: "Security Operations"
  category: "security"
  subcategory: "vulnerability"
  impact: "2"  # 1=High, 2=Medium, 3=Low
  urgency: "2"  # 1=High, 2=Medium, 3=Low
  ci_identifier_field: "name"  # For CMDB linking
  custom_fields:
    "u_strix_scanner": "strix-v3.5"
  timeout_seconds: 60.0
  retry_attempts: 3
  retry_backoff_seconds: 2.0


# =============================================================================
# CHATOPS CONNECTORS
# =============================================================================

# Slack (Webhook or Bot API)
slack:
  type: "slack"
  enabled: true
  # Webhook URL (simpler, no bot token needed)
  webhook_url: "${SLACK_WEBHOOK_URL}"
  # Or Bot API (for richer features):
  # bot_token: "${SLACK_BOT_TOKEN}"  # xoxb-...
  # app_token: "${SLACK_APP_TOKEN}"  # xapp-... for Socket Mode
  default_channel: "#security-alerts"
  username: "strix"
  icon_emoji: ":shield:"
  timeout_seconds: 15.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# Microsoft Teams
teams:
  type: "teams"
  enabled: true
  webhook_url: "${TEAMS_WEBHOOK_URL}"
  timeout_seconds: 15.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# Mattermost
mattermost:
  type: "mattermost"
  enabled: true
  webhook_url: "${MATTERMOST_WEBHOOK_URL}"
  username: "strix"
  icon_url: "https://example.com/strix-icon.png"
  channel: "security-alerts"  # Optional override
  timeout_seconds: 15.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


# =============================================================================
# CI/CD CONNECTORS
# =============================================================================

# GitHub Actions Workflow Dispatch
github_actions:
  type: "github_actions"
  enabled: true
  token: "${GITHUB_ACTIONS_TOKEN}"  # Token with workflow scope
  owner: "myorg"
  repo: "security-pipeline"
  workflow_file: "security-scan.yml"
  ref: "main"
  inputs:
    scan_type: "full"
    severity_threshold: "medium"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0

# GitLab CI/CD Pipeline Trigger
gitlab_ci:
  type: "gitlab_ci"
  enabled: true
  base_url: "https://gitlab.com"
  token: "${GITLAB_CI_TOKEN}"  # Trigger token or PAT with api scope
  project_id: "mygroup/myproject"
  ref: "main"
  variables:
    SCAN_TYPE: "full"
    SEVERITY_THRESHOLD: "medium"
  timeout_seconds: 30.0
  retry_attempts: 3
  retry_backoff_seconds: 1.0


# =============================================================================
# WEBHOOK FRAMEWORK
# =============================================================================

# Generic Webhook with HMAC Signing
webhook:
  type: "webhook"
  enabled: true
  url: "https://my-system.example.com/webhook/strix"
  secret: "${WEBHOOK_SECRET}"  # HMAC secret, min 16 chars
  signature_header: "X-Strix-Signature"
  timestamp_header: "X-Strix-Timestamp"
  content_type: "application/json"
  custom_headers:
    "X-Source": "strix"
    "X-Version": "3.5.0"
  max_retries: 5
  initial_backoff_seconds: 1.0
  max_backoff_seconds: 60.0
  dead_letter_queue_size: 1000
  timeout_seconds: 30.0


# =============================================================================
# VAULT INTEGRATIONS
# =============================================================================

# HashiCorp Vault
vault:
  type: "vault"
  enabled: true
  address: "https://vault.example.com"
  # Token auth (simplest)
  token: "${VAULT_TOKEN}"
  # Or AppRole auth:
  # auth_method: "approle"
  # role_id: "${VAULT_ROLE_ID}"
  # secret_id: "${VAULT_SECRET_ID}"
  # Or Kubernetes auth:
  # auth_method: "kubernetes"
  # kubernetes_role: "strix-scanner"
  mount_point: "secret"
  namespace: "security"  # Enterprise only
  transit_key: "strix-encryption"  # For transit encryption
  verify_ssl: true
  timeout_seconds: 30.0

# AWS Secrets Manager
aws_secretsmanager:
  type: "aws_secretsmanager"
  enabled: true
  region: "us-east-1"
  # Use IAM role (recommended) or explicit credentials:
  # access_key_id: "${AWS_ACCESS_KEY_ID}"
  # secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  # Or assume role:
  # role_arn: "arn:aws:iam::123456789012:role/StrixSecretsRole"
  # endpoint_url: "http://localhost:4566"  # For LocalStack
  kms_key_id: "alias/strix-secrets"
  timeout_seconds: 30.0

# Azure Key Vault
azure_keyvault:
  type: "azure_keyvault"
  enabled: true
  vault_url: "https://strix-secrets.vault.azure.net"
  tenant_id: "${AZURE_TENANT_ID}"
  client_id: "${AZURE_CLIENT_ID}"
  client_secret: "${AZURE_CLIENT_SECRET}"
  timeout_seconds: 30.0

# GCP Secret Manager
gcp_secretmanager:
  type: "gcp_secretmanager"
  enabled: true
  project_id: "my-gcp-project"
  credentials_path: "/path/to/service-account.json"  # Or use ADC
  location: "global"
  timeout_seconds: 30.0