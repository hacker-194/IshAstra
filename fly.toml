# fly.toml app configuration file generated for ishatra on 2026-11-20T14:58:58+05:45
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ishatra'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  ISHASTRA_LOG_FORMAT = 'json'
  ISHASTRA_LOG_LEVEL = 'INFO'
  ISHASTRA_SCOPE_FILE = '/var/lib/ishastra/scope.json'
  ISHASTRA_WORKERS = '1'

[[mounts]]
  source = 'ishastra_data'
  destination = '/var/lib/ishastra'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
