# Strix ScopeGate - Production Kubernetes Deployment
# 
# This deployment includes:
# - Deployment with HPA for autoscaling
# - Service for internal load balancing
# - ConfigMap for scope configuration
# - Secret for signing keys
# - ServiceMonitor for Prometheus
# - NetworkPolicy for security

apiVersion: v1
kind: Namespace
metadata:
  name: strix
  labels:
    name: strix
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: strix-config
  namespace: strix
data:
  STRIX_SCOPE_DIR: "/etc/strix/scopes"
  STRIX_SCOPE_JWKS: "/etc/strix/scope-jwks.json"
  STRIX_SCOPE_MAX_AGE_SECONDS: "86400"
  STRIX_SCOPE_JIT_URL: ""
  STRIX_LOG_LEVEL: "INFO"
  STRIX_METRICS_ENABLED: "true"
  STRIX_OTEL_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: strix-secrets
  namespace: strix
type: Opaque
stringData:
  SCOPE_SIGNING_KEY: "REPLACE_WITH_BASE64_ENCODED_ED25519_PRIVATE_KEY"
  DATABASE_ENCRYPTION_KEY: "REPLACE_WITH_BASE64_ENCODED_KEY"
  ADMIN_API_KEY: "sk_admin_REPLACE_WITH_SECURE_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strix-scope-gate
  namespace: strix
  labels:
    app: strix-scope-gate
    component: api
    version: v3.5.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: strix-scope-gate
  template:
    metadata:
      labels:
        app: strix-scope-gate
        component: api
        version: v3.5.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: strix-scope-gate
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scope-gate
          image: strix/scope-gate:v3.5.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: strix-config
            - secretRef:
                name: strix-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: scopes
              mountPath: /etc/strix/scopes
              readOnly: true
            - name: jwks
              mountPath: /etc/strix/scope-jwks.json
              subPath: scope-jwks.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scopes
          configMap:
            name: strix-scopes
            defaultMode: 0444
        - name: jwks
          secret:
            secretName: strix-jwks
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - strix-scope-gate
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: strix-scope-gate
  namespace: strix
  labels:
    app: strix-scope-gate
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: strix-scope-gate
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: strix-scope-gate-hpa
  namespace: strix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: strix-scope-gate
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: strix_scope_gate_decisions_total
        target:
          type: AverageValue
          averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strix-scope-gate-network-policy
  namespace: strix
spec:
  podSelector:
    matchLabels:
      app: strix-scope-gate
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: strix-api-gateway
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: strix-scope-gate-monitor
  namespace: strix
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: strix-scope-gate
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
      # /api/metrics is administrator-only: send the bootstrap key.
      authorization:
        type: Bearer
        credentials:
          name: strix-secrets
          key: ADMIN_API_KEY
  namespaceSelector:
    matchNames:
      - strix
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strix-scope-gate
  namespace: strix
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strix-scope-gate
  namespace: strix
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strix-scope-gate
  namespace: strix
subjects:
  - kind: ServiceAccount
    name: strix-scope-gate
    namespace: strix
roleRef:
  kind: Role
  name: strix-scope-gate
  apiGroup: rbac.authorization.k8s.io
