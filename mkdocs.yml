





site_name: Ishastra Documentation
site_description: Authorization-First Security Assessment Platform
site_url: https://ishastra.dev
site_author: Ishastra Contributors
repo_url: https://github.com/hacker-194/IshAstra
repo_name: hacker-194/IshAstra
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024 Ishastra Contributors — Apache-2.0

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/shield-check
    repo: fontawesome/brands/github

plugins:
  - search
  # No git-revision-date-localized: it warns on files whose git history is
  # missing (renames, fresh checkouts) and `mkdocs build --strict` treats that
  # as fatal, so the docs deploy would fail for reasons unrelated to content.
  - minify:
      minify_html: true
  - glightbox
  - mermaid2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page

