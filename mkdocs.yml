          - Queue Backlog: runbooks/queue-backlog.md
          - Scope Gate Denials: runbooks/scope-gate-denials.md
          - Worker OOM: runbooks/worker-oom.md
  - API Reference:
      - Authentication: api/authentication.md
      - Assessments: api/assessments.md
