[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ishastra"
version = "3.5.0"
description = "Authorized security assessment platform: scope gate, adapters, findings and evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["security", "pentest", "authorization", "sarif", "scope-gate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.162,<1.0",


    "starlette>=1.3.1,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "defusedxml>=0.7.1,<1.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "redis>=6.1,<7.0",
    "cryptography>=42.0,<51.0",
    "prometheus-client>=0.20,<1.0",
    "apscheduler>=3.10,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "croniter>=2.0,<8.0",
    "pytz>=2024.1,<2025.0",
    "weasyprint>=61.0,<62.0",
    "pyjwt>=2.8,<3.0",
    "python3-saml>=1.16,<2.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5,<8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
    "hypothesis>=6.100,<7.0",
]

postgres = ["asyncpg>=0.30,<1.0"]



dev = ["ishastra[test]", "ruff>=0.6", "mypy>=1.10"]


mutation = ["mutmut>=3.7,<4.0"]

k8s-jobs = ["kubernetes>=30.0,<31.0"]



otel = [
    "opentelemetry-api>=1.44,<2.0",
    "opentelemetry-sdk>=1.44,<2.0",


    "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1.0",
    "opentelemetry-instrumentation-redis>=0.65b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1.0",
    "opentelemetry-instrumentation-urllib>=0.65b0,<1.0",
    "opentelemetry-instrumentation-logging>=0.65b0,<1.0",
    "opentelemetry-exporter-otlp>=1.44,<2.0",
    "opentelemetry-exporter-prometheus>=0.65b0,<1.0",
]

hexstrike = ["fastmcp>=0.2.0,<1.0", "aiohttp>=3.8,<4.0", "beautifulsoup4>=4.12,<5.0", "selenium>=4.15,<5.0", "webdriver-manager>=4.0,<5.0", "mitmproxy>=11.0,<13.0", "pwntools>=4.10,<5.0", "angr>=9.2,<10.0"]

vault = ["hvac>=2.0,<3.0"]

slsa = ["in-toto>=1.0,<2.0"]

dr = ["asyncpg>=0.30,<1.0", "boto3>=1.34,<2.0", "google-cloud-storage>=2.16,<3.0"]

[project.scripts]
ishastra = "ishastra.cli:main"
ishastra-collab = "ishastra.core.collab:main"
ishastra-operator = "ishastra.operator.main:run_operator"

[project.urls]
Homepage = "https://github.com/hacker-194/IshAstra"
Documentation = "https://github.com/hacker-194/IshAstra/tree/master/docs"
Repository = "https://github.com/hacker-194/IshAstra"
Issues = "https://github.com/hacker-194/IshAstra/issues"
Changelog = "https://github.com/hacker-194/IshAstra/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ishastra.api" = ["static/*"]
"ishastra" = ["rules/*.yml"]
"ishastra.core" = ["scope_schema.json"]
"ishastra.lab" = ["oracle.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=json",
    "--cov-fail-under=50",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (require external services)",
    "e2e: marks tests as end-to-end API tests",
    "slow: marks tests as slow (>5s)",
    "auth: marks tests as requiring authentication setup",
    "scope: marks tests as requiring scope configuration",
    "external: marks tests requiring external tools (nmap, nuclei)",
    "asyncio: marks tests as async",
]


[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET"]
ignore = [
    "B008",
    "UP042",
    "C408",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.mutmut]


source_paths = ["src"]
only_mutate = ["src/ishastra/core/scope.py"]
pytest_add_cli_args = ["-o", "addopts=", "-q", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_scope.py",
    "tests/unit/test_scope_gate.py",
]
