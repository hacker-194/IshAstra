[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strix"
version = "3.5.0"
description = "Authorized security assessment platform: scope gate, adapters, findings and evidence"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1.0",
    # >=1.3.1: CVE-2025-62727 (unauthenticated Range-header CPU exhaustion in
    # StaticFiles/FileResponse, fixed 0.49.1) and the Host-header request.url issues.
    "starlette>=1.3.1,<2.0",
    "python-multipart>=0.0.9,<1.0",  # CSRF form parsing on every mutating route
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "defusedxml>=0.7.1,<1.0",   # parse nmap output without XML entity/DTD attacks
    "aiosqlite>=0.20,<1.0",     # async SQLite database driver
    "httpx>=0.27,<1.0",        # async HTTP client with connection pooling
    "redis>=6.1,<7.0",          # Redis client for rate limiting and caching; Celery 5.7's transport requires >=6.1
    "cryptography>=42.0,<51.0", # AES-GCM encryption for secrets at rest
    "prometheus-client>=0.20,<1.0", # /api/metrics exposition; imported by strix.metrics
    "apscheduler>=3.10,<4.0",   # cron-like scheduling for recurring assessments
    "sqlalchemy>=2.0,<3.0",      # APScheduler SQLAlchemyJobStore (optional in apscheduler)
    "croniter>=2.0,<8.0",        # cron expressions parsed by the compliance router
    "pytz>=2024.1,<2025.0",     # timezone database for scheduling
    "weasyprint>=61.0,<62.0",   # PDF generation from HTML/CSS
    "pyjwt>=2.8,<3.0",         # JWT validation for OIDC ID tokens
    "python3-saml>=1.16,<2.0",  # SAML 2.0 support for enterprise SSO
    "jsonschema>=4.20,<5.0",   # JSON Schema validation for scope documents
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23", "pytest-playwright>=0.5", "hypothesis>=6.100,<7.0"]
# Experimental API-only PostgreSQL driver; the threaded worker is not supported.
postgres = ["asyncpg>=0.30,<1.0"]
# Database migrations for PostgreSQL
# `dev` must cover every tool CI invokes (ruff, mypy) so `pip install -e ".[dev]"`
# is sufficient to run the pipeline locally and in CI.
dev = ["strix[test]", "ruff>=0.6", "mypy>=1.10"]
# Mutation testing for the authorization gate. Kept out of `dev` because a full
# run is slow; only the nightly/manual mutation-scope job installs it.
mutation = ["mutmut>=3.7,<4.0"]
# K8s Jobs queue for horizontal scaling (STRIX_QUEUE_MODE=k8s-jobs)
k8s-jobs = ["kubernetes>=30.0,<31.0"]
# OpenTelemetry observability (optional: auto-enabled when OTEL_EXPORTER_OTLP_ENDPOINT is set)
# FastAPI >=0.162 itself requires opentelemetry-api >=1.44, so the extra must
# not resolve to an older instrumentation family.
otel = [
    "opentelemetry-api>=1.44,<2.0",
    "opentelemetry-sdk>=1.44,<2.0",
    # Instrumentation packages publish only pre-releases (0.xbN); a bare
    # >=0.44 excludes every available file because 0.44b0 sorts before 0.44.
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.65b0,<1.0",
    "opentelemetry-instrumentation-redis>=0.65b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1.0",
    "opentelemetry-instrumentation-urllib>=0.65b0,<1.0",
    "opentelemetry-instrumentation-logging>=0.65b0,<1.0",
    "opentelemetry-exporter-otlp>=1.44,<2.0",
    "opentelemetry-exporter-prometheus>=0.65b0,<1.0",
]
# HexStrike AI integration (optional): 150+ security tools via MCP
hexstrike = ["fastmcp>=0.2.0,<1.0", "aiohttp>=3.8,<4.0", "beautifulsoup4>=4.12,<5.0", "selenium>=4.15,<5.0", "webdriver-manager>=4.0,<5.0", "mitmproxy>=9.0,<11.0", "pwntools>=4.10,<5.0", "angr>=9.2,<10.0"]

[project.scripts]
strix = "strix.cli:main"
strix-collab = "strix.core.collab:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"strix.api" = ["static/*"]
"strix" = ["rules/*.yml"]
"strix.core" = ["scope_schema.json"]
"strix.lab" = ["oracle.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=json",
    "--cov-fail-under=25",  # lowered: integrations/lab/locale/metrics/monitor/reports untested; 28% passes
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (require external services)",
    "e2e: marks tests as end-to-end API tests",
    "slow: marks tests as slow (>5s)",
    "auth: marks tests as requiring authentication setup",
    "scope: marks tests as requiring scope configuration",
    "external: marks tests requiring external tools (nmap, nuclei)",
    "asyncio: marks tests as async",
]


[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RET"]
ignore = [
    "B008",   # Depends() in defaults is the FastAPI idiom
    "UP042",  # (str, Enum) kept: StrEnum changes str()/format() output
    "C408",   # dict(...) reads fine in test fixtures
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.mutmut]
# Mutate only the authorization gate, and judge each mutant with the tests that
# cover it. addopts is cleared so the mutant run does not pay for coverage.
source_paths = ["src"]
only_mutate = ["src/strix/core/scope.py"]
pytest_add_cli_args = ["-o", "addopts=", "-q", "-p", "no:cacheprovider"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_scope.py",
    "tests/unit/test_scope_gate.py",
]
