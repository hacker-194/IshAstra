rules:
  - id: strix.python.subprocess-shell-true
    languages: [python]
    severity: WARNING
    message: "subprocess call uses shell=True; untrusted input can cause command injection. Prefer an argument array with shell=False."
    metadata:
      cwe: CWE-78
      confidence: MEDIUM
      category: security
      references: https://cwe.mitre.org/data/definitions/78.html
    patterns:
      - pattern: subprocess.$METHOD(..., shell=True, ...)

  - id: strix.python.dynamic-eval
    languages: [python]
    severity: ERROR
    message: "eval() executes dynamically constructed Python code. Avoid it for untrusted input."
    metadata:
      cwe: CWE-95
      confidence: MEDIUM
      category: security
      references: https://cwe.mitre.org/data/definitions/95.html
    pattern: eval(...)

  - id: strix.python.pickle-loads
    languages: [python]
    severity: ERROR
    message: "pickle deserialization can execute attacker-controlled code when the input is untrusted."
    metadata:
      cwe: CWE-502
      confidence: MEDIUM
      category: security
      references: https://cwe.mitre.org/data/definitions/502.html
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)

  - id: strix.python.yaml-unsafe-load
    languages: [python]
    severity: WARNING
    message: "yaml.load may construct unsafe Python objects. Prefer yaml.safe_load for untrusted YAML."
    metadata:
      cwe: CWE-502
      confidence: LOW
      category: security
      references: https://cwe.mitre.org/data/definitions/502.html
    pattern: yaml.load($DATA)

  - id: strix.python.requests-verify-disabled
    languages: [python]
    severity: WARNING
    message: "TLS certificate verification is disabled for an HTTP request."
    metadata:
      cwe: CWE-295
      confidence: MEDIUM
      category: security
      references: https://cwe.mitre.org/data/definitions/295.html
    pattern: requests.$METHOD(..., verify=False, ...)

  - id: strix.javascript.dynamic-eval
    languages: [javascript, typescript]
    severity: WARNING
    message: "eval() executes dynamically constructed JavaScript and can introduce injection risk."
    metadata:
      cwe: CWE-95
      confidence: LOW
      category: security
      references: https://cwe.mitre.org/data/definitions/95.html
    pattern: eval(...)
